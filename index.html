  // ---------- 結果のシェア（X へのポスト・戦績カードの画像） ----------
  // 公開しているページのアドレス（自分のパソコンで開いているときは公開先のアドレス）
  function pageUrl() {
    const l = window.location;
    if (/^https?:$/.test(l.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(l.hostname)) return l.origin + l.pathname;
    return GAME_URL;
  }
  function modeLabel(R) {
    return R.daily ? `【日替わり ${R.daily.label}】` : '【通常】';
  }
  function resultHead(R) {
    const ph = R.stats.phasesCleared;
    if (R.endless) return `完走＋エンドレス 第${ph}期まで！（${R.stats.days}日）`;
    if (R.victory) return `第${PHASES}期まで完走！（${R.stats.days}日）`;
    if (ph > 0) return `第${ph}期まで達成（${R.stats.days}日）`;
    return `第1期で力尽きた…（${R.stats.days}日）`;
  }
  function postText(R) {
    const lines = [`コンベア錬金 ${modeLabel(R)}`, resultHead(R), `最高アイテム価値 ${fmt(R.stats.bestItem)}`];
    if (R.hi && R.hi.done) lines.push(`ハイスコア ${fmt(R.hi.total || 0)}`);
    if (lastReason === 'fail' || lastReason === 'endless') lines.push(`ノルマまであと${fmt(Math.max(0, R.quota - R.phaseScore))}足りなかった…！`);
    lines.push('#コンベア錬金', pageUrl());
    return lines.join('\n');
  }
  function postToX() {
    const R = G.run;
    if (!R) return;
    const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent(postText(R));
    window.open(url, '_blank', 'noopener');
  }
  // 戦績カード（1200×630）：タイトル・モード・結果・最高価値・最後の盤面のミニチュア・使った機械
  function makeResultCard(R) {
    const W2 = 1200;
    const H2 = 630;
    const cv = document.createElement('canvas');
    cv.width = W2;
    cv.height = H2;
    const c = cv.getContext('2d');
    const F = '"M PLUS 1p", "Yu Gothic UI", "Meiryo", sans-serif';
    const bg = c.createLinearGradient(0, 0, W2, H2);
    bg.addColorStop(0, '#1c1f2b');
    bg.addColorStop(1, '#0e1015');
    c.fillStyle = bg;
    c.fillRect(0, 0, W2, H2);
    c.strokeStyle = '#ffd44766';
    c.lineWidth = 4;
    c.strokeRect(14, 14, W2 - 28, H2 - 28);
    const pill = (x, y, text, fill, color) => {
      c.font = `900 26px ${F}`;
      const w = c.measureText(text).width + 32;
      c.fillStyle = fill;
      c.beginPath();
      c.roundRect ? c.roundRect(x, y, w, 44, 22) : c.rect(x, y, w, 44);
      c.fill();
      c.fillStyle = color;
      c.textBaseline = 'middle';
      c.fillText(text, x + 16, y + 23);
      c.textBaseline = 'alphabetic';
    };
    // タイトル
    c.font = `72px "DotGothic16", ${F}`;
    c.fillStyle = '#ffd447';
    c.shadowColor = '#7a3b00';
    c.shadowOffsetY = 5;
    c.fillText('コンベア錬金', 56, 112);
    c.shadowColor = 'transparent';
    c.shadowOffsetY = 0;
    pill(60, 140, R.daily ? `日替わり ${R.daily.label}` : '通常モード', R.daily ? '#3b6dff' : '#2a2f3c', '#ffffff');
    // 結果
    c.fillStyle = R.victory ? '#ffd447' : '#e8ecf3';
    c.font = `900 54px ${F}`;
    c.fillText(R.endless ? `∞ エンドレス 第${R.stats.phasesCleared}期まで` : R.victory ? `第${PHASES}期まで完走！` : R.stats.phasesCleared > 0 ? `第${R.stats.phasesCleared}期まで達成` : '第1期で力尽きた…', 60, 266);
    c.font = `500 26px ${F}`;
    c.fillStyle = '#8b93a5';
    c.fillText(`${R.stats.days}日 ・ ${R.layout.name}`, 62, 306);
    c.fillText('最高アイテム価値', 62, 372);
    c.font = `900 60px ${F}`;
    c.fillStyle = '#7fd6ff';
    c.fillText(fmt(R.stats.bestItem), 60, 436);
    c.font = `700 28px ${F}`;
    c.fillStyle = '#e8ecf3';
    c.fillText(`総出荷額 ${fmt(R.stats.totalShipped)}`, 62, 486);
    if (R.hi && R.hi.done) c.fillText(`ハイスコア ${fmt(R.hi.total || 0)}`, 62, 526);
    else if (lastReason === 'fail' || lastReason === 'endless') {
      c.fillStyle = '#ff8f8f';
      c.fillText(`ノルマまであと ${fmt(Math.max(0, R.quota - R.phaseScore))} 足りなかった…！`, 62, 526);
    }
    c.font = `700 22px ${F}`;
    c.fillStyle = '#8b93a5';
    c.fillText(`#コンベア錬金　${pageUrl()}`, 62, 590);
    // 最後の盤面のミニチュア
    const T = 30;
    const bx = W2 - 60 - COLS * T;
    const by = 70;
    c.fillStyle = '#12141a';
    c.fillRect(bx - 8, by - 8, COLS * T + 16, ROWS * T + 16);
    c.strokeStyle = '#2a2f3c';
    c.lineWidth = 2;
    c.strokeRect(bx - 8, by - 8, COLS * T + 16, ROWS * T + 16);
    const P = R.path;
    c.strokeStyle = '#353b4e';
    c.lineWidth = T * 0.62;
    c.lineJoin = 'round';
    c.beginPath();
    P.forEach(([x, y], i) => (i ? c.lineTo : c.moveTo).call(c, bx + (x + 0.5) * T, by + (y + 0.5) * T));
    c.stroke();
    c.fillStyle = '#5a6378';
    c.fillRect(bx + P[0][0] * T + 4, by + P[0][1] * T + 4, T - 8, T - 8);
    c.fillStyle = '#ffb347';
    const e = P[P.length - 1];
    c.fillRect(bx + e[0] * T + 4, by + e[1] * T + 4, T - 8, T - 8);
    c.imageSmoothingEnabled = false;
    const ms = placedMachines();
    for (const m of ms) {
      const cs = cellsOf(m);
      const x0 = Math.min(...cs.map((q) => q[0]));
      const y0 = Math.min(...cs.map((q) => q[1]));
      const w = (Math.max(...cs.map((q) => q[0])) - x0 + 1) * T;
      const h = (Math.max(...cs.map((q) => q[1])) - y0 + 1) * T;
      c.fillStyle = MACHINES[m.type].color + '55';
      c.fillRect(bx + x0 * T + 2, by + y0 * T + 2, w - 4, h - 4);
      const s = T - 4;
      c.drawImage(Sprites.canvas(m.type), bx + x0 * T + (w - s) / 2, by + y0 * T + (h - s) / 2, s, s);
    }
    // 使った機械
    const n = {};
    for (const m of ms) n[m.type] = (n[m.type] || 0) + 1;
    const list = Object.entries(n).sort((a, b) => b[1] - a[1]).slice(0, 14);
    const ly = by + ROWS * T + 40;
    c.font = `700 20px ${F}`;
    c.fillStyle = '#8b93a5';
    c.fillText(list.length ? '使った機械' : '盤面に機械なし', bx - 4, ly);
    list.forEach(([t, k], i) => {
      const col = i % 7;
      const row = Math.floor(i / 7);
      const x = bx - 4 + col * 56;
      const y = ly + 14 + row * 62;
      c.fillStyle = '#1e222c';
      c.fillRect(x, y, 48, 48);
      c.drawImage(Sprites.canvas(t), x + 4, y + 4, 40, 40);
      if (k > 1) {
        c.font = `900 16px ${F}`;
        c.fillStyle = '#ffd447';
        c.fillText('×' + k, x + 26, y + 46);
      }
    });
    return cv;
  }
  function cardFileName(R) {
    const d = new Date();
    const p = (v) => String(v).padStart(2, '0');
    return `conveyor-alchemy-${R.daily ? 'daily-' + R.daily.key : `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}.png`;
  }
  function cardBlob(R) {
    return new Promise((res) => makeResultCard(R).toBlob((b) => res(b), 'image/png'));
  }
  async function saveCard(btn) {
    const R = G.run;
    if (!R) return;
    const blob = await cardBlob(R);
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = cardFileName(R);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    if (btn) {
      const old = btn.textContent;
      btn.textContent = '保存しました';
      setTimeout(() => (btn.textContent = old), 1600);
    }
  }
  async function shareCard() {
    const R = G.run;
    if (!R) return;
    const blob = await cardBlob(R);
    if (!blob) return;
    const file = new File([blob], cardFileName(R), { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: postText(R) });
    } catch (err) { /* シェアを閉じたとき */ }
  }

  // ---------- ヒント（日の終わりの画面） ----------
  let lastTip = -1;
  function tipHTML(cls = '') {
    // レバレッジがまだ使えないうち（はじめて完走する前）は、レバレッジの話は出さない
    const pool = TIPS.map((t, i) => i).filter((i) => levOpen() || !TIPS[i].includes('レバレッジ'));
    let i = pool[Math.floor(Math.random() * pool.length)];
    if (i === lastTip) i = pool[(pool.indexOf(i) + 1) % pool.length];
    lastTip = i;
    return `<div class="tipbox ${cls}"><b><i class="ic ic-bulb"></i> ヒント</b><span>${TIPS[i]}</span></div>`;
  }

  // ---------- 記録（自己ベストと最近のラン） ----------
  const RECORD_NAMES = { hiscore: 'ハイスコア', phase: '達成した納期', day: '到達した日', item: '最高価値アイテム', dayScore: '1日の出荷額', ratio: '超過倍率', lev: 'レバレッジ', total: '1ランの総出荷額', patents: '1ランの特許' };
  const fmtDate = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const ratioTxt = (r) => '×' + (r >= 1000 ? fmt(r) : (r || 0).toFixed(1));
  function runResult(h) {
    if (h.daily) return `【日替わり ${h.daily}】${h.win ? '完走' : `第${h.phases}期まで`}`;
    // 納期制になってからのラン（phases がある）
    if (h.phases != null) {
      if (h.win && h.endless) return `完走＋エンドレス 第${h.phases}期`;
      if (h.win && h.hi != null) return `完走＋ハイスコア ${fmt(h.hi)}`;
      if (h.win && h.phases > PHASES) return `完走＋エンドレス 第${h.phases}期（前のルール）`;
      if (h.win) return `完走（${h.days}日）`;
      return h.reason === 'fail' ? `第${h.phases + 1}期で解雇` : `第${h.phases + 1}期で終了`;
    }
    if (h.win) return '完走（前のルール）';
    return h.reason === 'fail' ? `DAY ${h.days + 1} で解雇（前のルール）` : `DAY ${h.days} で終了（前のルール）`;
  }
  function boardSummary(types) {
    const n = {};
    for (const t of types) n[t] = (n[t] || 0) + 1;
    return Object.entries(n).sort((a, b) => b[1] - a[1]).map(([t, k]) => MACHINES[t].name + (k > 1 ? '×' + k : '')).join(' ');
  }
  function shareText(h) {
    return [
      `コンベア錬金：${runResult(h)}${h.dev ? '（テストモード）' : ''}`,
      `最高価値アイテム ${fmt(h.item)} ／ 1日の最高出荷額 ${fmt(h.day)}${h.lev ? ` ／ 最高レバレッジ Lv${h.lev}` : ''}`,
      `ライン：${h.layout} ／ 最後の盤面：${boardSummary(h.board) || 'なし'}`,
    ].join('\n');
  }
  function bestText() {
    const b = G.meta.best;
    return [
      'コンベア錬金の自己ベスト',
      `最高 第${b.phase || 0}期${b.phase >= PHASES ? '（完走）' : ''} ／ 完走 ${G.meta.wins || 0}回（出勤 ${G.meta.runs}回）${b.hiscore ? ` ／ ハイスコア ${fmt(b.hiscore)}` : ''}`,
      `最高価値アイテム ${fmt(b.item || 0)} ／ 1日の最高出荷額 ${fmt(b.dayScore || 0)} ／ 最高レバレッジ Lv${b.lev || 0}`,
    ].join('\n');
  }
  function copyText(text, btn) {
    const done = (ok) => {
      const old = btn.textContent;
      btn.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
      setTimeout(() => { btn.textContent = old; }, 1600);
    };
    if (!text) return done(false);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
    else done(fallbackCopy(text));
  }
  // file:// で開いたときなど、clipboard API が使えない場合
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
  function showRecords() {
    const b = G.meta.best;
    const cards = [
      ['達成した納期', `第${b.phase || 0}期`, (b.phase || 0) >= PHASES ? '完走あり' : `ゴールの第${PHASES}期まで あと ${PHASES - (b.phase || 0)}期`],
      ['ハイスコア', b.hiscore ? fmt(b.hiscore) : '-', '完走したあとのハイスコアモード'],
      ['完走', `${G.meta.wins || 0}回`, `出勤 ${G.meta.runs}回`],

    const hist = G.meta.history || [];

        </div>`).join('')
      : '<p class="lead">まだ記録がありません。出勤すると、ここに最近のランが残ります。</p>';
    const dkeys = Object.keys(G.meta.daily || {}).sort().reverse().slice(0, 7);
    const daily = dkeys.length
      ? `<h3 class="rs-cat">日替わりチャレンジ <span style="color:var(--muted);font-size:12px">日ごとのベスト（最近の7日）</span></h3>
        <div class="hist">${dkeys.map((k) => {
          const r = G.meta.daily[k];
          return `<div class="hist-row daily ${r.win ? 'win' : ''}"><div class="hist-when">${k.slice(0, 4)}/${k.slice(4, 6)}/${k.slice(6)}<span>${r.plays}回</span></div>
            <div class="hist-res">${r.win ? '完走' : `第${r.phases}期まで`}</div>
            <div class="hist-num"><span>総出荷</span>${fmt(r.total)}</div><div class="hist-num"><span>最高アイテム</span>${fmt(r.item || 0)}</div><div class="hist-num"><span>日替わり特許</span>+${r.got || 0}</div><div></div></div>`;
        }).join('')}</div>`
      : '';
    showOverlay(`
      <h2>記録</h2>
      <h3 class="rs-cat">自己ベスト</h3>
      <div class="rec-grid">${cards}</div>
      ${devOn() ? '<p class="lead" style="font-size:12px;color:#ff8f8f"><i class="ic ic-wrench"></i> テストモード中のランは、自己ベストに数えません（履歴には <i class="ic ic-wrench"></i> 付きで残ります）</p>' : ''}
      <h3 class="rs-cat">最近のラン <span style="color:var(--muted);font-size:12px">最新 ${HISTORY_MAX} 回まで</span></h3>
      <div class="hist">${rows}</div>
      ${daily}
      <div class="menu-btns">
        <button class="btn sub" data-act="copy-best">自己ベストをコピー</button>
        <button class="btn sub" data-act="title">戻る</button>
      </div>`, 'wide');
  }

  // ---------- 操作 ----------
  function doStart() {
    if (G.state !== 'build') return;
    const res = startDay();
    if (res === 'limit') {
      Sfx.error();
      banner(`設置枠は今日 ${dayCap()} まで`, 'bad');
      return;
    }
    Sfx.click();
    banner(`DAY ${G.run.day} 稼働開始`);

  function onOverlayClick(e) {
    const btn = e.target.closest('[data-research5],[data-act],[data-research],[data-reward]');
    if (!btn) return;
    Sfx.unlock();
    Sfx.click();
    // 研究の「×5」：特許（日替わりならポイント）が足りるぶんだけ、まとめて5段まで上げる
    if (btn.dataset.research5) {
      const scroll = card.scrollTop;
      let n = 0;
      while (n < 5 && buyResearch(btn.dataset.research5)) n++;
      if (n) Sfx.buy();
      else Sfx.error();
      showResearch();
      card.scrollTop = scroll;
      return;
    }
    if (btn.dataset.act === 'res-tab') {
      resTab = btn.dataset.tab;
      showResearch();
      card.scrollTop = 0;
      return;
    }
    if (btn.dataset.act && btn.dataset.act.startsWith('dev-') && DEV_TOOLS) {
      const act = btn.dataset.act;
      if (act === 'dev-toggle') {
        G.meta.dev.on = !G.meta.dev.on;
        saveMeta();
      } else if (act === 'dev-all') devSetAll(true);
      else if (act === 'dev-none') devSetAll(false);
      else if (act === 'dev-copy') {
        G.meta.dev.research = { ...G.meta.research };
        saveMeta();
      }
      const scroll = card.scrollTop;
      showResearch();
      card.scrollTop = scroll;
      return;
    }
    if (btn.dataset.research) {
      // カードのボタンを押したら、その場で研究する。テストモードでは Lv を1つ上げる（最大の次は0）
      const scroll = card.scrollTop;
      const r = RESEARCH.find((x) => x.id === btn.dataset.research);
      if (devOn() && !G.flat) {
        const max = isFinite(r.max) ? r.max : 5;
        devSetResearch(r.id, rlv(r.id) >= max ? 0 : rlv(r.id) + 1);
      } else if (buyResearch(r.id)) Sfx.buy();
      else Sfx.error();
      showResearch();
      card.scrollTop = scroll;
      return;
    }
    if (btn.dataset.reward != null) {
      const rw = G.run.rewards && G.run.rewards[+btn.dataset.reward];
      if (!rw || !chooseReward(+btn.dataset.reward)) return;
      Sfx.buy();
      hideOverlay();
      nextDay();
      banner(G.run.boss ? `ボス日：${G.run.boss.name}` : `DAY ${G.run.day}`, !!G.run.boss);
      return;
    }
    const prev = G.state;
    switch (btn.dataset.act) {
      case 'daily':
        // 日替わりチャレンジ：まず、配られた研究ポイントでその日の研究を組む
        if (G.state === 'over') showTitleSilently();
        G.flat = true;
        dailyRes();
        if (resTab === 'gen' || !RESEARCH_TABS.some((t) => t.id === resTab)) resTab = 'work';
        showResearch();
        card.scrollTop = 0;
        break;
      case 'daily-reset':
        resetDailyRes();
        showResearch();
        break;
      case 'daily-go':
        hideOverlay();
        newRun({ daily: true });
        banner(`日替わり ${G.run.daily.label}`);
        break;
      case 'endless':
        // 完走したあと：エンドレスを始める（明日から第7期）
        startEndless();
        hideOverlay();
        nextDay();
        banner(`エンドレス 第${G.run.phase}期`);
        break;
      case 'post-x':
        postToX();
        break;
      case 'save-card':
        saveCard(btn);
        break;
      case 'share-card':
        shareCard();
        break;
      case 'sheet-close':
        hideOverlay();
        G.dirty = true;
        break;
      case 'cap-close':
        // ガチャのあとは、結果の画面（日報ボーナス）に戻る
        if (G.state === 'result' && G.run) showResult(G.run.resultFirstWin, true);
        else hideOverlay();
        G.dirty = true;
        break;
      case 'gacha':
        if (G.run && G.run.gachaPending) {
          drawGacha();
          showCapsule(G.run.lastCapsule);
        }
        break;
      case 'sheet-lev-up':
      case 'sheet-lev-down':
        setLeverage((G.run.lev || 0) + (btn.dataset.act === 'sheet-lev-up' ? 1 : -1));
        showInfoSheet();
        break;
      case 'mute': {
        const m = Sfx.toggle();
        $('btn-mute').textContent = m ? '×' : '♪';
        showPause();
        break;
      }
      case 'howto-pause':
        showHowTo(true);
        break;
      case 'new':
        // はじめての人には、先にチュートリアルの説明を出す
        if (tutPending()) {
          showTutorialIntro();
          break;
        }
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'tut-replay':
        G.meta.tut = 'todo';
        saveMeta();
        showTutorialIntro();
        break;
      case 'tut-skip':
        finishTutorial();
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'tut-start':
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'research':
        if (G.state === 'over') showTitleSilently();
        showResearch();
        break;
      case 'howto':
        showHowTo();
        break;
      case 'records':
        if (G.state === 'over') showTitleSilently();
        showRecords();
        break;
      case 'copy-result':
        copyText(G.meta.history[0] ? shareText(G.meta.history[0]) : '', btn);
        break;
      case 'copy-best':
        copyText(bestText(), btn);
        break;
      case 'trophies':
        if (G.state === 'over') showTitleSilently();
        showTrophies();
        break;
      case 'title':
        showTitle();
        break;
      case 'next':
        hideOverlay();
        nextDay();
        if (G.run.boss) banner(`ボス日：${G.run.boss.name}`, true);
        break;
      case 'hiscore':
        // 完走したあと：ハイスコアモードを始める
        startHiscore();
        hideOverlay();
        nextDay();
        banner('ハイスコアモード');
        break;
      case 'hi-finish':
        hideOverlay();
        endRun('hiscore');
        break;
      case 'retire':
        hideOverlay();
        endRun('retire');
        break;
      case 'back-pause':
        showPause();
        break;
      case 'resume':
        hideOverlay();
        G.state = G.pausedFrom || 'build';
        G.dirty = true;
        break;
      case 'quit':
        G.state = G.pausedFrom || 'build';
        endRun('quit');
        break;
    }
    void prev;
  }
  function showTitleSilently() {
    G.state = 'title';
    startDemo();
    G.dirty = true;
  }

  // 納期達成ガチャの演出：揺れる → レア度の色で光る → 中身の機械。閉じると結果の画面に戻る
  function showCapsule(info) {
    if (!info) return;
    const d = MACHINES[info.type];
    const rr = RARITY[info.rar];
    showOverlay(`
      <div class="cap-open r${info.rar}" style="--rc:${rr.color}">
        <div class="cap-stage"><div class="cap-ball">${ICON('capsule')}</div><div class="cap-flash"></div></div>
        <div class="cap-card">
          ${info.locked ? '<div class="cap-pity">研究で未開放の機械！</div>' : ''}
          ${glyphHTML(info.type)}
          <div class="cap-rar">${rr.name}</div>
          <div class="cap-name">${d.name}</div>
          <div class="cap-short">${d.short}</div>
          <div class="cap-desc">${d.desc}</div>
          <div class="cap-note">手持ちに入りました（所持の上限を超えても持てます）</div>
          <button class="btn" data-act="cap-close">OK</button>
        </div>
      </div>`, 'capsule');
    Sfx.whoosh();
    setTimeout(() => {
      if (info.rar >= 5) {
        Sfx.jackpot();
        Sfx.unitBig(4);
      } else if (info.rar >= 4) Sfx.milestone(3);
      else if (info.rar >= 3) Sfx.milestone(1);
      else Sfx.buy();
    }, 950);
  }
  // 買ったあとの知らせ（音・バナー）
  function buyFx(res, s) {
    if (res === 'ok') {
      Sfx.buy();
      return true;
    }
    if (res === 'capsule') {
      showCapsule(G.run.lastCapsule);
      return true;
    }
    if (res === 'used') {
      Sfx.item();
      banner(CONSUMABLES[s.item].name);
      return true;
    }
    Sfx.error();
    if (res === 'cap') banner('手持ちがいっぱい（売るか、入れ替えてから）', 'bad');
    else if (res === 'coins') banner('コイン不足', 'bad');
    return false;
  }
  function buyAt(i) {
    const R = G.run;
    const s = R.shop[i];
    if (!s || s.sold) return;
    shopSel = null;
    infoKey = '';
    buyFx(buyShop(i), s);
  }
  // 右の欄・ショップ・詳細バー・スマホの下の段のボタン
  function onPanelClick(e) {
    const R = G.run;
    if (!R || R.demo) return;
    Sfx.unlock();
    const ui = e.target.closest('[data-ui]');
    const act = ui && !ui.disabled ? ui.dataset.ui : null;
    if (act === 'speed') {
      setSpeed(+ui.dataset.speed);
      G.dirty = true;
      return;
    }
    if (act === 'skip') {
      skipDay();
      return;
    }
    if (act === 'shoptoggle') {
      setShopClosed(!shopClosed);
      Sfx.click();
      G.dirty = true;
      return;
    }
    if (G.state !== 'build') return;
    // 「購入」ボタン：買って、そのまま置く場所を選ぶ
    const buyBtn = e.target.closest('[data-buy]');
    if (buyBtn) {
      if (!buyBtn.disabled) buyAt(+buyBtn.dataset.buy);
      else Sfx.error();
      return;
    }
    // カードの本体：説明を出す（もう一度押すと閉じる）。買うのは「購入」ボタンだけ
    const shopEl = e.target.closest('[data-shop]');
    if (shopEl) {
      const i = +shopEl.dataset.shop;
      if (!R.shop[i] || R.shop[i].sold) return;
      shopSel = shopSel === i ? null : i;
      R.sel = null;
      Sfx.click();
      G.dirty = true;
      return;
    }
    const trayEl = e.target.closest('[data-tray]');
    if (trayEl) {
      const uid = +trayEl.dataset.tray;
      R.sel = R.sel === uid ? null : uid;
      shopSel = null;
      Sfx.click();
      G.dirty = true;
      return;
    }
    switch (act) {
      case 'reroll':
        if (reroll()) Sfx.buy();
        else Sfx.error();
        break;
      case 'slot':
        if (buySlot()) {
          Sfx.milestone(1);
          banner(`設置枠 ${R.boardCap}台に！`);
        } else Sfx.error();
        break;
      case 'start':
        doStart();
        break;
      case 'info':
        Sfx.click();
        showInfoSheet();
        break;
      case 'lev-up':
      case 'lev-down':
        setLeverage((R.lev || 0) + (act === 'lev-up' ? 1 : -1));
        Sfx.click();
        break;
      case 'unsel':
        R.sel = null;
        G.dirty = true;
        break;
      case 'unpick':
        shopSel = null;
        G.dirty = true;
        break;
      case 'sell':
        if (sellSelected()) Sfx.sell();
        break;
      case 'stash':
        stashSelected();
        Sfx.click();
        break;
      case 'rot':
        if (rotateMachine(R.sel)) Sfx.click();
        else {
          Sfx.error();
          banner('回すとはみ出すか、ほかの機械と重なります', 'bad');
        }
        infoKey = '';
        break;
      case 'kit':
        if (applyKit(R.sel)) {
          Sfx.milestone(2);
          const f = findMachine(R.sel);
          banner(`${MACHINES[f.m.type].name} ★${f.m.star}`);
          if (f.where === 'grid') {
            const { x: cx, y: cy } = machineCenter(f.m);
            burst(cx, cy, '#ffd447', 24);
            addRing(cx, cy, '#ffd447', 2);
            f.m.flash = 1;
          }
          infoKey = '';
        } else Sfx.error();
        break;
    }
  }

  // ---------- 盤面のタップ（クリック） ----------
  // 指で押したマスが、持っている機械を置けないマス（ベルト・出入口など）でも、すぐ隣に置けるマスがあればそちらに吸いつける
  // bx, by：押した位置（盤面のピクセル）。マスの境目の近くを押したときだけ効く（マスのまん中を押したら、そのマス）
  const SNAP_DIST = 0.85 * TILE;
  function snapCell(cx, cy, bx, by, m) {
    const ok = (x, y) => {
      if (!inBounds(x, y) || !canPlaceType(m.type, x, y)) return false;
      const o = machineAt(x, y);
      if (o && o !== m) return false;
      return cellCount(m.type) < 2 || fitRot(m, x, y, m.rot || 0) != null;
    };
    if (ok(cx, cy) || machineAt(cx, cy)) return [cx, cy];
    let best = null;
    let bd = SNAP_DIST;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = cx + dx;
      const y = cy + dy;
      if ((dx || dy) && ok(x, y)) {
        const d = Math.hypot((x + 0.5) * TILE - bx, (y + 0.5) * TILE - by);
        if (d < bd) {
          bd = d;
          best = [x, y];
        }
      }
    }
    return best || [cx, cy];
  }
  // 持っている機械があれば、そのマスに置く。なければ、そのマスの機械を選ぶ
  function tapCell(cx, cy, bx, by, touch) {
    const R = G.run;
    if (!R || G.state !== 'build' || !inBounds(cx, cy)) return;
    if (shopSel != null) {
      // ショップの品の説明を見ていたら閉じる
      shopSel = null;
      G.dirty = true;
    }
    if (R.sel != null) {
      const f = findMachine(R.sel);
      if (touch && f && bx != null) [cx, cy] = snapCell(cx, cy, bx, by, f.m);
      const other = machineAt(cx, cy);
      const res = placeAt(R.sel, cx, cy);
      if (res === 'ok') {
        placedFx(R.sel);
        R.sel = null;
        G.dirty = true;
      } else if ((res === 'need-side' || res === 'need-belt' || res === 'blocked') && other && other.uid !== R.sel) {
        // 置けない場所にある機械をタップしたら、そちらを選び直す
        R.sel = other.uid;
        Sfx.click();
        G.dirty = true;
      } else placeError(res, true);
      return;
    }
    const m = machineAt(cx, cy);
    if (m) {
      R.sel = m.uid;
      Sfx.click();
      G.dirty = true;
    }
  }
  function placedFx(uid) {
    const f = findMachine(uid);
    Sfx.place();
    if (f && f.where === 'grid') {
      const c = machineCenter(f.m);
      burst(c.x, c.y, '#ffffff', 10);
    }
  }
  // 置けなかったときの知らせ。deselect：横置きの機械でベルトや出入口をタップしたら選択を外す
  function placeError(res, deselect) {
    const R = G.run;
    if (res === 'full') {
      Sfx.error();
      banner('設置枠がいっぱい', 'bad');
    } else if (res === 'blocked') {
      Sfx.error();
      banner('ここには置けません（2マス空いていない／大型の機械とは入れ替えられない）', 'bad');
    } else if (res === 'need-belt') {
      Sfx.error();
      banner('ベルト型はベルトの上に置く', 'bad');
    } else if (res === 'need-side') {
      Sfx.error();
      if (!deselect) banner('この機械はベルトの横に置く', 'bad');
      else {
        R.sel = null;
        G.dirty = true;
      }
    } else if (deselect) {
      R.sel = null;
      G.dirty = true;
    }
  }

  // ---------- ドラッグ＆ドロップ（マウス・タッチ共通） ----------
  // 押した瞬間を press に記録して、少し動かしたらドラッグ、動かさずに離したらタップとして扱う
  //   kind: 'canvas'（盤面の空きマス）| 'grid'（盤面の機械）| 'tray'（手持ち）| 'shop'（ショップの品）
  // ドラッグ中は G.drag = { uid, type, rot, moved }（描画が置いたときの見え方を出すのに使う）
  // タッチでは、指でマスが隠れないように、ドラッグの絵と置き場所の見え方を指より TOUCH_OFFSET だけ上に出す
  // 盤面・手持ちの機械をショップの欄へ運ぶと売却、盤面の機械を手持ちの欄へ運ぶと手持ちに戻す
  const TOUCH_OFFSET = 55;
  let press = null;
  let suppressClick = false;
  let ghost = null;
  function rectHas(el, e) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  // ドラッグの絵と置き場所を出す位置（タッチなら指より上）
  function aimPoint(e, p) {
    return { clientX: e.clientX, clientY: e.clientY - (p && p.touch ? TOUCH_OFFSET : 0) };
  }
  function beginPress(e, info) {
    // 前のドラッグの後始末が残っていたら片付けてから（指を離したことが届かなかったとき）
    if (press || ghost || G.drag) cancelDrag();
    hoverTray = null;
    hoverShop = null;
    press = { ...info, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, touch: e.pointerType !== 'mouse' };
  }
  // 指（カーソル）が今どの欄の上にあるか：'sell'（ショップ＝売却）| 'stash'（手持ち＝戻す）| null
  function dropZone(e) {
    if (!press || (press.kind !== 'grid' && press.kind !== 'tray')) return null;
    if (rectHas(dock, e)) return 'sell';
    if (press.kind === 'grid' && rectHas($('hand-zone'), e)) return 'stash';
    return null;
  }
  function moveGhost(e) {
    if (!ghost) return;
    const pt = aimPoint(e, press);
    ghost.style.left = pt.clientX + 'px';
    ghost.style.top = pt.clientY + 'px';
    // 盤面の上では、盤面に置いたときの見え方を描くので、指の上の小さな絵は消す
    ghost.classList.toggle('on-board', rectHas(canvas, pt));
    const zone = dropZone(e);
    ghost.classList.toggle('stash', zone === 'stash');
    ghost.classList.toggle('sell', zone === 'sell');
    const sz = dock;
    if (sz) sz.classList.toggle('sell-hot', zone === 'sell');
    const hz = $('hand-zone');
    if (hz) hz.classList.toggle('stash-hot', zone === 'stash');
  }
  function dropGhost() {
    // 何かの拍子に2つ以上できていても、全部消す
    for (const el of document.querySelectorAll('.drag-ghost')) el.remove();
    ghost = null;
    for (const el of document.querySelectorAll('.sell-hot, .stash-hot')) el.classList.remove('sell-hot', 'stash-hot');
  }
  function onPointerMove(e) {
    // ドラッグの絵だけが残っている（押していないのに絵がある）ときは消す
    if (!press && (ghost || G.drag)) {
      cancelDrag();
      return;
    }
    if (!press || e.pointerId !== press.id) return;
    const R = G.run;
    if (!R || G.state !== 'build') {
      cancelDrag();
      return;
    }
    // マウスのボタンがもう離れている（ウィンドウの外で離した）なら、ドラッグはやめる
    if (e.pointerType === 'mouse' && e.buttons === 0) {
      cancelDrag();
      return;
    }
    if (!press.moved) {
      const dx = e.clientX - press.sx;
      const dy = e.clientY - press.sy;
      if (Math.hypot(dx, dy) < (press.touch ? 12 : 7)) return;
      if (press.kind === 'canvas') {
        press = null; // 空きマスから動かしただけ
        return;
      }
      // ショップのカードの列をスクロールする向き（PC：横／スマホ：縦）に指を動かしたときは、ブラウザがスクロールにして
      // pointercancel が届く（そこでドラッグをやめる）。それ以外の向きならドラッグになる
      press.moved = true;
      const f = press.uid != null ? findMachine(press.uid) : null;
      const s = press.kind === 'shop' ? R.shop[press.shop] : null;
      // 消耗品はドラッグしない（タップで買う）
      const type = s ? s.type : f && f.m.type;
      if (!type) {
        press = null;
        return;
      }
      G.drag = { uid: s ? null : press.uid, type: s ? type : null, rot: null, moved: true };
      R.sel = s ? null : press.uid;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost' + (press.touch ? ' touch' : '');
      ghost.innerHTML = glyphHTML(type) + `<span class="g-stash">手持ちに戻す</span><span class="g-sell">売却 +${f ? sellValue(f.m) : 0}枚</span>`;
      document.body.appendChild(ghost);
      Sfx.click();
      G.dirty = true;
    }
    if (e.cancelable) e.preventDefault();
    moveGhost(e);
    const pt = aimPoint(e, press);
    G.hover = rectHas(canvas, pt) ? Render.toBoard(pt.clientX, pt.clientY) : null;
  }
  function onPointerUp(e) {
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    const zone = dropZone(e);
    press = null;
    // タッチにはカーソルがないので、指を離したら「置いたときの見え方」を消す（その場に残ると紛らわしい）
    const clearHover = () => {
      if (p.touch) G.hover = null;
    };
    if (!p.moved) {
      if (p.kind === 'canvas' || p.kind === 'grid') tapCell(p.cx, p.cy, p.bx, p.by, p.touch);
      clearHover();
      return; // 手持ち・ショップのタップは、いつもの click で処理する
    }
    setTimeout(clearHover, 0);
    suppressClick = true;
    setTimeout(() => (suppressClick = false), 0);
    const R = G.run;
    const drag = G.drag;
    G.drag = null;
    dropGhost();
    if (!R || G.state !== 'build' || !drag) return;
    const pt = aimPoint(e, p);
    if (zone === 'sell') {
      // ショップの欄へ：売却
      const f = findMachine(drag.uid);
      const v = f ? sellValue(f.m) : 0;
      if (sellMachine(drag.uid)) {
        Sfx.sell();
        banner(`売却 +${v}枚`);
      }
    } else if (zone === 'stash') {
      R.sel = drag.uid;
      stashSelected();
      Sfx.click();
    } else if (rectHas(canvas, pt)) {
      const b = Render.toBoard(pt.clientX, pt.clientY);
      G.hover = b;
      let uid = drag.uid;
      if (p.kind === 'shop') {
        // ショップから盤面へ：買って、そのまま置く
        const s = R.shop[p.shop];
        const res = buyShop(p.shop);
        shopSel = null;
        if (!buyFx(res, s) || res !== 'ok') {
          R.sel = null;
          G.dirty = true;
          return;
        }
        uid = R.tray[R.tray.length - 1].uid;
        if (drag.rot != null) R.tray[R.tray.length - 1].rot = drag.rot;
      }
      const res = inBounds(b.cx, b.cy) ? placeAt(uid, b.cx, b.cy, drag.rot) : 'invalid';
      if (res === 'ok') placedFx(uid);
      else if (res !== 'invalid' && res !== 'gate') placeError(res, false);
      else Sfx.error();
      if (res !== 'ok' && p.kind === 'shop') banner('置けなかったので、手持ちに入れました', 'bad');
    }
    R.sel = null;
    G.dirty = true;
  }
  function cancelDrag() {
    press = null;
    if (G.drag) {
      G.drag = null;
      if (G.run) G.run.sel = null;
      G.dirty = true;
    }
    dropGhost();
  }
  // ドラッグ中の大型の機械の向きを変える（R キー）。選んでいるだけのときは、その場で回す
  function rotateHeld() {
    const R = G.run;
    if (!R || G.state !== 'build') return;
    if (G.drag) {
      const f = G.drag.uid != null ? findMachine(G.drag.uid) : null;
      const type = G.drag.type || (f && f.m.type);
      if (!type || cellCount(type) < 2) return;
      const cur = G.drag.rot != null ? G.drag.rot : f ? f.m.rot || 0 : 0;
      G.drag.rot = 1 - cur;
      Sfx.click();
    } else if (R.sel != null) {
      const f = findMachine(R.sel);
      if (!f || cellCount(f.m.type) < 2) return;
      if (rotateMachine(R.sel)) Sfx.click();
      else {
        Sfx.error();
        banner('回すとはみ出すか、ほかの機械と重なります', 'bad');
      }
      infoKey = '';
    }
  }

  function onCanvasDown(e) {
    Sfx.unlock();
    const R = G.run;
    if (!R || R.demo) return;
    const b = Render.toBoard(e.clientX, e.clientY);
    G.hover = b;
    if (e.button === 2) {
      cancelDrag();
      R.sel = null;
      G.dirty = true;
      return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (G.state !== 'build' || !inBounds(b.cx, b.cy)) return;
    const m = machineAt(b.cx, b.cy);
    beginPress(e, { kind: m ? 'grid' : 'canvas', uid: m ? m.uid : null, cx: b.cx, cy: b.cy, bx: b.x, by: b.y });
  }
  // ショップのカードを押したとき：マウスなら、そのまま盤面へドラッグして買える
  // タッチでは何もしない（指でカードの列をスクロールできるように。買うのは「購入」ボタン、説明はタップ）
  function onDockDown(e) {
    const R = G.run;
    if (!R || R.demo || G.state !== 'build' || e.pointerType !== 'mouse' || e.button !== 0) return;
    Sfx.unlock();
    const s = e.target.closest('[data-shop]');
    const i = s ? +s.dataset.shop : -1;
    const it = s && R.shop[i];
    if (!it || it.sold || it.item || buyState(it, R) !== 'can') return;
    beginPress(e, { kind: 'shop', shop: i });
  }
  // 手持ちの機械を押したとき：ドラッグで盤面へ（タップは click で選ぶ）
  function onSideDown(e) {
    const R = G.run;
    if (!R || R.demo || G.state !== 'build' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    Sfx.unlock();
    const t = e.target.closest('[data-tray]');
    if (t) beginPress(e, { kind: 'tray', uid: +t.dataset.tray });
  }
  function setSpeed(s) {
    G.speedMul = s;
    $('btn-speed').textContent = '×' + s;
    for (const b of document.querySelectorAll('[data-ui="speed"]')) b.classList.toggle('on', +b.dataset.speed === s);
  }

  function onKey(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (overlay.classList.contains('hidden')) doStart();
    } else if (e.key === 'Escape') {
      cancelDrag();
      if (G.run) {
        G.run.sel = null;
        G.dirty = true;
      }
    } else if (e.key === 'Enter' && overlay.classList.contains('hidden') && G.state === 'run') {
      skipDay();
    } else if (e.key === 'r' || e.key === 'R') {
      rotateHeld();
    } else if (e.key === '1') setSpeed(1);
    else if (e.key === '2') setSpeed(2);
    else if (e.key === '3') setSpeed(4);
  }

  // ---------- 初期化とループ ----------
  function init() {
    side = $('side');
    overlay = $('overlay');
    card = $('overlay-card');
    bannerEl = $('banner');
    canvas = $('board');
    G.meta = loadMeta();
    Render.init(canvas);

    canvas.addEventListener('pointerdown', onCanvasDown);
    canvas.addEventListener('pointermove', (e) => {
      G.hover = Render.toBoard(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', () => (G.hover = null));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    dock = $('dock');
    detailBar = $('detail-bar');
    foot = $('foot');
    document.body.classList.toggle('shop-closed', shopClosed);
    for (const el of [side, dock, detailBar, foot]) el.addEventListener('click', onPanelClick);
    dock.addEventListener('pointerdown', onDockDown);
    side.addEventListener('pointerdown', onSideDown);
    for (const el of [side, dock]) el.addEventListener('contextmenu', (e) => e.preventDefault()); // 長押しでメニューを出さない
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', (e) => {
      if (press && e.pointerId === press.id) cancelDrag();
    });
    // ドラッグを終えた直後の click は無視する（手持ちの選択が切り替わったりしないように）
    document.addEventListener('click', (e) => {
      if (suppressClick) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
    // 手持ち・ショップの品にカーソルを合わせると、右の欄に詳細を出す（マウスだけ。タッチはタップで選んだときに詳細バーで出す）
    dock.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const s = e.target.closest('[data-shop]');
      hoverShop = s ? +s.dataset.shop : null;
    });
    dock.addEventListener('pointerleave', () => (hoverShop = null));
    side.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const t = e.target.closest('[data-tray]');
      hoverTray = t ? +t.dataset.tray : null;
    });
    side.addEventListener('pointerleave', () => (hoverTray = null));
    // ウィンドウから離れた・タブを切り替えたときは、ドラッグ中のものを片付ける
    window.addEventListener('blur', () => cancelDrag());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelDrag();
    });
    card.addEventListener('click', onOverlayClick);
    $('coach').addEventListener('click', onCoachClick);
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', () => layout());
    if (window.ResizeObserver) {
      new ResizeObserver(() => layout()).observe($('main'));
      new ResizeObserver(() => Render.resize()).observe(canvas.parentElement);
    }
    $('btn-speed').addEventListener('click', () => setSpeed(G.speedMul === 1 ? 2 : G.speedMul === 2 ? 4 : 1));
    $('btn-mute').addEventListener('click', () => {
      const m = Sfx.toggle();
      $('btn-mute').textContent = m ? '×' : '♪';
    });
    $('btn-menu').addEventListener('click', () => {
      if (!G.run || G.run.demo || G.state === 'over' || G.state === 'title' || G.state === 'result') return;
      G.pausedFrom = G.state;
      G.state = 'paused';
      showPause();
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());

    showTitle();
    let last = performance.now();
    function loop(t) {
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      update(dt);
      // 準備画面でなくなったら（稼働開始・タイトルへ戻る など）、ドラッグ中のものを片付ける
      if (G.state !== 'build' && (press || ghost || G.drag)) cancelDrag();
      if (G.dirty) {
        G.dirty = false;
        renderSide();
      } else {
        renderInfo(false); // カーソルを合わせた相手が変わったら詳細を描き直す
      }
      updateHUD();
      Render.draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  return { init, banner, showResult, showGameOver, renderSide, achievement, resultCard: () => G.run && makeResultCard(G.run) };
})();

window.addEventListener('DOMContentLoaded', UI.init);

</script>
</body>
</html>
