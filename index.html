  flat: false, // 日替わりチャレンジ中：研究をすべて Lv0 として扱う
  demoTick: false, // タイトルのデモを進めている最中（実績・音・バナーを止める）
};

// ---------- メタ進行の保存 ----------
function loadMeta() {
  // ach: 解除した実績 {id: 日時} / usedTypes: 稼働させた機械 / bossCleared: クリアしたボス日
  // wins: 12日完走の回数 / dev: テストモード（研究を自由にオンオフする砂場）
  // best.phase: 達成したいちばん先の期 / best.hiscore: ハイスコアモードの最高出荷額
  const def = {
    patents: 0, research: {}, best: { day: 0, phase: 0, item: 0, lev: 0, dayScore: 0, ratio: 0, total: 0, patents: 0 }, history: [],
    tut: 'todo', // チュートリアル：'todo'＝まだ / 'done'＝済み（または飛ばした）
    runs: 0, wins: 0, ach: {}, usedTypes: [], bossCleared: [],
    dev: { on: false, research: {} }, researchVer: RESEARCH_VERSION,
    daily: {}, // 日替わりチャレンジの記録 { 'YYYYMMDD': { phases, total, days, plays, bonus } }（新しい30日ぶん）
  };
  try {
    const s = localStorage.getItem(META_KEY);
    if (s) {
      const d = JSON.parse(s);
      const meta = {
        ...def, ...d, research: { ...(d.research || {}) }, best: { ...def.best, ...(d.best || {}) },
        history: [...(d.history || [])], ach: { ...(d.ach || {}) }, usedTypes: [...(d.usedTypes || [])], bossCleared: [...(d.bossCleared || [])],
        dev: { on: !!(d.dev && d.dev.on), research: { ...((d.dev && d.dev.research) || {}) } },
        researchVer: d.researchVer || 1, // 古いセーブには無い → 研究のリセット対象
        daily: { ...(d.daily || {}) },
      };
      // チュートリアルができる前のセーブ：遊んだことがあれば済みにする
      if (!d.tut) meta.tut = d.runs > 0 ? 'done' : 'todo';
      // 工場ランク（なくした仕組み）の名残りは消しておく
      delete meta.rank;
      delete meta.rankSel;
      delete meta.best.rank;
      refundRemovedResearch(meta);
      clampResearch(meta);
      return meta;
    }
  } catch (e) { /* 保存できない環境でも遊べるように */ }
  return def;
}
// 研究を作り直すたびに、古い研究はすべてリセットして、使った特許を全部返す（版が上がったとき1回だけ）
const RESEARCH_VERSION = 7;
// 6版（2026-11-14 の大型アップデート直後。カプセルの「天井短縮」があったころ）の値段。7版でプリズム・レジェンド・研究の列を変えたのでリセット
function oldResearchCost6(id, l) {
  if (id === 'pity') return 18 + 10 * l;
  const r = RESEARCH.find((x) => x.id === id);
  return r && l < r.max ? r.cost(l) : 0;
}
// 5版（機械ごとの道：設計図＋習熟5段＋追加効果、経営・設備・物流の3列）の値段
function oldResearchCost5(id, l) {
  const t = id.slice(2);
  const tier = RESEARCH_TIER[t];
  if (id.startsWith('m_') && tier && MACHINES[t]) {
    const bp = MACHINES[t].locked ? 1 : 0;
    return bp && l === 0 ? [0, 6, 10, 16][tier] : [0, 2, 3, 4][tier] * (l - bp + 1);
  }
  if (id.startsWith('x_') && tier) return [0, 20, 30, 45][tier];
  if (id === 'inf_capital') return Math.round(12 * Math.pow(1.35, l));
  if (id === 'inf_prod') return Math.round(20 * Math.pow(1.45, l));
  const col = { money: 1, haggle: 2, interest: 3, starter: 4, bench: 1, slot: 2, slotcost: 3, hotspot: 4, items: 1, shop: 2, reward: 3 };
  if (!col[id]) return 0;
  const base = [0, 4, 7, 10, 14, 18][col[id]];
  return base + (Math.ceil(base / 2) + 1) * l;
}
// 4版（カード式。強化2段階＋最初から研究できる追加効果）の値段
function oldResearchCost4(id, l) {
  const t = id.slice(2);
  const tier = RESEARCH_TIER[t];
  if (id.startsWith('m_') && tier) return [0, 2, 4, 7][tier] + 2 * l;
  if (id.startsWith('x_') && tier) return [0, 5, 7, 10][tier];
  if (id === 'inf_capital') return Math.round(8 * Math.pow(1.35, l));
  if (id === 'inf_prod') return Math.round(12 * Math.pow(1.45, l));
  for (const lane of TREE_GENERAL) {
    const i = lane.nodes.findIndex((n) => n.id === id);
    if (i < 0) continue;
    const base = [0, 2, 4, 6, 9, 12][i + 1];
    return base + (Math.ceil(base / 2) + 1) * l;
  }
  return 0;
}
// 3版（下から上へ伸びるビルド別の枝）の値段
function oldResearchCost3(id, l) {
  const rows = {
    grinder: 1, cooler: 2, prism: 3, amp: 4, furnace: 1, burner: 2, twin: 3, quench: 4, bellows: 5, sieve: 1, mason: 2, melter: 3,
    transmuter: 1, goldsmith: 2, alchemist: 3, lottery: 1, cat: 2, catalyst: 3, cursed: 4, splitter: 1, resonator: 2, thunder: 3, battery: 4, duplicator: 5,
    toll: 1, exchange: 2, vault: 3, piggy: 4, echo: 1, artisan: 2, pump: 3,
  };
  const famRow = { base: 5, heat: 6, stone: 4, gold: 4, luck: 5, storm: 6, bank: 5, rep: 4 };
  const base = [0, 2, 4, 6, 9, 12, 15, 18];
  const t = id.slice(2);
  if (id.startsWith('m_') && rows[t]) return base[rows[t]] + 2 * l;
  if (id.startsWith('x_') && rows[t]) return base[rows[t]] + 3;
  if (id.startsWith('fam_') && famRow[id.slice(4)]) return base[famRow[id.slice(4)]] + 3;
  return oldResearchCost2(id, l); // 経営・設備・物流は2版と同じ
}
// 2版（横向きのツリー）の値段
function oldResearchCost2(id, l) {
  const col = {
    money: 1, haggle: 2, interest: 3, starter: 4, bench: 1, slot: 2, slotcost: 3, hotspot: 4, items: 1, shop: 2, reward: 3,
    tune_furnace: 1, u_bellows: 2, tune_quench: 3, tune_twin: 4, fam_heat: 5, tune_goldsmith: 1, u_alchemist: 2, fam_gold: 3,
    tune_lottery: 1, u_catalyst: 2, u_cursed: 3, tune_cursed: 4, fam_luck: 5, tune_resonator: 1, u_battery: 2, u_duplicator: 3, fam_storm: 4,
    tune_vault: 1, tune_exchange: 2, fam_bank: 3, tune_artisan: 1, u_pump: 2, fam_rep: 3, tune_sieve: 1, tune_mason: 2, fam_stone: 3,
    tune_grinder: 1, u_amp: 2, u_prism: 3, tune_prism: 4,
  };
  if (id === 'inf_capital') return Math.round(8 * Math.pow(1.35, l));
  if (id === 'inf_prod') return Math.round(12 * Math.pow(1.45, l));
  if (!col[id]) return 0;
  const base = [0, 2, 4, 6, 9, 12][col[id]];
  return id.startsWith('fam_') ? base + 3 : base + (Math.ceil(base / 2) + 1) * l;
}

    const dy = Math.sign(y1 - y0);
    let x = x0;
    let y = y0;
    if (i === 0) path.push([x, y]);
    while (x !== x1 || y !== y1) {

      y += dy;
      path.push([x, y]);

}

// 研究「習熟」の段階（ロック中だった機械は Lv1 が設計図なので、そのぶんを引く）
// 習熟1段階ごとに、「+」「×」の機械は効果 +4%、どの機械もショップに並びやすさ +4%
function tuneLv(type) {
  return Math.max(0, rlv('m_' + type) - (MACHINES[type].locked ? 1 : 0));
}
function shopBoost(type) {
  return 1 + SHOP_STEP * tuneLv(type);
}
function tuneMul(type) {
  return isTunable(type) ? 1 + TUNE_STEP * tuneLv(type) : 1;
}
// 研究「生産性向上」による全出荷額の倍率
function prodMul() {
  return 1 + 0.1 * rlv('inf_prod');
}
function runSlotCost() {
  return niceRound(slotCost(G.run.slotBuys) * (1 - 0.15 * rlv('slotcost')));
}
// 持っている機械のうち、type と相性のいいもの（ショップの「相性◎」）
function synergyWith(type) {
  const syn = SYNERGY[type];
  if (!syn) return null;
  const R = G.run;
  for (const m of [...placedMachines(), ...R.tray]) if (syn.has(m.type)) return m.type;
  return null;
}
// そのマスに置いた機械が、アイテム1個につき何回発動するか
// (x,y) が大型の機械の左上なら、2マスぶんで数える
function beltHits(x, y) {
  return cellsBeltHits(selfCells(x, y).cells);
}
// 盤面の機械（2マスの機械も1台として、1回だけ）
function placedMachines() {
  const out = [];
  const seen = new Set();
  for (const m of G.run.grid) {
    if (m && !seen.has(m)) {
      seen.add(m);
      out.push(m);
    }
  }
  return out;
}
function placedCount() {
  return placedMachines().length;
}
function ownedCount() {
  return placedCount() + G.run.tray.length;
}
// 持てる台数 = 盤面の設置枠 + 手持ち（ベンチ）
function ownedCap() {
  return G.run.boardCap + G.run.bench;
}
// 今日、盤面に置ける台数（ボス「設置制限」で減る）
function dayCap() {
  const R = G.run;
  return R.boardCap - (R.boss && R.boss.id === 'limit' ? 1 : 0);
}
function sellValue(m) {
  return Math.max(1, Math.floor(MACHINES[m.type].cost / 2));
}
function makeMachine(type) {
  return { uid: G.uid++, type, counter: 0, dayCount: 0, flash: 0, disabled: false, x: -1, y: -1, star: 0, rot: 0 };
}
function resetMachineDay(m) {
  m.counter = 0;
  m.dayCount = 0;
  m.fired = 0;
}
function findMachine(uid) {
  const R = G.run;
  const ti = R.tray.findIndex((m) => m.uid === uid);
  if (ti >= 0) return { m: R.tray[ti], where: 'tray', ti };
  const m = R.grid.find((g) => g && g.uid === uid);
  if (m) return { m, where: 'grid' };
  return null;
}

// デモを1コマ進める（update から、タイトル画面のあいだだけ呼ぶ）
function demoStep(dt) {
  const R = G.run;
  G.demoTick = true;
  Sfx.quiet = true;
  try {
    // 流れ続けるように、ゆっくり原料を出す。たまりすぎたら出すのを休む
    R.spawnTimer -= dt;
    if (R.spawnTimer <= 0) {
      if (G.items.length < 40) spawnItem();
      R.spawnTimer += 0.9;
    }
    const end = R.path.length - 1;
    for (let i = 0; i < G.items.length; i++) {
      const it = G.items[i];
      if (!it.alive) continue;
      it.p += R.curSpeed * dt;
      while (it.alive && it.last < end && Math.floor(it.p) > it.last) {
        it.last++;
        processTile(it, it.last, null, G.items);
      }
      if (it.alive && it.last >= end) shipItem(it);
    }
    G.items = G.items.filter((i) => i.alive);
    R.t += dt;
    R.coins = 0;
  } finally {
    G.demoTick = false;
    Sfx.quiet = false;
  }
}

// リロールの値段：その日のうちに 3 → 5 → 8 → 12 → 17 … と上がり、次の日に戻る（研究「値切り上手」で1段ごとに -1）
// 回数の上限は付けず、値段の上がり方で「回すより、次の日の入荷やカプセルを待つ」ほうが得になるようにする
function rerollPrice(n) {
  return Math.max(1, REROLL_BASE - rlv('haggle') + (n * (n + 3)) / 2);
}
function baseRerollCost() {
  if (G.run) G.run.rerollN = 0;
  return rerollPrice(0);
}
// エピック・レジェンドの機械を手に入れたときの実績
function rankCap() {
  return countPlaced('philosopher') > 0 ? 99 : 3;
}
function rankMul() {
  return modOn('philosopher') && countPlaced('philosopher') > 0 ? 3 : RANK_MUL;
}
function gotMachine(type) {
  const r = MACHINES[type].rarity;
  if (r >= 4) unlockAch('epic_get');
  if (r >= 5) unlockAch('leg_get');
}
// ---------- 納期達成ガチャ ----------
// 納期を達成すると、ガチャを1回まわせる（2026-11-14：前はショップに「カプセル」を並べていたが、ショップで直接ガチャを引くのは違うので、納期達成のごほうびにした）
// 研究でまだ開いていない機械（設計図が要る機械・レジェンド）も出る。出た機械は手持ちに入る（所持の上限を超えても受け取れる）
function gachaWeights() {
  const w = {};
  for (const k of Object.keys(GACHA_W)) w[k] = GACHA_W[k] * luckMul(+k);
  return w;
}
function drawGacha() {
  const R = G.run;
  const rnd = rng('gacha:' + R.day + ':' + (R.gachaN || 0));
  const type = weightedPick(Object.keys(MACHINES), rnd, gachaWeights());
  const m = makeMachine(type);
  R.tray.push(m);
  R.gachaN = (R.gachaN || 0) + 1;
  R.gachaPending = false;
  const rar = MACHINES[type].rarity;
  const locked = !isUnlocked(type);
  if (rar >= 5) unlockAch('cap_legend');
  if (locked) unlockAch('gacha_locked');
  gotMachine(type);
  R.lastCapsule = { type, rar, locked };
  G.dirty = true;
  return m;
}

// 持っている機械と相性のいい機械は ×4 出やすい（相方が見つかりやすいように。画面には出さない）
const SYNERGY_WEIGHT = 4;
// 日替わりチャレンジでは、持っている機械で品ぞろえが変わらないように、レア度の重みだけで選ぶ
// まずレア度を引いて（RARITY の w。研究「目利き」でレア以上が出やすくなる）、そのレア度の中から機械を1台選ぶ
// tierW：レア度ごとの重みを差し替える（カプセルなど）
// 2026-11-14：前は研究の「習熟」で機械ごとに並びやすくなったが、同じビルドばかりに固まるのでなくした
function rarityWeights() {
  const w = {};
  for (const k of Object.keys(RARITY)) w[k] = RARITY[k].w * luckMul(+k);
  return w;
}
function weightedPick(pool, rnd = Math.random, tierW = null) {
  const plain = !!(G.run && G.run.daily);
  const W = tierW || rarityWeights();
  const byTier = {};
  for (const t of pool) (byTier[MACHINES[t].rarity] ||= []).push(t);
  const tiers = Object.keys(byTier).filter((k) => W[k] > 0);
  if (!tiers.length) return pool[Math.floor(rnd() * pool.length)];
  let r = rnd() * tiers.reduce((s, k) => s + W[k], 0);
  let tier = tiers[tiers.length - 1];
  for (const k of tiers) {
    r -= W[k];
    if (r <= 0) {
      tier = k;
      break;
    }
  }
  // そのレア度の中では、持っている機械と相性のいいものが出やすい（日替わりチャレンジは持ち物で変わらないように、同じ重み）
  const list = byTier[tier];
  const w = (t) => (plain ? 1 : synergyWith(t) ? SYNERGY_WEIGHT : 1);
  let q = rnd() * list.reduce((s, t) => s + w(t), 0);
  for (const t of list) {
    q -= w(t);
    if (q <= 0) return t;
  }
  return list[list.length - 1];
}
// ショップに並ぶ機械。まだ完走したことがない人には、最初の2日は1台で働く分かりやすい機械だけを並べる（はじめての人向け）
// 日替わりチャレンジでは、設計図の要る機械も含めて全部の機械が並ぶ（研究の進み具合で差が出ないように）
function machinePool() {
  return G.run && G.run.daily ? Object.keys(MACHINES) : Object.keys(MACHINES).filter(isUnlocked);
}
function shopPool() {
  const R = G.run;
  const pool = machinePool();
  // 日替わりチャレンジは、1日目だけ基本の機械（はじめの盤面を作りやすく）
  const basic = R.daily ? R.day <= 1 : (G.meta.best.phase || 0) < 3 && !devOn() && R.day <= BASIC_DAYS;
  return basic ? pool.filter((t) => MACHINES[t].basic) : pool;
}
// ショップの1枠。機械：{ type, sold, price, sale?（特価）, star?（改造済み） } ／ 消耗品：{ item, sold, price } ／ カプセル：{ capsule: true, sold, price }
function shopMachine(type) {
  // 研究の習熟1段ごとに1枚安い（最低1枚）
  return { type, sold: false, price: Math.max(1, MACHINES[type].cost - TUNE_DISCOUNT * tuneLv(type)) };
}
// first：その日の最初の入荷（機械1枚に「特価」か「★改造済み」のおまけが付く）
// （前の「取り置き（🔒）」はなくした）
function rollShop(first) {
  const R = G.run;
  const rnd = rng('shop:' + R.day + ':' + R.rollN);
  R.rollN++;
  const pool = shopPool();
  const used = new Set();
  const machines = [];
  for (let i = 0; i < R.shopSize + R.shopBonusToday; i++) {
    let t = weightedPick(pool, rnd);
    for (let k = 0; k < 12 && used.has(t); k++) t = weightedPick(pool, rnd);
    used.add(t);
    machines.push(shopMachine(t));
  }
  // おまけ（乱数は先に全部引いておく。日替わりチャレンジで、持ち物によって引く回数が変わらないように）
  const bonusAt = Math.floor(rnd() * Math.max(1, machines.length));
  const bonusStar = rnd() < 0.5;
  const twoItems = rnd() < 0.35;
  if (first && machines.length && !R.tut) {
    const s = machines[bonusAt];
    if (bonusStar && canStar(s)) s.star = 1;
    else {
      s.sale = true;
      s.price = Math.max(1, Math.ceil(s.price * SALE_RATE));
    }
  }
  // 消耗品：2日目から1〜2枠
  const items = [];
  if (R.day >= 2 && !R.tut) {
    const ids = shuffle(Object.keys(CONSUMABLES), rnd).filter((id) => CONSUMABLES[id].ok(R));
    for (const id of ids.slice(0, twoItems ? 2 : 1)) items.push({ item: id, sold: false, price: CONSUMABLES[id].cost });
  }
  R.shop = [...machines, ...items];
  R.shopHasLegend = machines.some((m) => MACHINES[m.type].rarity >= 5);
  R.shopBest = machines.reduce((b, m) => Math.max(b, MACHINES[m.type].rarity), 0);
  R.shopStamp = (R.shopStamp || 0) + 1; // 入荷のたびに増える（カードが左から順に出る演出のきっかけ）
}
// ショップの枠をロックする（1つまで。もう一度押すと外れる）
function toggleLock(i) {
  const R = G.run;
  const s = R.shop[i];
  if (!s || s.sold) return false;
  const on = !s.lock;
  for (const o of R.shop) o.lock = false;
  s.lock = on;
  G.dirty = true;
  return true;
}

// その期の、レバレッジ0のときのノルマ
function runQuotaBase(phase) {
  const R = G.run;
  return quotaFor(phase) * (R.layout.qmul || 1);
}
// 今のレバレッジをかけたノルマ（次の期の予告にも使う）
function runQuota(phase) {
  return niceRound(runQuotaBase(phase) * Math.pow(LEV_QMUL, G.run.lev || 0));
}
// 期の納期：その期が始まった日から PHASE_DAYS 日目（1日目に始まれば5日目。3日目に達成して4日目から始まれば8日目）
// 早く達成するほど次の期が早く始まり、ランは短くなる（前倒しボーナスのコインがもらえる）
function deadlineFrom(startDay) {
  return startDay + PHASE_DAYS - 1;
}
// 新しい期を始める：ノルマを決めて、出荷額の合計を0に戻す。レバレッジは前の期の設定を引き継ぐ（この期の最初の日だけ変えられる）
function startPhase() {
  const R = G.run;
  R.phaseScore = 0;
  R.phaseStartDay = R.day;
  R.deadline = deadlineFrom(R.day);
  R.phaseFresh = true;
  // 消耗品「前借り」：使った回数ぶん、この期のノルマが重くなる（1回 +15%）
  R.quotaBase = runQuotaBase(R.phase) * Math.pow(LOAN_QMUL, R.loan || 0);
  R.loanUsed = R.loan || 0; // この期のノルマに入った前借りの回数（画面に出す）
  R.loan = 0;
  R.quota = niceRound(R.quotaBase * Math.pow(LEV_QMUL, R.lev || 0));
}
// レバレッジ：期の最初の日の準備中に決める。1Lvごとに その期のノルマ×3、納期達成のコイン+50%・特許+50%
function setLeverage(lv) {
  const R = G.run;
  if (G.state !== 'build' || !R.phaseFresh || R.hi) return false;
  R.lev = levOpen() ? Math.max(0, Math.min(LEV_MAX, lv)) : 0;
  R.quota = niceRound(R.quotaBase * Math.pow(LEV_QMUL, R.lev));
  G.dirty = true;
  return true;
}
function levCoinMul(lv) {
  return 1 + LEV_COIN * lv;
}
function levPatentMul(lv) {
  return 1 + LEV_PATENT * lv;
}

// 今日の特設マスを決める（2日目から）。強化マスは「当たり」になりうる横のマス、故障マスは挟み込みマス（置いてある機械を狙いやすい）
function rollSpecial() {
  const R = G.run;
  R.special = new Map();
  if (R.day < 2) return;
  // 日替わりチャレンジ：故障マスは「置いてある機械を狙う」ので人によって変わるが、候補の引き方は同じ乱数から
  R.specialN = (R.specialN || 0) + 1;
  const rnd = rng('special:' + R.day + ':' + R.specialN);
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (cellKind(x, y) === 'side' && beltHits(x, y) >= 1) cells.push([x, y]);
  const strong = cells.filter(([x, y]) => beltHits(x, y) >= 2);
  // ボス「停電」の日は故障マスが3つ
  const nBroken = R.boss && R.boss.id === 'blackout' ? 3 : 1;
  for (let i = 0; i < nBroken; i++) {
    const left = strong.filter(([x, y]) => !R.special.has(idx(x, y)));
    const occupied = left.filter(([x, y]) => machineAt(x, y));
    // 日替わりチャレンジでは、盤面に関係なく決める（誰でも同じ場所が故障する）
    const aim = !R.daily && occupied.length && rnd() < 0.6;
    const broken = aim ? pick(occupied, rnd) : left.length ? pick(left, rnd) : null;
    if (broken) R.special.set(idx(broken[0], broken[1]), 'broken');
  }
  const free = shuffle(cells.filter(([x, y]) => !R.special.has(idx(x, y))), rnd);
  for (let i = 0; i < 1 + rlv('hotspot') && i < free.length; i++) R.special.set(idx(free[i][0], free[i][1]), 'boost');
}
function prepareDay() {
  const R = G.run;
  R.boss = R.day % BOSS_EVERY === 0 ? pick(BOSS_RULES, rng('boss:' + R.day)) : null;
  R.rollN = 0;
  R.specialN = 0;
  // 日報ボーナス「納期のノルマ -20%」
  if (R.quotaCut) {
    R.quotaBase *= 0.8;
    R.quota = niceRound(R.quotaBase * Math.pow(LEV_QMUL, R.lev || 0));
    R.quotaCut = false;
  }
  rollSpecial();
  R.dayScore = 0;
  R.shippedCount = 0;
  R.quotaHit = false;
  R.fever = false;
  R.overLevel = 0;
  R.combo = 0;
  R.lastShipT = -9;
  R.t = 0;
  R.spawned = 0;
  R.spawnTimer = 0;
  R.dayDone = false;
  R.endTimer = 0;
  let n = R.itemsPerDay;
  if (R.boss && R.boss.id === 'shortage') n = Math.round(n * 0.6);
  R.itemsToday = n;
  R.dayStats = { best: 0, dup: 0, split: 0, destroyed: 0, coins: 0, maxCombo: 0, jackpots: 0, spent: 0 };
  G.dispScore = R.phaseScore; // HUDのバーは、今の期の合計から始まる
  G.dirty = true;
}

// ---------- 準備フェーズの操作 ----------
// （前は「手持ちがいっぱいのとき同じ機械を買うと合体して ★+1」があったが、分かりにくいのでなくした）
// ショップの値段（特価なら半額）
function shopPrice(s) {
  return s.price != null ? s.price : s.item ? CONSUMABLES[s.item].cost : MACHINES[s.type].cost;
}
// 戻り値: 'ok' | 'cap'（持てる台数がいっぱい）| 'coins' | 'none' | 'used'（消耗品）
function buyShop(i) {
  const R = G.run;
  const s = R.shop[i];
  if (!s || s.sold) return 'none';
  const cost = shopPrice(s);
  if (s.item) {
    if (R.coins < cost) return 'coins';
    if (!CONSUMABLES[s.item].ok(R)) return 'none';
    R.coins -= cost;
    s.sold = true;
    s.lock = false;
    useConsumable(s.item);
    G.dirty = true;
    return 'used';
  }
  if (ownedCount() >= ownedCap()) return 'cap';
  if (R.coins < cost) return 'coins';
  R.coins -= cost;
  s.sold = true;
  s.lock = false;
  const m = makeMachine(s.type);
  gotMachine(s.type);
  if (s.star) m.star = s.star;
  R.tray.push(m);
  R.sel = m.uid;
  G.dirty = true;
  return 'ok';
}
// 消耗品を使う（買ったその場で効く）
function useConsumable(id) {
  const R = G.run;
  switch (id) {
    case 'rush': R.itemsToday += RUSH_ITEMS; break;
    case 'shuffle': rollSpecial(); break;
    case 'tuneup': R.kits++; break;
    case 'loan': R.coins += LOAN_COINS; R.loan = (R.loan || 0) + 1; break;
    case 'repair':
      for (const [k, v] of [...R.special]) if (v === 'broken') R.special.delete(k);
      break;
    case 'coupon': R.freeRerolls += 2; break;
  }
  R.usedItems = (R.usedItems || 0) + 1;
}
// 設置枠を1つ増やす（値段は1.8倍ずつ）
function buySlot() {
  const R = G.run;
  const cost = runSlotCost();
  if (R.coins < cost) return false;
  R.coins -= cost;
  R.slotBuys++;
  R.boardCap++;
  G.dirty = true;
  return true;
}
function reroll() {
  const R = G.run;
  if (R.freeRerolls > 0) {
    R.freeRerolls--;
  } else {
    if (R.coins < R.rerollCost) return false;
    R.coins -= R.rerollCost;
    R.rerollN = (R.rerollN || 0) + 1;
    R.rerollCost = rerollPrice(R.rerollN);
  }
  rollShop();
  G.dirty = true;
  return true;
}
function removeFromWhere(found) {
  const R = G.run;
  if (found.where === 'tray') R.tray.splice(found.ti, 1);
  else gridTake(found.m);
}
// 戻り値: 'ok' | 'full'（設置枠がいっぱい）| 'gate'（投入口・出荷口）| 'need-belt'（ベルト型をベルト以外に）
//        | 'need-side'（横置きの機械をベルトに）| 'blocked'（大型の機械がはみ出す・ほかの機械と重なる）| 'invalid'
// rot：大型の機械の置きたい向き（省略すると今の向き）。その向きで置けなければ反対の向きを試す
function placeAt(uid, x, y, rot) {
  const R = G.run;
  if (!inBounds(x, y)) return 'invalid';
  const f = findMachine(uid);
  if (!f) return 'invalid';
  const m = f.m;
  const ck = cellKind(x, y);
  if (ck === 'gate') return 'gate';
  if (!canPlaceType(m.type, x, y)) return isBeltType(m.type) ? 'need-belt' : 'need-side';
  const big = cellCount(m.type) > 1;
  const other = machineAt(x, y);
  if (big) {
    const r = fitRot(m, x, y, rot);
    if (r == null) return 'blocked';
    if (f.where === 'tray' && slotsUsed() + slotWeight(m) > R.boardCap) return 'full';
    removeFromWhere(f);
    gridPut(m, x, y, r);
    G.dirty = true;
    return 'ok';
  }
  if (other === m) return 'ok';
  if (other) {
    // 1マスの機械どうしは入れ替え（同じマスに置けていた機械同士なので、置き場所の種類は必ずそろう）。大型の機械とは入れ替えない
    if (cellCount(other.type) > 1) return 'blocked';
    if (f.where === 'tray' && slotsUsed() - slotWeight(other) + slotWeight(m) > R.boardCap) return 'full';
    if (f.where === 'grid') {
      const ox = m.x;
      const oy = m.y;
      gridTake(m);
      gridTake(other);
      gridPut(other, ox, oy);
    } else {
      gridTake(other);
      R.tray.splice(f.ti, 1, other);
    }
  } else {
    if (f.where === 'tray' && slotsUsed() + slotWeight(m) > R.boardCap) return 'full';
    removeFromWhere(f);
  }
  gridPut(m, x, y);
  G.dirty = true;
  return 'ok';
}
// 大型の機械の向きを変える（盤面にあれば、その場で回す。回すとはみ出す・重なるときは回さない）
function rotateMachine(uid) {
  const f = findMachine(uid);
  if (!f || cellCount(f.m.type) < 2) return false;
  const m = f.m;
  const r = 1 - (m.rot || 0);
  if (f.where === 'tray') {
    m.rot = r;
    G.dirty = true;
    return true;
  }
  if (!fitsAt(m, m.x, m.y, r)) return false;
  const x = m.x;
  const y = m.y;
  gridTake(m);
  gridPut(m, x, y, r);
  G.dirty = true;
  return true;
}function stashSelected() {
  const R = G.run;
  const f = R.sel != null && findMachine(R.sel);
  if (!f || f.where !== 'grid') return;
  removeFromWhere(f);
  f.m.x = -1;
  f.m.y = -1;
  R.tray.push(f.m);
  R.sel = null;
  G.dirty = true;
}
function sellSelected() {
  const R = G.run;
  return R.sel != null && sellMachine(R.sel);
}
// 機械を売る（ショップの欄へドラッグしたときも）
function sellMachine(uid) {
  const R = G.run;
  const f = findMachine(uid);
  if (!f) return false;
  removeFromWhere(f);
  R.coins += sellValue(f.m);
  if (R.sel === uid) R.sel = null;
  G.dirty = true;
  return true;
}

// ---------- 稼働フェーズ ----------
// 戻り値: 'ok' | 'limit'（ボス「設置制限」で台数オーバー）
function startDay() {
  const R = G.run;
  if (G.state !== 'build') return 'state';
  if (slotsUsed() > dayCap()) return 'limit';
  for (const m of placedMachines()) {
    resetMachineDay(m);
    m.disabled = false;
  }
  // 維持費を払う（盤面の順に。払えない機械は今日は止まる）
  for (const m of placedMachines()) {
    const u = upkeepOf(m);
    if (!u || machineSpecial(m) === 'broken') continue;
    if (R.coins >= u) {
      R.coins -= u;
      R.dayStats.coins -= u;
      if (m.type === 'amp') unlockAch('amp_run');
    } else m.disabled = true;
  }
  checkStartAchievements();
  // 実績「機械マニア」：稼働させた機械の種類を覚える
  const used = new Set(G.meta.usedTypes);
  const n0 = used.size;
  for (const m of placedMachines()) used.add(m.type);
  if (used.size !== n0) {
    G.meta.usedTypes = [...used];
    saveMeta();
  }
  if (Object.keys(MACHINES).every((t) => used.has(t))) unlockAch('collector');
  R.curSpeed = R.speed;
  R.sel = null;
  R.phaseFresh = false; // この期のレバレッジは、もう変えられない
  G.items = [];
  G.state = 'run';
  G.dirty = true;
  return 'ok';
}

function itemPos(item) {
  const P = G.run.path;
  const p = Math.max(0, Math.min(P.length - 1, item.p));
  const i = Math.floor(p);
  const f = p - i;
  const a = P[i];
  const b = P[Math.min(P.length - 1, i + 1)];
  return { x: (a[0] + (b[0] - a[0]) * f + 0.5) * TILE, y: (a[1] + (b[1] - a[1]) * f + 0.5) * TILE };
}

function spawnItem() {
  const R = G.run;
  const it = {
    uid: G.uid++, p: 0, last: 0, value: R.boss && R.boss.id === 'scrap' ? 0.1 : 1,
    tier: 0, alive: true, steps: 0, pop: 1, seed: Math.random(), unit: 0, trail: [],
  };
  G.items.push(it);
  R.spawned++;
  processTile(it, 0, null, G.items);
}

function updateRun(dt) {
  const R = G.run;
  R.t += dt;
  R.spawnTimer -= dt;
  while (R.spawned < R.itemsToday && R.spawnTimer <= 0) {
    spawnItem();
    R.spawnTimer += SPAWN_INTERVAL;
  }
  const end = R.path.length - 1;
  for (let i = 0; i < G.items.length; i++) {
    const it = G.items[i];
    if (!it.alive) continue;
    it.p += R.curSpeed * dt;
    while (it.alive && it.last < end && Math.floor(it.p) > it.last) {
      it.last++;
      processTile(it, it.last, null, G.items);
    }
    // 出荷口のマスまで来たら出荷（出荷口の横で複製されたアイテムもここで出る）
    if (it.alive && it.last >= end) shipItem(it);
  }
  G.items = G.items.filter((i) => i.alive);
  if (G.items.length >= 100) unlockAch('items100');
  if (!R.dayDone && R.spawned >= R.itemsToday && G.items.length === 0) {
    R.dayDone = true;
    R.endTimer = 0.9;
  }
  if (R.dayDone) {
    R.endTimer -= dt;
    if (R.endTimer <= 0) endDay();
  }
}

// 機械1台が1回の発動で何回効果を出すか（強化マスなら2回。反響レールは processTile で足す）
// 時計塔（レジェンド）：隣の時計塔1台ごとに、発動回数が2倍（強化マスと重なれば 2回→4回）。2026-11-17：+1 → 2倍
function repsOf(m) {
  let n = machineSpecial(m) === 'boost' ? 2 : 1;
  if (m.type !== 'clock' && clockCount()) n *= Math.pow(2, countAdjType(m.x, m.y, 'clock'));
  return n;
}
function clockCount() {
  const R = G.run;
  if (R.clockVer !== R.gridVer || R.clockVer == null) {
    R.clockVer = R.gridVer;
    R.clockN = placedMachines().filter((m) => m.type === 'clock').length;
  }
  return R.clockN;
}
// 改造キットを使える機械か（数値で効く「+」「×」の機械。何回でも重ねられる）
function canStar(m) {
  const k = MACHINES[m.type].kind;
  return k === 'add' || k === 'mult';
}
// 増幅器（レジェンド・2マス）：隣の「+」の効果は 4倍、7倍…（1台ごとに+3倍）。
// 隣の「×」の効果は 2.5乗（2台なら4乗）。2026-11-17：×も4倍 → 2.5乗（倍率の大きい機械の隣ほど伸びる）
// 2乗だと ×2 の機械が前（×5）より弱くなり、急冷槽の隣でも約2800倍止まりだった。2.5乗で急冷槽の盤面が約17万倍（賢者の石の半分）
const AMP_K = 3;
const AMP_POW = 1.5;
// 「+」の効果に掛かる倍率（増幅器・プリズム）
function ampMul(m) {
  return canStar(m) ? (1 + AMP_K * countAdjType(m.x, m.y, 'amp')) * prismFactor(m) : 1;
}
// 「×」の効果を何乗するか（1 + 隣の増幅器1台ごとに 1.5）
function ampPow(m) {
  return canStar(m) ? 1 + AMP_POW * countAdjType(m.x, m.y, 'amp') : 1;
}
// 「×base」の実際の倍率（強化・改造★・プリズムは増えた分に掛かる、冷却塔と金運の招き猫は+、最後に増幅器で累乗）
function mulEff(m, base, extra) {
  const f = 1 + (base - 1) * tuneMul(m.type) * starMul(m) * (canStar(m) ? prismFactor(m) : 1) + COOLER_ADD * countAdjType(m.x, m.y, 'cooler') + (extra || 0);
  const p = ampPow(m);
  return p > 1 && f > 1 ? Math.pow(f, p) : f;
}
// プリズム（エピック・常時・2マス）：隣のプリズム1台ごとに、そのプリズムに触れている機械の種類の数だけ ×1.6（追加効果で ×1.8）。累乗で効く
// 2026-11-17：×1.5 / ×1.7 → ×1.6 / ×1.8（×2 だと熱の盤面が76万倍で賢者の石を超えた。×1.6 で約5000倍）
const PRISM_BASE = 1.6;
function prismStep(p) {
  return Math.pow(modOn('prism') ? 1.8 : PRISM_BASE, prismKinds(p));
}
function prismFactor(m) {
  let f = 1;
  for (const p of adjMachineList(m.x, m.y)) {
    if (p.type !== 'prism' || offline(p)) continue;
    f *= prismStep(p);
  }
  return f;
}
function prismKinds(p) {
  return new Set(adjMachineList(p.x, p.y).filter((o) => !offline(o)).map((o) => o.type)).size;
}
// 改造★1つにつき効果 +30%
const STAR_STEP = 0.3;
function starMul(m) {
  return 1 + STAR_STEP * (m.star || 0);
}

// アイテムがベルトのk番目のマスに入ったとき。sim はシミュレーション用の機械状態（見込み計算）
// 1) そのマスに置かれたベルト型の機械 → 2) 横に置かれた機械（変換→加算→乗算→特殊）の順に発動
function processTile(item, k, sim, pool) {
  const R = G.run;
  const [x, y] = R.path[k];
  const born = []; // 分裂ゲートで生まれたアイテム（このマスの横の機械も通す）
  let echo = 0; // 反響レール：このマスの横の機械が追加で発動する回数
  // 還流ポンプで戻ってきて、もう一度通るマスか。2周目は「追加の発動」（反響レール・強化マス・山びこ）が起きず、どの機械も1回だけ発動する。
  // くり返しの仕組みどうしが掛け算になると（3回発動 × 3周 = 9回）、1か所に固めた盤面が桁違いに伸びるので、足し算にとどめる
  const revisit = item.maxK != null && k <= item.maxK;
  if (!revisit) item.maxK = k;
  const bm = R.grid[idx(x, y)];
  if (bm && !offline(bm)) {
    const d = MACHINES[bm.type];
    let reps = revisit ? 1 : repsOf(bm);
    // 反響レールの追加効果「山びこ」：前後1マスのベルト型も追加で発動する
    if (!revisit && bm.type !== 'echo' && modOn('echo')) {
      for (const j of [k - 1, k + 1]) {
        if (j < 0 || j >= R.path.length) continue;
        const e = R.grid[idx(R.path[j][0], R.path[j][1])];
        if (e && e.type === 'echo' && !offline(e)) reps += repsOf(e);
      }
    }
    if (d.apply) {
      const state = sim ? sim.get(bm.uid) : bm;
      for (let r = 0; r < reps && item.alive; r++) d.apply(makeCtx(state, item, !!sim, pool, born));
    }
    if (!sim) bm.flash = 1;
    // 還流ポンプで巻き戻されたら、このマスの横の機械は2周目に回す
    if (item.last !== k) return;
  }
  const list = [];
  for (const [dx, dy] of DIRS) {
    const m = machineAt(x + dx, y + dy);
    if (m && !offline(m) && MACHINES[m.type].apply && !isBeltType(m.type) && !list.includes(m)) list.push(m);
  }
  if (!list.length) return;
  // 反響レール：このマスと前後1マスにあれば、ここの横の機械が追加で発動する
  for (let j = Math.max(0, k - 1); j <= Math.min(R.path.length - 1, k + 1); j++) {
    const e = R.grid[idx(R.path[j][0], R.path[j][1])];
    if (e && e.type === 'echo' && !offline(e)) {
      echo += repsOf(e);
      if (!sim && !revisit) e.flash = 1;
    }
  }
  list.sort((a, b) => KIND_PRIO[MACHINES[a.type].kind] - KIND_PRIO[MACHINES[b.type].kind]);
  for (const it of born.length ? [item, ...born] : [item]) {
    for (const m of list) {
      const reps = revisit ? 1 : repsOf(m) + echo;
      for (let r = 0; r < reps; r++) {
        if (!it.alive) break;
        const state = sim ? sim.get(m.uid) : m;
        MACHINES[m.type].apply(makeCtx(state, it, !!sim, pool, born));
        if (!sim) m.flash = 1;
      }
    }
  }
}

// 触媒槽：次の「×」がもう1回効く。同じアイテムに重ねるほど薄まる（k回目の触媒は 1/k 回ぶん）
// 触媒を何個も並べたり、反響・還流で何度も浴びせたりしても、合計は「回数の対数」ぶんしか増えない
function useCatalyst(item, f) {
  item.cata--;
  item.cataUsed = (item.cataUsed || 0) + 1;
  return Math.pow(f, 1 / item.cataUsed);
}
function capValue(item) {
  if (!isFinite(item.value) || item.value > 1e300) item.value = 1e300;
}

function makeCtx(m, item, dry, pool, born) {
  const R = G.run;
  const pos = dry ? null : itemPos(item);
  const mc = dry ? null : machineCenter(m);
  const mx = dry ? 0 : mc.x;
  const my = dry ? 0 : mc.y;
  // 機械→アイテムへのビームと、機械からの波紋
  const fx = (color, big) => {
    addBeam(mx, my, pos.x, pos.y, color, big);
    addRing(mx, my, color, big ? 1.4 : 0.9);
  };
  return {
    item,
    m,
    dry,
    cats() {
      return countAdjType(m.x, m.y, 'cat');
    },
    coolers() {
      return COOLER_ADD * countAdjType(m.x, m.y, 'cooler');
    },
    // 見込み計算用：倍率をそのまま掛ける（演出なし）。期待値で掛けるので触媒もここで消費する
    scale(f) {
      if (item.cata > 0 && f > 1) f *= useCatalyst(item, f);
      item.value *= f;
      capValue(item);
    },
    // この機械の「追加効果」を研究済みか
    mod() {
      return modOn(m.type);
    },
    // 実績を解除する（見込み計算では何もしない）
    ach(id) {
      if (!dry) unlockAch(id);
    },
    // 招き猫の追加効果「金運」：隣の金庫・換金機の倍率 +1
    catBank() {
      return (m.type === 'vault' || m.type === 'exchange') && modOn('cat') ? countAdjType(m.x, m.y, 'cat') : 0;
    },
    // 「×base」の実際の倍率（強化・改造★・隣の増幅器は増えた分に掛かる、冷却塔と金運の招き猫は+1）
    eff(base) {
      return mulEff(m, base, this.catBank());
    },
    add(n) {
      if (n <= 0) return;
      n *= tuneMul(m.type) * starMul(m) * ampMul(m);
      item.value += n;
      capValue(item);
      item.steps = (item.steps || 0) + 1; // 品評台が数える
      if (dry) return;
      item.pop = 1;
      fx('#7fd6ff', false);
      addText(pos.x, pos.y - 14, '+' + fmt(n), '#7fd6ff', 14);
      Sfx.add(item.steps);
      checkUnit(item, pos);
    },
    // noCata: 触媒を使わない（急冷槽は自分で触媒を処理する）
    mul(base, jackpot, noCata) {
      let f = this.eff(base);
      // 「炉」の機械はアイテムを温める（隣のふいご1台につき +1）。冷却塔の隣だと熱を出さない（研究「断熱」で出す）
      // ふいごの追加効果「送風」：炉でなくても、隣にふいごがある「×」の機械は熱を出す
      const bellows = countAdjType(m.x, m.y, 'bellows');
      if (MACHINES[m.type].hot) {
        if (!countAdjType(m.x, m.y, 'cooler') || modOn('cooler')) item.heat = (item.heat || 0) + 1 + 2 * bellows; // ふいご1台につき +2（2026-11-17：+1 → +2）
      } else if (bellows && modOn('bellows') && MACHINES[m.type].kind === 'mult' && m.type !== 'quench') {
        item.heat = (item.heat || 0) + bellows;
      }
      // 触媒槽：次の「×」がもう1回かかる
      const cata = !noCata && item.cata > 0 && f > 1;
      if (cata) f *= useCatalyst(item, f);
      item.value *= f;
      capValue(item);
      item.steps = (item.steps || 0) + 1;
      if (dry) return;
      item.pop = 1.4;
      if (cata) {
        addText(pos.x, pos.y - 40, '触媒！', '#a6f06a', 16, true);
        addRing(pos.x, pos.y, '#a6f06a', 1.6);
        burst(pos.x, pos.y, '#a6f06a', 14);
      }
      if (m.type === 'vault' && f >= 5) unlockAch('vault5');
      if (this.catBank() > 0) unlockAch('x_cat_bank');
      if (jackpot) {
        R.dayStats.jackpots = (R.dayStats.jackpots || 0) + 1;
        if (cata) unlockAch('jackpot100');
        fx('#ffd447', true);
        addText(pos.x, pos.y - 20, '大当たり ×' + fmtMult(f), '#ffd447', 24, true);
        Sfx.jackpot();
        burst(pos.x, pos.y, '#ffd447', 32);
        addRing(pos.x, pos.y, '#ffd447', 2);
        G.shake = Math.max(G.shake, 7);
        flashScreen(0.35, '#ffd447');
        G.hitstop = Math.max(G.hitstop, 0.08);
      } else if (MACHINES[m.type].sky && f >= 2) {
        // 青天井の機械：倍率を少しだけ目立つ金色の文字で
        fx('#ffe27a', f >= 4);
        skyText(pos.x, pos.y - 18, '×' + fmtMult(f), f);
        Sfx.mult(item.steps);
        if (f >= 4) burst(pos.x, pos.y, '#ffe27a', 8);
      } else {
        fx('#ff8a5c', f >= 4);
        addText(pos.x, pos.y - 16, '×' + fmtMult(f), '#ff8a5c', 15 + Math.min(10, f * 1.3), f >= 3);
        Sfx.mult(item.steps);
        if (f >= 4) burst(pos.x, pos.y, '#ff8a5c', 8);
      }
      checkUnit(item, pos);
    },
    // 錬金釜（ベルト型なので1個につき1回）。ランクが上がるたびに ×RANK_MUL（3回で ×8）、もう金なら ×GOLD_PASS。
    // 錬金術師がいれば、ランクが上がるたびにさらに ×(1 + ALCH_STEP×台数)。溶解炉で下げたランクを上げ直したときも効く
    // 追加効果：錬金釜「錬金の火」＝ランクが上がるたび熱+3 ／ 錬金術師「大錬成」＝錬金術師が1台多いものとして数え、金の ×4 にも乗る
    transmute() {
      const placed = countPlaced('alchemist');
      const a = placed > 0 ? placed + (modOn('alchemist') ? 1 : 0) : 0;
      const alch = 1 + ALCH_STEP * a;
      if (item.tier >= rankCap()) {
        this.mul(GOLD_PASS);
        if (a > 0 && modOn('alchemist')) this.boost(alch, '大錬成', '#c9a2ff');
        return;
      }
      this.rankUp();
      if (modOn('transmuter')) item.heat = (item.heat || 0) + 3;
      if (a > 0 && !dry) unlockAch('alchemy3');
      const t = tierOf(item.tier);
      this.boost(rankMul() * alch, a > 0 ? `${t.name}・錬成` : t.name, a > 0 ? '#c9a2ff' : t.color);
    },
    // 賢者の石（レジェンド・ベルト型）：一気に金にする（もう金なら2段）。1段ごとに ×2（「真理」で ×3）と錬金術師の倍率がかかる。
    // 置いているあいだはランクの上限がない（rankCap）ので、このあとの錬金釜でも上がり続ける
    philo() {
      const steps = item.tier < 3 ? 3 - item.tier : 2;
      const placed = countPlaced('alchemist');
      const a = placed > 0 ? placed + (modOn('alchemist') ? 1 : 0) : 0;
      for (let i = 0; i < steps; i++) this.rankUp();
      if (a > 0 && !dry) unlockAch('alchemy3');
      const t = tierOf(item.tier);
      this.boost(Math.pow(rankMul() * (1 + ALCH_STEP * a), steps), `${t.name}${a > 0 ? '・錬成' : ''}`, a > 0 ? '#c9a2ff' : t.color);
    },
    // 溶解炉：素材ランクを1つ下げる
    rankDown() {
      if (item.tier >= 3 && !dry) unlockAch('melt_gold');
      item.tier = Math.max(0, item.tier - 1);
      if (dry) return;
      addText(pos.x, pos.y - 30, tierOf(item.tier).name + 'に', tierOf(item.tier).color, 13, true);
    },
    // 隣の「炉」の機械の数（双子炉以外。双子炉の追加効果「三つ子」）
    adjHot() {
      return adjMachineList(m.x, m.y).filter((o) => !offline(o) && o.type !== 'twin' && MACHINES[o.type].hot).length;
    },
    // 倍率をそのまま掛ける（改良・改造★・冷却塔は乗らない）。錬金術師など「別の機械の力」で掛けるとき
    boost(f, label, color) {
      item.value *= f;
      capValue(item);
      item.steps = (item.steps || 0) + 1;
      if (dry) return;
      item.pop = 1.4;
      fx(color, true);
      addText(pos.x, pos.y - 30, `${label} ×${fmtMult(f)}`, color, 17, true);
      burst(pos.x, pos.y, color, 10);
      Sfx.mult(item.steps);
      checkUnit(item, pos);
    },
    // バーナー：熱だけを足す（label があれば「ハズレ 熱+1」のように出す。宝くじ機の追加効果「残念賞」）
    heatUp(n, label) {
      item.heat = (item.heat || 0) + n;
      if (label) item.lotHeat = true; // 実績「ハズレも熱い」用
      if (dry) return;
      item.pop = 1.2;
      fx('#ff7a3d', false);
      addText(pos.x, pos.y - 16, `${label ? label + ' ' : ''}熱+${n}`, '#ff9a5c', label ? 12 : 14, true);
      if (!label) Sfx.whoosh();
    },
    // この機械がこのアイテムに初めて当たったか（換金機：1台につき1個1回）
    once() {
      if (item.onceBy && item.onceBy[m.uid]) return false;
      item.onceBy = { ...item.onceBy, [m.uid]: true };
      return true;
    },
    // コインを払う（見込み計算では実際には減らさず、払った分だけ数える）
    spend(n) {
      const left = R.coins - (dry ? R.drySpent || 0 : 0);
      if (left < n) return false;
      if (dry) {
        R.drySpent = (R.drySpent || 0) + n;
        return true;
      }
      R.coins -= n;
      R.dayStats.coins -= n;
      R.dayStats.spent += n; // 換金機のキャッシュバック・実績「散財」
      if (R.dayStats.spent >= 30) unlockAch('spend30');
      addText(mx, m.y * TILE + 6, '-' + n + '枚', '#ffb347', 13, true);
      G.dirty = true;
      return true;
    },
    // この機械がこのアイテムに当たった回数（今回を含む。熟練工）
    hitCount() {
      const n = ((item.hits && item.hits[m.uid]) || 0) + 1;
      item.hits = { ...item.hits, [m.uid]: n }; // 分身と共有しないよう作り直す
      if (!dry && n >= 6) unlockAch('artisan6');
      return n;
    },
    // 熟練工の数え始めを進める追加効果：蓄電池「余剰電力」（隣の蓄電池1台につき+1）／熟練工「金の匠」（金なら+2）
    hitBonus() {
      return (modOn('battery') ? countAdjType(m.x, m.y, 'battery') : 0) + (modOn('artisan') && item.tier >= 3 ? 2 : 0);
    },
    // N回ごとの機械：カウンターを w 進めて、今回で必要回数をまたいだか（料金所の「通行税」は銀・金を2個ぶんに数える）
    every(n, w = 1) {
      const ch = chargeOf(m);
      m.counter += w;
      if (m.counter < ch) return false;
      m.counter -= ch;
      m.fired = (m.fired || 0) + 1;
      return true;
    },
    // 今の持ちコイン（見込み計算では換金機が払った分を引く）
    coinsNow() {
      return R.coins - (dry ? R.drySpent || 0 : 0);
    },
    adjType(type) {
      return countAdjType(m.x, m.y, type);
    },
    // 隣の機械の種類数（プリズム）
    adjKinds() {
      return new Set(adjMachineList(m.x, m.y).filter((o) => !offline(o)).map((o) => o.type)).size;
    },
    // 急冷槽：熱を倍率に変えて（quenchMul：熱の3乗で伸びる）、熱を0に
    // 追加効果「余熱」：急冷しても熱の半分が残る
    // 触媒は「もう1回急冷する」：1回目で熱を使い切るので、余熱がなければ2回目は効かない（2乗にはならない）
    quench() {
      const h = item.heat;
      const keep = (x) => (modOn('quench') ? Math.floor(x / 2) : 0);
      let f = quenchMul(h);
      let rest = keep(h);
      if (item.cata > 0) {
        f *= useCatalyst(item, quenchMul(rest));
        rest = keep(rest);
      }
      item.heat = rest;
      if (!dry) {
        if (h >= 10) unlockAch('quench10');
        if (h >= 25) unlockAch('quench25');
        if (f >= 200) unlockAch('quench1000');
        if (item.zapHeat) unlockAch('x_zap_heat');
        if (item.lotHeat) unlockAch('x_lot_heat');
        addText(pos.x, pos.y - 56, `急冷！ 熱${h}`, '#9fd8ff', 13, true);
        burst(pos.x, pos.y, '#e8f6ff', 10 + Math.min(30, h * 2));
        addRing(pos.x, pos.y, '#9fd8ff', 1 + Math.min(1.5, h / 8));
        Sfx.whoosh();
        if (h >= 8) {
          G.shake = Math.max(G.shake, 4 + Math.min(8, h / 2));
          flashScreen(0.2, '#bfe6ff');
        }
      }
      this.mul(f, false, true);
    },
    // 分裂ゲート：価値半分の2個に分ける（1個のアイテムは1回だけ。分かれた2個はもう分裂しない）
    split() {
      if (item.split) return this.none('分裂済');
      if (pool.length >= MAX_ITEMS) return this.none('満杯');
      item.split = true;
      item.value *= modOn('splitter') ? 0.6 : 0.5; // 追加効果「厚切り」
      item.twin = true; // 分身（共鳴器が見る）
      const cl = { ...item, uid: dry ? 0 : G.uid++, p: item.p - 0.32, pop: 1.5, seed: Math.random(), trail: [] };
      pool.push(cl);
      if (born) born.push(cl);
      if (dry) return;
      R.dayStats.split++;
      item.pop = 1.5;
      fx('#5fd4f5', true);
      addText(pos.x, pos.y - 18, '分裂！', '#5fd4f5', 16, true);
      Sfx.split();
      burst(pos.x, pos.y, '#5fd4f5', 12);
    },
    // 触媒槽：次の「×」がもう1回かかる
    catalyze(n = 1) {
      item.cata = (item.cata || 0) + n;
      if (dry) return;
      item.pop = 1.2;
      fx('#a6f06a', false);
      addText(pos.x, pos.y - 14, '触媒', '#a6f06a', 13, true);
      Sfx.cata();
    },
    rankUp() {
      item.tier = Math.min(rankCap(), item.tier + 1);
      if (item.tier >= 4 && !dry) unlockAch('philo_gold');
      if (dry) return;
      const c = tierOf(item.tier).color;
      item.pop = 1.3;
      fx(c, false);
      Sfx.rank(item.tier); // 文字は錬金釜の倍率（「銅 ×2」など）で出す
      burst(pos.x, pos.y, c, 8);
    },
    coin(n) {
      if (dry) return;
      R.coins += n;
      R.dayStats.coins += n;
      addText(mx, m.y * TILE + 6, '+' + n + '枚', '#ffd447', 15, true);
      Sfx.coin();
      G.dirty = true;
    },
    // 複製（見込み計算でも数える）
    dup() {
      if (pool.length >= MAX_ITEMS) {
        if (!dry) addText(pos.x, pos.y - 14, '満杯', '#6b7385', 11);
        return;
      }
      item.twin = true;
      const cl = { ...item, uid: dry ? 0 : G.uid++, p: item.p - 0.32, pop: 1.5, seed: Math.random(), trail: [] };
      pool.push(cl);
      if (dry) return;
      R.dayStats.dup++;
      fx('#6fe3a5', true);
      addText(pos.x, pos.y - 18, '複製！', '#6fe3a5', 16, true);
      Sfx.dup();
      burst(pos.x, pos.y, '#6fe3a5', 12);
    },
    destroy() {
      item.alive = false;
      if (dry) return;
      R.dayStats.destroyed++;
      addText(pos.x, pos.y - 14, '消滅…', '#ff6b6b', 15, true);
      Sfx.destroy();
      burst(pos.x, pos.y, '#c0303c', 24);
      addRing(pos.x, pos.y, '#c0303c', 1.4);
    },
    none(t) {
      if (dry || !t) return;
      addText(pos.x, pos.y - 12, t, '#6b7385', 11);
    },
    // 還流ポンプ：ポンプ1台につき1回（別のポンプならもう一度戻せる）
    // 同じアイテムを巻き戻すたびに距離が短くなる（2回目は半分、3回目は3分の1…）。ポンプを並べても周回数が倍々にならない
    rewind(dist) {
      item.looped ||= {};
      if (item.looped[m.uid]) return this.none('還流済');
      item.looped = { ...item.looped, [m.uid]: true };
      const n = Math.ceil(dist / Object.keys(item.looped).length);
      const np = Math.max(0, item.p - n);
      item.p = np;
      item.last = Math.floor(np);
      if (dry) return;
      const to = itemPos(item);
      addBeam(pos.x, pos.y, to.x, to.y, '#4fd1c5', true);
      addRing(pos.x, pos.y, '#4fd1c5', 1);
      addRing(to.x, to.y, '#4fd1c5', 1.6);
      addText(to.x, to.y - 18, '還流！', '#4fd1c5', 18, true);
      Sfx.whoosh();
      burst(to.x, to.y, '#4fd1c5', 14);
      item.pop = 1.5;
      item.trail = [];
    },
    // 落雷塔：ベルト上の全アイテムに雷。アイテムごとに n回目の雷は ×(1 + k/n)
    // （何回でも効くが1発ずつ伸びが緩くなる。合計は浴びた回数の k乗くらい）
    // アイテムが多いほど落雷が増えて全員が育つが、2倍にしても指数的には爆発しない
    // heat: 追加効果「帯電」。熱を持っていないアイテムにだけ、この熱を付ける（雷の回数ぶん熱が増えると、急冷が桁違いに伸びる）
    strike(k, heat = 0) {
      const targets = pool.filter((o) => o.alive);
      for (const o of targets) {
        o.zap = (o.zap || 0) + 1;
        o.value *= 1 + k / o.zap;
        o.zapMul = (o.zapMul || 1) * (1 + k / o.zap); // 雷の合計の倍率（青天井の札に出す）
        if (heat && !o.heat) {
          o.heat = heat;
          o.zapHeat = true; // 実績「雷で沸かす」用
        }
        capValue(o);
      }
      if (dry) return;
      if (targets.length >= 50) unlockAch('storm50');
      if (targets.length >= 100) unlockAch('items100');
      if (targets.some((o) => o.zap >= 12)) unlockAch('zap12');
      let bolts = 0;
      let shown = 0;
      // 雷を多く浴びたアイテム（合計の倍率が大きい）3個は、青天井の札で「雷 合計×◯」を出す
      const top = new Set([...targets].sort((a, b) => b.zapMul - a.zapMul).slice(0, 3).filter((o) => o.zapMul >= 10));
      for (const o of targets) {
        const op = itemPos(o);
        if (bolts++ < 14) addBolt(mx, my, op.x, op.y);
        if (top.has(o)) skyText(op.x, op.y - 20, `合計×${fmtMult(Math.round(o.zapMul * 10) / 10)}`, o.zapMul);
        else if (shown++ < 30) addText(op.x, op.y - 16, '×' + fmtMult(Math.round((1 + k / o.zap) * 100) / 100), '#fff27a', 14, true);
        o.pop = 1.4;
        checkUnit(o, op);
      }
      addText(mx, my - 34, `大落雷！ ${targets.length}個`, '#fff27a', 22, true);
      addRing(mx, my, '#fff27a', 3);
      burst(mx, my, '#fff27a', 30);
      Sfx.thunder();
      flashScreen(0.45, '#fff6b0');
      G.shake = Math.max(G.shake, 10);
      G.hitstop = Math.max(G.hitstop, 0.12);
      G.zoom = Math.max(G.zoom, 0.7);
    },
  };
}

// 単位の実績（u：2=M, 3=B, 4=T, 5=e15, 6=e18）
const UNIT_ACH = { unit_m: 2, unit_b: 3, unit_t: 4, unit_e15: 5, unit_e18: 6 };
function checkUnitAch(u) {
  for (const id in UNIT_ACH) if (u >= UNIT_ACH[id]) unlockAch(id);
}
// 価値の単位（K・M・B・T…）が上がった瞬間の演出。K（1,000）は文字だけ、M から大演出
function checkUnit(item, pos) {
  const R = G.run;
  const u = unitIndex(item.value);
  if (u <= (item.unit || 0)) return;
  item.unit = u;
  checkUnitAch(u);
  const name = '1' + unitName(u);
  const color = UNIT_COLORS[Math.min(u, UNIT_COLORS.length - 1)];
  if (u > R.bestUnit && u >= 2) {
    // このランで初めての単位 → 大演出
    R.bestUnit = u;
    UI.banner(`${name} 突破！`, 'unit');
    flashScreen(0.55, color);
    G.hitstop = Math.max(G.hitstop, 0.16);
    G.shake = Math.max(G.shake, 10);
    G.zoom = 1;
    addRing(pos.x, pos.y, color, 3);
    addRing(pos.x, pos.y, '#ffffff', 2);
    burst(pos.x, pos.y, color, 40);
    Sfx.unitBig(u);
  } else if (u >= R.bestUnit - 1) {
    addText(pos.x, pos.y - 32, `${name} 到達`, color, 13 + u, true);
    addRing(pos.x, pos.y, color, 1.2);
    Sfx.unit(u);
  }
}

// 出荷のときの倍率：王冠（レジェンド）があれば、盤面の機械の種類1つごとに ×2.5（追加効果で ×2.8）。王冠が2台なら2倍
// 大型（2マス）の機械は2種類分に数える。2026-11-17：×2 → ×2.5、大型は2種類分（×3 だと大型を混ぜた盤面が45万倍で賢者の石を超えた）
function crownKinds() {
  const seen = new Map();
  for (const m of placedMachines()) if (!offline(m)) seen.set(m.type, (MACHINES[m.type].cells || 1) >= 2 ? 2 : 1);
  let n = 0;
  for (const v of seen.values()) n += v;
  return n;
}
function crownMul() {
  const crowns = countPlaced('crown');
  return crowns ? crowns * Math.pow(modOn('crown') ? 2.8 : CROWN_STEP, crownKinds()) : 1;
}
function shipMulOf(item) {
  return tierOf(item.tier).ship * crownMul();
}

function shipItem(item) {
  const R = G.run;
  item.alive = false;
  R.shippedCount = (R.shippedCount || 0) + 1;
  const e = R.path[R.path.length - 1];
  const ex = (e[0] + 0.5) * TILE;
  const ey = (e[1] + 0.5) * TILE;
  if (R.boss && R.boss.id === 'inspect' && R.shippedCount % 4 === 0) {
    addText(ex, ey - 26, '抜き取り', '#ff8fa3', 15, true);
    Sfx.destroy();
    return;
  }
  const t = tierOf(item.tier);
  const shipMul = shipMulOf(item);
  const v = Math.min(1e300, item.value * shipMul * prodMul());
  R.dayScore = Math.min(1e300, R.dayScore + v);
  R.phaseScore = Math.min(1e300, R.phaseScore + v);
  R.stats.totalShipped = Math.min(1e300, R.stats.totalShipped + v);
  R.dayStats.best = Math.max(R.dayStats.best, v);
  R.stats.bestItem = Math.max(R.stats.bestItem, v);

  // 連続出荷コンボ
  R.combo = R.t - R.lastShipT < 1.1 ? R.combo + 1 : 1;
  R.lastShipT = R.t;
  R.dayStats.maxCombo = Math.max(R.dayStats.maxCombo, R.combo);
  if (R.combo >= 40) unlockAch('combo40');
  if (item.tier >= 3) unlockAch('gold_ship');
  if (item.tier >= 3 && v >= 1e8) unlockAch('gold_oku');
  if (item.tier === 0 && v >= 1e6) unlockAch('stone_man');

  const mag = Math.log10(v + 1);
  const ucol = UNIT_COLORS[Math.min(unitIndex(v), UNIT_COLORS.length - 1)];
  addText(ex, ey - 26, '+' + fmt(v), shipMul > 1 ? t.color : ucol, Math.min(32, 15 + mag * 2.5), true);
  if (shipMul > 1) addText(ex, ey - 50, '王冠 ×' + fmtMult(Math.round(shipMul * 10) / 10), '#ffc21f', 13, true);
  if (R.combo >= 5 && R.combo % 5 === 0) {
    addText(ex, ey - 80, `${R.combo}連続出荷！`, '#7fd6ff', Math.min(24, 13 + R.combo / 4), true);
  }
  Sfx.ship(mag, R.combo);
  G.shipPulse = 1;
  burst(ex, ey, t.color, 6 + Math.min(24, Math.floor(mag * 3)));
  addRing(ex, ey, R.fever ? '#ffd447' : t.color, 1 + Math.min(1.5, mag / 6));
  const ratio = v / R.quota;
  if (ratio > 0.06) G.shake = Math.min(16, G.shake + 2 + ratio * 12);
  if (ratio > 0.25) G.zoom = Math.max(G.zoom, 0.6);

  if (!R.quotaHit && R.phaseScore >= R.quota) {
    R.quotaHit = true;
    R.fever = true;
    UI.banner(R.hi ? 'ハイスコア 自己ベスト更新！' : `第${R.phase}期 納期達成！`);
    Sfx.quota();
    flashScreen(0.7, '#ffd447');
    G.hitstop = Math.max(G.hitstop, 0.2);
    G.shake = Math.max(G.shake, 12);
    G.zoom = 1;
    confetti();
    for (let i = 0; i < 4; i++) burst(ex, ey, ['#ffd447', '#ff7a59', '#6fe3a5', '#7fd6ff'][i], 18);
    addRing(ex, ey, '#ffd447', 4);
  }
  if (R.quotaHit) {
    // ノルマの2倍・4倍…ごとに超過ボーナス+1枚
    const lv = Math.min(5, Math.floor(Math.log2(R.phaseScore / R.quota)));
    if (lv > R.overLevel) {
      R.overLevel = lv;
      addText(ex, ey - 104, `ノルマ×${Math.pow(2, lv)}！ ボーナス+1枚`, '#ffd447', 17, true);
      Sfx.milestone(lv);
      flashScreen(0.25, '#ffd447');
      addRing(ex, ey, '#ffd447', 2.5);
    }
  }
}

// 1日の終わり。その期の合計がノルマに届いていれば納期達成（次の日から次の期）。納期の日に届いていなければ解雇。
// どちらでもなければ、同じ期のまま次の日へ
// 貯金箱：1台ごとに、日の終わりに 持ちコイン10枚ごとに+1枚（上限なし）
// 2026-11-17：複利で毎日 1.8倍に増え続け、金庫・換金機と組むとエンドレスがどこまでも続くほど強い。
// ユーザーの判断で効果はそのまま、レア度を アンコモン → レア に上げて出にくくした
function piggyIncome(coins) {
  return countPlaced('piggy') * Math.floor(Math.max(0, coins) / 10);
}
function endDay() {
  const R = G.run;
  if (R.hi) return endHiDay();
  const cleared = R.phaseScore >= R.quota;
  const daysLeft = R.deadline - R.day; // 納期まで残り何日あるか（今日は入れない）
  if (!cleared && daysLeft <= 0) {
    R.stats.days = R.day;
    G.state = 'over';
    // エンドレスは「どこまで行けたか」を競うので、届かなかったら解雇ではなく、そこで終わり
    UI.banner(R.endless ? `エンドレス 第${R.phase}期で終了` : '納期に間に合わず…', 'bad');
    Sfx.fail();
    G.dirty = true;
    setTimeout(() => endRun(R.endless ? 'endless' : 'fail'), 1300);
    return;
  }
  const lev = R.lev || 0;
  const coinsAtEnd = R.coins; // 稼働が終わった時点の持ちコイン
  // 毎日の報酬：基本 + 利息 + 貯金箱 + キャッシュバック
  const base = R.boss ? 6 : 4;
  const interest = Math.min(R.interestCap, Math.floor(R.coins / 5));
  const piggy = piggyIncome(R.coins); // 貯金箱
  const cashback = modOn('exchange') ? Math.floor((R.dayStats.spent || 0) / 2) : 0; // 換金機「キャッシュバック」
  const dayPts = DAY_PATENT;
  R.stats.patentPts += dayPts;
  // 納期達成の報酬：基本 + 超過ボーナス + 前倒しボーナス。レバレッジは基本と超過に +50%/Lv
  let clear = null;
  if (cleared) {
    const ratio = R.phaseScore / R.quota;
    const over = Math.max(0, Math.min(5, Math.floor(Math.log2(ratio))));
    const bonus = PHASE_COIN_BASE + PHASE_COIN_STEP * R.phase;
    const early = EARLY_COIN * daysLeft;
    const levBonus = Math.round((bonus + over) * (levCoinMul(lev) - 1));
    const pts = PHASE_PATENT * R.phase * levPatentMul(lev);
    // 前倒し達成（納期の日より前に達成）：設置枠 +1 が確定でもらえる。納期の日ちょうどの達成はコインだけ
    const slot = daysLeft >= 1;
    if (slot) {
      R.boardCap++;
      R.stats.earlySlots++;
    }
    clear = { phase: R.phase, ratio, over, bonus, early, daysLeft, levBonus, pts, slot, oneDay: R.day === R.phaseStartDay };
    R.coins += bonus + over + early + levBonus;
    R.stats.patentPts += pts;
    R.stats.levSum += lev;
    R.stats.levMin = Math.min(R.stats.levMin, lev);
    R.stats.levMax = Math.max(R.stats.levMax, lev);
    R.stats.phasesCleared = R.phase;
    R.stats.bestRatio = Math.max(R.stats.bestRatio, ratio);
  }
  R.coins += base + interest + piggy + cashback;
  // この日の終わりにもらったコインの合計（結果画面で大きく出す）。稼働中に機械から入ったぶんは別に数える
  const coinTotal = base + interest + piggy + cashback + (clear ? clear.bonus + clear.over + clear.early + clear.levBonus : 0);
  R.lastReward = { base, interest, piggy, cashback, lev, dayPts, clear, daysLeft, need: Math.max(0, R.quota - R.phaseScore), coinTotal, runCoins: Math.max(0, R.dayStats.coins || 0) };
  R.stats.days = R.day;
  R.stats.bestDay = Math.max(R.stats.bestDay, R.dayScore);
  R.lastReward.records = recordDay(R, clear);
  checkDayAchievements(clear, coinsAtEnd);
  R.rewards = rollRewards(!!clear);
  G.state = 'result';
  G.dirty = true;
  const firstWin = cleared && R.phase === PHASES && !R.victory;
  R.gachaPending = !!clear && !firstWin;
  if (firstWin) R.victory = true;
  UI.showResult(firstWin);
}

// ---------- エンドレス（完走のあと） ----------
// 第7期・第8期…と期を続ける。ノルマは quotaFor が決める（1期ごとに桁の伸びが大きくなる）。納期に届かなければそこで終わり
function startEndless() {
  G.run.endless = true;
}

// ---------- ハイスコアモード（完走のあと） ----------
// ノルマはなく、HISCORE_DAYS 日のあいだに出荷した合計がハイスコアになる。落ちることはない
// 画面のノルマの欄には、これまでの自己ベストを出す（超えると「自己ベスト更新」の演出）
function startHiscore() {
  const R = G.run;
  R.hi = { startDay: R.day + 1, endDay: R.day + HISCORE_DAYS, best: G.meta.best.hiscore || 0 };
  R.phaseScore = 0;
  R.deadline = R.hi.endDay;
  // 自己ベストがまだないときは、超える目標もないので演出は出さない
  R.quotaBase = R.hi.best > 0 ? R.hi.best : Infinity;
  R.quota = R.quotaBase;
  R.lev = 0;
  R.phaseFresh = false;
}
function endHiDay() {
  const R = G.run;
  const coinsAtEnd = R.coins;
  const base = R.boss ? 6 : 4;
  const interest = Math.min(R.interestCap, Math.floor(R.coins / 5));
  const piggy = piggyIncome(R.coins);
  const cashback = modOn('exchange') ? Math.floor((R.dayStats.spent || 0) / 2) : 0;
  const dayPts = DAY_PATENT;
  R.stats.patentPts += dayPts;
  R.coins += base + interest + piggy + cashback;
  const daysLeft = R.hi.endDay - R.day;
  const done = daysLeft <= 0;
  R.hi.total = R.phaseScore;
  // 最後の日：ハイスコアを記録して、桁に応じた特許（1兆を超えたぶん、1桁につき1）
  let bonus = 0;
  if (done) {
    bonus = Math.max(0, Math.floor(Math.log10(Math.max(1, R.phaseScore))) - HISCORE_PATENT_FROM);
    R.stats.bonusPatents += bonus;
    R.hi.done = true;
    R.hi.bonus = bonus;
    R.hi.newBest = !devOn() && R.phaseScore > (G.meta.best.hiscore || 0);
    bumpBest('hiscore', R.phaseScore);
    checkHiAchievements(R.phaseScore);
  }
  R.lastReward = { base, interest, piggy, cashback, lev: 0, dayPts, clear: null, daysLeft, need: 0, hi: true, coinTotal: base + interest + piggy + cashback, runCoins: Math.max(0, R.dayStats.coins || 0) };
  R.stats.days = R.day;
  R.stats.bestDay = Math.max(R.stats.bestDay, R.dayScore);
  R.lastReward.records = recordDay(R, null);
  checkDayAchievements(null, coinsAtEnd);
  R.rewards = done ? [] : rollRewards(false);
  G.state = 'result';
  G.dirty = true;
  UI.showResult(false);
}
function checkHiAchievements(total) {
  if (devOn()) return;
  unlockAch('endless15');
  if (total >= 1e12) unlockAch('hi_t');
  if (total >= 1e15) unlockAch('hi_e15');
}

// 1日の終わりに見る実績。clear は、今日で納期を達成したときの内容（達成していなければ null）
function checkDayAchievements(clear, coinsAtEnd) {
  const R = G.run;
  const ds = R.dayStats;
  const lev = R.lev || 0;
  if (clear) {
    unlockAch('first_day');
    if (clear.phase >= 2) unlockAch('day6');
    if (clear.phase === PHASES) {
      unlockAch('win');

      if (R.stats.levMin >= 1) unlockAch('lev_all');
      if (R.stats.levSum >= 10) unlockAch('lev_sum');
      if ((G.meta.wins || 0) + 1 >= 3) unlockAch('wins3');
      if (R.day <= PHASES) unlockAch('early_all');
      if (R.day <= 12) unlockAch('fast_win');
      if (R.daily) unlockAch('daily_win');
      if (lev >= 1) unlockAch('lev_end');
    }
    if (clear.phase >= 4) unlockAch('end4');
    if (clear.phase >= 5) unlockAch('end6');
    if (R.endless && clear.phase >= 8) unlockAch('endless8');
    if (R.endless && clear.phase >= 10) unlockAch('endless10');
    if (clear.phase >= 4 && !R.daily && !Object.values(researchStore()).some((v) => v > 0)) unlockAch('win_nores');
    if (clear.oneDay) unlockAch('early1');
    // レバレッジ
    if (lev >= 1) unlockAch('lev1');
    if (lev >= 3) unlockAch('lev3');
    if (lev >= 5) unlockAch('lev5');
    if (R.boss && lev >= 2) unlockAch('lev_boss');
    if (clear.ratio < 1.1) unlockAch('narrow');
    if (clear.phase >= 2 && placedCount() <= 3) unlockAch('mini3');
    if (clear.phase >= 2 && coinsAtEnd === 0) unlockAch('broke');
  }
  // 記録
  if (R.dayScore >= R.quota * 100) unlockAch('over100');
  if (R.dayScore >= R.quota * 10000) unlockAch('over10000');
  if (R.dayScore >= 1e12) unlockAch('score_cho');
  if (R.boardCap >= 10) unlockAch('slots10');
  if (R.boardCap >= 13) unlockAch('slots13');
  if (R.coins >= 100) unlockAch('rich100');
  if (R.coins >= 250) unlockAch('rich250');
  if (ds.dup + ds.split >= 100) unlockAch('swarm100');
  if ((ds.jackpots || 0) >= 30) unlockAch('jackpot30');
  if (clear && R.boss && !G.meta.bossCleared.includes(R.boss.id)) {
    G.meta.bossCleared.push(R.boss.id);
    saveMeta();
  }
  if (BOSS_RULES.every((b) => G.meta.bossCleared.includes(b.id))) unlockAch('boss_all');
}

// 稼働開始のときに見る実績（盤面の並べ方）
function checkStartAchievements() {
  const ms = placedMachines().filter((m) => !offline(m));
  const adj = (m, type) => countAdjType(m.x, m.y, type);
  for (const m of ms) {
    if (m.type === 'twin' && adj(m, 'twin') > 0) unlockAch('twin_pair');
    if (m.type === 'mason' && adj(m, 'sieve') >= 2) unlockAch('mason2');
    if (m.type === 'lottery' && adj(m, 'cat') >= 3) unlockAch('cats3');
  }
  if (ms.filter((m) => m.type === 'thunder').length >= 2) unlockAch('thunder2');
  // 追加効果を研究した機械を動かす
  if (ms.filter((m) => MACHINES[m.type].rarity >= 5).length >= 2) unlockAch('leg_run');
  if (ms.some((m) => m.type === 'clock')) unlockAch('clock_run');
  if (ms.some((m) => m.type === 'crown') && new Set(ms.map((m) => m.type)).size >= 8) unlockAch('crown8');
  const mods = new Set(ms.filter((m) => modOn(m.type)).map((m) => m.type));
  if (mods.size >= 1) unlockAch('x_first');
  if (mods.size >= 3) unlockAch('x_three');
}
// 研究を進めたときに見る実績（テストモードの砂場では解除しない）
function checkResearchAchievements() {
  if (devOn()) return;
  const res = G.meta.research;
  const total = RESEARCH.reduce((s, r) => s + (res[r.id] || 0), 0);
  if (total >= 5) unlockAch('res5');
  if (total >= 40) unlockAch('res25');
  if (RESEARCH.filter((r) => r.kind === 'mod' && res[r.id] > 0).length >= 5) unlockAch('mods10');
  if (RESEARCH_TABS.some((t) => t.id !== 'gen' && tierOpen(t.id, 3))) unlockAch('branch_top');
}

// ---------- 日報ボーナス（日が終わるたびに3つから1つ選ぶ。納期を達成した日は中身が豪華になる） ----------
const REWARD_TYPES = [
  { id: 'coins', w: 3, ok: () => true },
  { id: 'machine', w: 3, ok: () => true },
  { id: 'kit', w: 3, ok: () => placedCount() + G.run.tray.length > 0 },
  // 「設置枠 +1」は抽選からなくした（前倒し達成の確定ボーナスに移した）
  { id: 'patent', w: 1.5, ok: () => true },
  { id: 'quota', w: 1.5, ok: (R) => !R.hi },
  { id: 'shop', w: 2, ok: () => true },
  { id: 'reroll', w: 2, ok: () => true },
];
function rollRewards(big) {
  const R = G.run;
  const n = 3 + rlv('reward');
  const pool = REWARD_TYPES.filter((t) => t.ok(R));
  const out = [];
  const rnd = rng('reward:' + R.day);
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, t) => s + t.w, 0);
    let r = rnd() * total;
    let i = 0;
    for (; i < pool.length - 1; i++) {
      r -= pool[i].w;
      if (r <= 0) break;
    }
    const t = pool.splice(i, 1)[0];
    // n: 数（コインの枚数、キットの個数、特許、ショップの品数、リロールの回数）。納期を達成した日は多い
    const rw = { id: t.id, big: !!big };
    if (t.id === 'coins') rw.n = (4 + R.day) * (big ? 2 : 1);
    if (t.id === 'kit') rw.n = big ? 2 : 1;
    if (t.id === 'patent') rw.n = big ? 4 : 2;
    if (t.id === 'shop') rw.n = big ? 3 : 2;
    if (t.id === 'reroll') rw.n = big ? 5 : 3;
    if (t.id === 'machine') {
      // 相性のいい機械が出やすい。納期を達成した日は、レアの機械（なければアンコモン以上）
      const pool2 = machinePool().filter((k) => MACHINES[k].rarity >= 2);
      const rare = pool2.filter((k) => MACHINES[k].rarity >= 3);
      rw.type = weightedPick(big && rare.length ? rare : pool2, rnd);
    }
    out.push(rw);
  }
  return out;
}
function rewardText(rw) {
  switch (rw.id) {
    case 'coins': return { t: `コイン +${rw.n}枚`, d: 'すぐにもらえる' };
    case 'machine': return { t: `「${MACHINES[rw.type].name}」をもらう`, d: MACHINES[rw.type].desc };
    case 'kit': return { t: `改造キット${rw.n > 1 ? ' ×' + rw.n : ''}`, d: '「+」「×」の機械1台を <b>★改造</b>：効果 <b>+30%</b>（重ねがけできる）。準備画面で使う' };
    case 'patent': return { t: `特許 +${rw.n}`, d: 'ランの終わりに受け取る' };
    case 'quota': return { t: '納期のノルマ -20%', d: rw.big ? '次の期のノルマが軽くなる' : 'いまの期のノルマが軽くなる' };
    case 'shop': return { t: `明日のショップ +${rw.n}品`, d: 'リロールしても品数はそのまま' };
    case 'reroll': return { t: `リロール${rw.n}回無料`, d: '明日以降も使える' };
  }
  return { t: '?', d: '' };
}
function chooseReward(i) {
  const R = G.run;
  const rw = R.rewards && R.rewards[i];
  if (!rw) return false;
  switch (rw.id) {
    case 'coins': R.coins += rw.n; break;
    case 'machine': R.tray.push(makeMachine(rw.type)); gotMachine(rw.type); break;
    case 'kit': R.kits += rw.n; break;
    case 'patent': R.stats.bonusPatents += rw.n; break;
    case 'quota': R.quotaCut = true; break;
    case 'shop': R.shopBonusNext += rw.n; break;
    case 'reroll': R.freeRerolls += rw.n; break;
  }
  R.rewards = null;
  return true;
}
// 改造キットを使う
function applyKit(uid) {
  const R = G.run;
  const f = findMachine(uid);
  if (!f || R.kits <= 0 || !canStar(f.m)) return false;
  R.kits--;
  f.m.star = (f.m.star || 0) + 1;
  G.dirty = true;
  return true;
}

function nextDay() {
  const R = G.run;
  if (R.gachaPending) drawGacha(); // 納期達成ガチャを回さずに進んだとき（念のため）
  const clearedToday = !!(R.lastReward && R.lastReward.clear);
  R.day++;
  // 納期を達成していたら、今日から次の期（納期は今日から PHASE_DAYS 日後）。ハイスコアモードでは期は進まない
  if (clearedToday && !R.hi) {
    R.phase++;
    startPhase();
  }
  R.lastReward = null;
  for (const m of placedMachines()) m.disabled = false;
  R.rerollCost = baseRerollCost();
  R.shopBonusToday = R.shopBonusNext;
  R.shopBonusNext = 0;
  R.rewards = null;
  prepareDay();
  rollShop(true);
  G.items = [];
  G.state = 'build';
  G.dirty = true;
}

// ---------- 自己ベストとランの履歴 ----------
// テストモード中のランは自己ベストに数えない（履歴には 🛠 付きで残す）
const HISTORY_MAX = 30;
function bumpBest(key, v) {
  const b = G.meta.best;
  // 日替わりチャレンジは条件が違う（研究なし・全部の機械が並ぶ）ので、ふだんの自己ベストには数えない
  if (devOn() || (G.run && G.run.daily) || !(v > (b[key] || 0))) return false;
  b[key] = v;
  return true;
}
// 1日の終わり：途中でやめても記録が残るように、その日のうちに更新して保存する。clear は納期を達成したときの内容
// 戻り値：この日に初めて自己ベストを超えた項目（はじめてのランは「新記録」と言わない）
function recordDay(R, clear) {
  const out = [];
  const pb = R.prevBest || {};
  const check = (key, v) => {
    const was = G.meta.best[key] || 0;
    if (bumpBest(key, v) && (pb[key] || 0) > 0 && was <= (pb[key] || 0)) out.push(key);
  };
  check('item', R.dayStats.best);
  check('dayScore', R.dayScore);
  if (clear) {
    check('ratio', clear.ratio);
    check('lev', R.lev || 0);
    bumpBest('phase', clear.phase);
  }
  bumpBest('day', R.day);
  saveMeta();
  return out;
}
// ランの終わり：最後の自己ベストを更新して、履歴に1件足す
function recordRun(R, gained, reason) {
  bumpBest('day', R.stats.days);
  bumpBest('phase', R.stats.phasesCleared);
  bumpBest('item', R.stats.bestItem);
  bumpBest('lev', R.stats.levMax || 0);

  bumpBest('total', R.stats.totalShipped);
  bumpBest('patents', gained);
  if (R.hi && R.hi.done) bumpBest('hiscore', R.hi.total || 0);
  const pb = R.prevBest || {};
  const now = [['hiscore', R.hi && R.hi.done ? R.hi.total || 0 : 0], ['phase', R.stats.phasesCleared], ['item', R.stats.bestItem], ['dayScore', R.stats.bestDay], ['ratio', R.stats.bestRatio], ['lev', R.stats.levMax || 0], ['total', R.stats.totalShipped], ['patents', gained]];
  R.newRecords = devOn() || R.daily ? [] : now.filter(([k, v]) => (pb[k] || 0) > 0 && v > pb[k]).map(([k]) => k);
  const board = placedMachines().map((m) => m.type);
  G.meta.history.unshift({
    t: Date.now(), days: R.stats.days, phases: R.stats.phasesCleared, win: !!R.victory, reason, layout: R.layout.name, hi: R.hi && R.hi.done ? R.hi.total || 0 : null, endless: R.endless ? 1 : undefined,
    item: R.stats.bestItem, day: R.stats.bestDay, total: R.stats.totalShipped, lev: R.stats.levMax || 0,
    patents: gained, board, dev: devOn(), daily: R.daily ? R.daily.label : undefined,
  });
  G.meta.history.length = Math.min(G.meta.history.length, HISTORY_MAX);
}

// 特許 = 1日終えるごとに 0.5 ＋ 納期を達成するごとに 3×期 ×（レバレッジ倍率）＋ 完走で+5 ＋ 日報ボーナスの特許 ＋ ハイスコアの桁のボーナス
function patentsFor(R) {
  return Math.round(R.stats.patentPts) + (R.victory ? 5 : 0) + R.stats.bonusPatents;
}
// 日替わりチャレンジの記録（その日のベスト：達成した期 → 出荷の合計の順で比べる）
// その日はじめて最後まで遊んだときだけ、日替わりの特許（日によって 3〜6）がもらえる。戻り値はその特許
const DAILY_KEEP = 30;
function dailyScore(phases, total) {
  return phases * 1e3 + Math.log10(Math.max(1, total));
}
function recordDaily(R) {
  unlockAch('daily_play');
  const all = G.meta.daily || (G.meta.daily = {});
  const k = R.daily.key;
  const rec = all[k] || { plays: 0, phases: 0, total: 0, days: 0, item: 0, got: 0 };
  const phases = R.stats.phasesCleared;
  const total = R.stats.totalShipped;
  rec.plays++;
  R.daily.prev = rec.plays > 1 ? { phases: rec.phases, total: rec.total } : null;
  R.daily.newBest = rec.plays === 1 || dailyScore(phases, total) > dailyScore(rec.phases, rec.total);
  if (R.daily.newBest) Object.assign(rec, { phases, total, days: R.stats.days, item: R.stats.bestItem, win: !!R.victory });
  let bonus = 0;
  if (!rec.got && !devOn()) {
    bonus = R.daily.bonus;
    rec.got = bonus;
  }
  R.daily.gotBonus = bonus;
  all[k] = rec;
  // 古い日の記録は消す（新しい DAILY_KEEP 日ぶん）
  const keys = Object.keys(all).sort();
  while (keys.length > DAILY_KEEP) delete all[keys.shift()];
  return bonus;
}
// reason: 'fail' | 'retire' | 'quit'
function endRun(reason) {
  const R = G.run;
  if (!R || R.ended) return;
  R.ended = true;
  let gained = patentsFor(R);
  if (R.daily) gained += recordDaily(R);
  finishTutorial(); // 途中で終わっても、チュートリアルは済みにする（タイトルからもう一度見られる）
  G.meta.patents += gained;
  G.meta.runs++;
  if (R.victory && !R.daily) G.meta.wins = (G.meta.wins || 0) + 1;
  recordRun(R, gained, reason);
  G.flat = false; // ここから先（研究所など）は、ふだんの研究で見る
  saveMeta();
  G.state = 'over';
  G.dirty = true;
  UI.showGameOver(gained, reason);
}

// ---------- 見込み計算（画面には出さない。ボットと探索ツールが使う） ----------
function estimateDay() {
  const R = G.run;
  const sim = new Map();
  for (const m of placedMachines()) sim.set(m.uid, { ...m, counter: 0, dayCount: 0, fired: 0 });
  R.drySpent = 0; // 換金機が見込みの中で払うコイン
  const rnd = Math.random;
  Math.random = () => 0.99; // 宝くじ・呪いは手堅い見積もりで別計算（cautiousMean）。その他のランダムは固定
  let total = 0;
  let one = -1;
  // 本番と同じく時間を進めて、アイテムが混ざって流れる順番を再現する
  const speed = R.speed;
  const end = R.path.length - 1;
  const dt = 1 / 30;
  const items = [];
  let spawned = 0;
  let timer = 0;
  let shipped = 0;
  try {
    for (let guard = 0; guard < 20000 && (spawned < R.itemsToday || items.length); guard++) {
      timer -= dt;
      while (spawned < R.itemsToday && timer <= 0) {
        const it = { value: R.boss && R.boss.id === 'scrap' ? 0.1 : 1, tier: 0, alive: true, p: 0, last: 0, n: spawned++ };
        items.push(it);
        processTile(it, 0, sim, items);
        timer += SPAWN_INTERVAL;
      }
      for (const it of items) {
        if (!it.alive) continue;
        it.p += speed * dt;
        while (it.alive && it.last < end && Math.floor(it.p) > it.last) {
          it.last++;
          processTile(it, it.last, sim, items);
        }
        if (it.alive && it.last >= end) {
          const v = it.value * shipMulOf(it) * prodMul();
          if (one < 0) one = v; // 最初に出荷されたアイテム
          shipped++;
          if (!(R.boss && R.boss.id === 'inspect' && shipped % 4 === 0)) total += v;
          it.alive = false;
        }
      }
      for (let i = items.length - 1; i >= 0; i--) if (!items[i].alive) items.splice(i, 1);
    }
  } finally {
    Math.random = rnd;
  }
  G.estimate = { total: Math.min(total, 1e300), one: Math.max(0, one) };
}

// ---------- 演出 ----------
function addText(x, y, s, color, size = 14, bold = false) {
  G.texts.push({ x: x + (Math.random() - 0.5) * 8, y, s, color, size, bold, life: 0, max: 0.9, vy: -55 });
  if (G.texts.length > 260) G.texts.splice(0, G.texts.length - 260);
}
// 青天井の機械の倍率：ほかの倍率の文字より少しだけ大きく、金色の縁取りで出す（前は黒い札・輪・音で目立たせすぎた）
function skyText(x, y, s, f) {
  const lv = Math.min(2, Math.floor(Math.log10(Math.max(1, f)))); // 0:×2〜9 1:×10〜 2:×100〜
  G.texts.push({ x: x + (Math.random() - 0.5) * 8, y, s, color: '#ffe27a', size: 17 + lv * 2, bold: true, life: 0, max: 1.05, vy: -50, sky: true });
  if (G.texts.length > 260) G.texts.splice(0, G.texts.length - 260);
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 220;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0, max: 0.4 + Math.random() * 0.5, color, r: 1.5 + Math.random() * 2.5, g: 520 });
  }
  if (G.particles.length > 1200) G.particles.splice(0, G.particles.length - 1200);
}
// ノルマ達成の紙吹雪
function confetti() {
  const cols = ['#ffd447', '#ff7a59', '#6fe3a5', '#7fd6ff', '#f687b3', '#ffffff'];
  for (let i = 0; i < 140; i++) {
    G.particles.push({
      x: Math.random() * COLS * TILE, y: -10 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 120, vy: 60 + Math.random() * 160,
      life: 0, max: 2 + Math.random() * 1.2, color: pick(cols), r: 3 + Math.random() * 3,
      g: 90, conf: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
    });
  }
}
function addBeam(x1, y1, x2, y2, color, thick) {
  G.beams.push({ x1, y1, x2, y2, color, life: 0, max: thick ? 0.3 : 0.16, w: thick ? 5 : 2.5 });
  if (G.beams.length > 160) G.beams.splice(0, G.beams.length - 160);
}
// ギザギザの雷
function addBolt(x1, y1, x2, y2) {
  const pts = [[x1, y1]];
  const n = 7;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    const off = (Math.random() - 0.5) * Math.min(40, len * 0.25);
    pts.push([x1 + dx * t + (-dy / len) * off, y1 + dy * t + (dx / len) * off]);
  }
  pts.push([x2, y2]);
  G.beams.push({ pts, color: '#fff27a', life: 0, max: 0.4, w: 3.5 });
}
function addRing(x, y, color, scale = 1) {
  G.rings.push({ x, y, color, life: 0, max: 0.3 + 0.12 * scale, r1: 30 * scale });
  if (G.rings.length > 140) G.rings.splice(0, G.rings.length - 140);
}
function flashScreen(a, color) {
  if (a > G.flash) {
    G.flash = a;
    G.flashColor = color;
  }
}

function updateEffects(dt) {
  for (const t of G.texts) {
    t.life += dt;
    t.y += t.vy * dt;
    t.vy *= Math.pow(0.04, dt);
  }
  G.texts = G.texts.filter((t) => t.life < t.max);
  for (const p of G.particles) {
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.conf) {
      p.rot += p.vr * dt;
      p.vy += p.g * dt;
      p.vx *= Math.pow(0.5, dt);
    } else if (p.g) {
      p.vy += p.g * dt;
      p.vx *= Math.pow(0.2, dt);
    }
  }
  G.particles = G.particles.filter((p) => p.life < p.max);
  for (const b of G.beams) b.life += dt;
  G.beams = G.beams.filter((b) => b.life < b.max);
  for (const r of G.rings) r.life += dt;
  G.rings = G.rings.filter((r) => r.life < r.max);
  G.shake = Math.max(0, G.shake - dt * 40);
  G.shipPulse = Math.max(0, G.shipPulse - dt * 4);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.zoom = Math.max(0, G.zoom - dt * 3.5);
  if (G.run) {
    for (const m of placedMachines()) m.flash = Math.max(0, m.flash - dt * 5);
    for (const it of G.items) it.pop = Math.max(0, it.pop - dt * 5);
    const target = G.run.phaseScore; // HUDは今の期の合計を出す
    G.dispScore += (target - G.dispScore) * Math.min(1, dt * 12);
    if (Math.abs(target - G.dispScore) < 0.5) G.dispScore = target;
  }
}

function update(realDt) {
  G.time += realDt;
  if (G.state === 'run') {
    let simDt = realDt * G.speedMul;
    if (G.hitstop > 0) {
      G.hitstop -= realDt;
      simDt *= 0.1;
    }
    while (simDt > 0 && G.state === 'run') {
      const step = Math.min(1 / 60, simDt);
      updateRun(step);
      simDt -= step;
    }
  } else {
    G.hitstop = 0;
    // タイトル画面の後ろで、見本の工場を動かす
    if (G.state === 'title' && G.run && G.run.demo) {
      let simDt = Math.min(0.1, realDt);
      while (simDt > 0) {
        const step = Math.min(1 / 60, simDt);
        demoStep(step);
        simDt -= step;
      }
    }
  }
  updateEffects(realDt);
}

</script>
<script>
// ===== 描画 =====
// 重い shadowBlur は使わず、事前に作った「光のスプライト」を加算合成して光らせる
const Render = (() => {
  const W = COLS * TILE;
  const H = ROWS * TILE;
  const FONT = '"M PLUS 1p", "Yu Gothic UI", "Meiryo", sans-serif';
  let cv;
  let ctx;
  let titlePath = null;

  function init(canvas) {
    cv = canvas;
    ctx = cv.getContext('2d');
    titlePath = buildPath(LAYOUTS[0].pts);
    resize();
  }

  // 描画解像度（重い環境では自動で下げる）
  const QUALITY = [Math.min(2, window.devicePixelRatio || 1), 1.25, 1, 0.75];
  let quality = 0;
  let slowTime = 0;
  let lastDraw = 0;

  function resize() {
    const wrap = cv.parentElement;
    const r = wrap.getBoundingClientRect();
    // 盤面の枠（#board-wrap）の大きさは ui.js の layout() と style.css が決める。その中に縦横比を保って収める
    const pad = 2;
    const availW = r.width - pad;
    const availH = r.height - pad;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    const cssW = Math.floor(W * s);
    const cssH = Math.floor(H * s);
    const k = (cssW * Math.min(QUALITY[0], QUALITY[quality])) / W;
    const bw = Math.round(W * k);
    const bh = Math.round(H * k);
    if (cv.style.width === cssW + 'px' && cv.width === bw && cv.height === bh) return;
    cv.style.width = cssW + 'px';
    cv.style.height = cssH + 'px';
    cv.width = bw;
    cv.height = bh;
    floorKey = '';
  }

  // 画面座標 → 盤面座標
  function toBoard(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    const x = ((clientX - r.left) / r.width) * W;
    const y = ((clientY - r.top) / r.height) * H;
    return { x, y, cx: Math.floor(x / TILE), cy: Math.floor(y / TILE) };
  }

  // ---------- 色ヘルパー ----------
  const rgbCache = {};
  function hexRgb(h) {
    if (rgbCache[h]) return rgbCache[h];
    const n = parseInt(h.slice(1), 16);
    return (rgbCache[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
  }
  function shade(h, amt) {
    const [r, g, b] = hexRgb(h);
    const f = (c) => Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function rgba(h, a) {
    const [r, g, b] = hexRgb(h);
    return `rgba(${r},${g},${b},${a})`;
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  const RAINBOW = ['#ff7a7a', '#ffb347', '#ffd447', '#6fe3a5', '#7fd6ff', '#a78bfa', '#f687b3'];
  function rainbow(offset = 0) {
    return RAINBOW[Math.floor(G.time * 10 + offset) % RAINBOW.length];
  }
  function unitColor(v) {
    const u = unitIndex(v);
    if (u >= 5) return rainbow(v % 7);
    return UNIT_COLORS[u];
  }

  // ---------- 光のスプライト（色ごとにキャッシュ） ----------
  const glowCache = new Map();
  function glow(color) {
    let c = glowCache.get(color);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, rgba(color, 0.9));
    grad.addColorStop(0.35, rgba(color, 0.35));
    grad.addColorStop(1, rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    glowCache.set(color, c);
    return c;
  }
  function drawGlow(color, x, y, radius, alpha = 1) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.drawImage(glow(color), x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = 1;
  }

  const fever = () => G.run && G.run.fever && (G.state === 'run' || G.state === 'result');

  // ---------- 床とベルトの土台（変化しないのでキャッシュ） ----------
  let floorCanvas = null;
  let floorKey = '';
  function buildFloor(R, fv) {
    const k = cv.width / W;
    if (!floorCanvas) floorCanvas = document.createElement('canvas');
    floorCanvas.width = cv.width;
    floorCanvas.height = cv.height;
    const c = floorCanvas.getContext('2d');
    c.setTransform(k, 0, 0, k, 0, 0);
    c.fillStyle = '#101218';
    c.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (R && R.belt.has(idx(x, y))) continue;
        c.fillStyle = (x + y) % 2 ? '#181b24' : '#1a1e28';
        rr(c, x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4, 7);
        c.fill();
        // 準備中は「2本のベルトに挟まれた当たりマス」をうっすら示す
        if (R && G.state === 'build') {
          const h = beltHits(x, y);
          if (h >= 2) {
            c.fillStyle = h >= 3 ? 'rgba(255,212,71,0.08)' : 'rgba(127,214,255,0.06)';
            c.fill();
          }
        }
        if (fv) {
          c.fillStyle = 'rgba(255,190,60,0.05)';
          c.fill();
        }
      }
    }
    drawBeltBase(c, R ? R.path : titlePath, fv);
  }
  function drawFloor(R) {
    const fv = fever();
    const key = `${R ? R.layout.name + R.path.length : 'title'}|${G.state === 'build'}|${fv}|${cv.width}`;
    if (key !== floorKey) {
      buildFloor(R, fv);
      floorKey = key;
    }
    ctx.drawImage(floorCanvas, 0, 0, W, H);
  }

  // ---------- ベルト ----------
  function beltPoints(path) {
    const pts = path.map(([x, y]) => [(x + 0.5) * TILE, (y + 0.5) * TILE]);
    if (pts.length > 1) {
      const [a, b] = [pts[0], pts[1]];
      pts.unshift([a[0] - (b[0] - a[0]) * 0.5, a[1] - (b[1] - a[1]) * 0.5]);
      const n = pts.length;
      const [c, d] = [pts[n - 2], pts[n - 1]];
      pts.push([d[0] + (d[0] - c[0]) * 0.5, d[1] + (d[1] - c[1]) * 0.5]);
    }
    return pts;
  }
  function strokePath(pts, c = ctx) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
  }
  // ベルトの土台（キャッシュ側に描く）
  function drawBeltBase(c, path, fv) {
    const pts = beltPoints(path);
    c.save();
    c.lineJoin = 'round';
    c.lineCap = 'butt';
    if (fv) {
      c.strokeStyle = 'rgba(255,179,71,0.3)';
      c.lineWidth = 72;
      strokePath(pts, c);
    }
    c.strokeStyle = fv ? '#3a2a10' : '#07080c';
    c.lineWidth = 56;
    strokePath(pts, c);
    c.strokeStyle = '#2b3040';
    c.lineWidth = 46;
    strokePath(pts, c);
    c.strokeStyle = fv ? '#4a4030' : '#353b4e';
    c.lineWidth = 38;
    strokePath(pts, c);
    c.restore();
  }
  // 毎フレーム描くのは流れるストライプと出入口だけ
  function drawBelt(path, speedTiles) {
    const pts = beltPoints(path);
    const fv = fever();
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'butt';
    // 流れるストライプ
    ctx.setLineDash([7, 17]);
    ctx.lineDashOffset = -(G.time * speedTiles * TILE) % 24;
    ctx.strokeStyle = fv ? 'rgba(255,200,80,0.28)' : 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 34;
    strokePath(pts);
    ctx.setLineDash([]);
    ctx.restore();
    drawBeltArrows(path);

    // 投入口・出荷口
    const s = path[0];
    const e = path[path.length - 1];
    drawGate((s[0] + 0.5) * TILE, (s[1] + 0.5) * TILE, '投入', '#5a6378', 0, false);
    drawGate((e[0] + 0.5) * TILE, (e[1] + 0.5) * TILE, '出荷', '#ffb347', G.shipPulse, fv);
  }
  // ベルトの進む向きの矢印（3マスごと。ベルト型の機械が置いてあるマスと、出入口のそばは飛ばす）
  function drawBeltArrows(path) {
    const occupied = G.run && !G.run.demo ? (x, y) => !!machineAt(x, y) : () => false;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    for (let k = 2; k < path.length - 2; k += 3) {
      const [x, y] = path[k];
      if (occupied(x, y)) continue;
      const [nx, ny] = path[k + 1];
      const a = Math.atan2(ny - y, nx - x);
      ctx.save();
      ctx.translate((x + 0.5) * TILE, (y + 0.5) * TILE);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, -8);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-6, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  function drawGate(x, y, label, color, pulse, fv) {
    const c = fv ? rainbow() : color;
    const glowA = Math.max(pulse, fv ? 0.5 : 0);
    if (glowA > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(fv ? c : '#ffd447', x, y, 60 + pulse * 30, glowA);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x, y);
    const sc = 1 + pulse * 0.14;
    ctx.scale(sc, sc);
    ctx.lineWidth = 3;
    ctx.strokeStyle = c;
    ctx.fillStyle = fv ? 'rgba(255,212,71,0.22)' : rgba(color, 0.12 + pulse * 0.3);
    rr(ctx, -28, -28, 56, 56, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = c;
    ctx.font = `900 12px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, -18);
    ctx.restore();
  }

  // ---------- 今日の特設マス ----------
  function drawSpecial(R) {
    if (!R.special || !R.special.size) return;
    const pulse = (Math.sin(G.time * 4) + 1) / 2;
    for (const [i, kind] of R.special) {
      const x = i % COLS;
      const y = Math.floor(i / COLS);
      const px = x * TILE;
      const py = y * TILE;
      if (kind === 'boost') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow('#ffd447', px + TILE / 2, py + TILE / 2, 40, 0.25 + pulse * 0.2);

  // ---------- ハイライト ----------

  function markEchoArea(x, y, color) {
