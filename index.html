        ctx.fillText(label, cx - hb.w - 2 + tw / 2, cy - hb.h + 2);
      }
      // （前は右下に効果バッジ（+2・×2…）を常に出していたが、盤面が縮むと文字が潰れて読めないのでやめた。今の倍率は詳細の欄に出す）
      const charge = chargeOf(m);
      if (charge && G.state === 'run' && !m.disabled && !broken) {
        const k = (m.counter % charge) / charge;
        const ready = m.counter % charge === charge - 1;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        rr(ctx, cx - 14, cy - hb.h + 1, 28, 5, 2.5);
        ctx.fill();
        ctx.fillStyle = ready && Math.sin(G.time * 20) > 0 ? '#ffffff' : shade(d.color, 0.35);
        rr(ctx, cx - 14, cy - hb.h + 1, Math.max(5, 28 * (ready ? 1 : k)), 5, 2.5);
        ctx.fill();
      }
      const unpaid = m.disabled || (G.state === 'build' && upkeepShort(m)); // 維持費が払えない
      if (unpaid || broken) {
        ctx.fillStyle = 'rgba(5,6,10,0.7)';
        rr(ctx, cx - hb.w - 1, cy - hb.h - 1, hb.w * 2 + 2, hb.h * 2 + 2, 11);
        ctx.fill();
        ctx.fillStyle = '#ff6b6b';
        ctx.font = `900 20px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(broken ? '故障' : '未払', cx, cy);
      }
    }
  }

  // ---------- ビーム・波紋 ----------
  function beamPath(b) {
    ctx.beginPath();
    if (b.pts) {
      ctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i][0], b.pts[i][1]);
    } else {
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
    }
  }
  function drawBeams() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const b of G.beams) {
      const k = b.life / b.max;
      const a = Math.max(0, 1 - k);
      beamPath(b);
      // 外側のにじみ → 芯
      ctx.globalAlpha = a * 0.3;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.w * 3.5;
      ctx.stroke();
      ctx.globalAlpha = a;
      ctx.lineWidth = b.w * (1 - k * 0.6);
      ctx.stroke();
      if (b.pts) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function drawRings() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of G.rings) {
      const k = r.life / r.max;
      const e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 3 * (1 - k) + 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 6 + r.r1 * e, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- アイテム ----------
  function drawItems() {
    // 軌跡と光（加算合成）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const it of G.items) {
      if (!it.alive) continue;
      const p = itemPos(it);
      if (!it.trail) it.trail = [];
      it.trail.push(p.x, p.y);
      if (it.trail.length > 20) it.trail.splice(0, 2);
      // 熱をためたアイテムは赤く光る（急冷槽で一気に掛け算）
      if (it.heat > 0) drawGlow('#ff5a2a', p.x, p.y, 16 + Math.min(20, it.heat * 3), Math.min(0.75, 0.2 + it.heat * 0.08));
      const u = unitIndex(it.value);
      if (u < 1 && it.tier < 3) continue;
      const col = it.tier >= 3 && u < 2 ? tierOf(it.tier).color : unitColor(it.value);
      const n = it.trail.length;
      for (let i = 0; i < n - 2; i += 4) {
        const a = i / n;
        drawGlow(col, it.trail[i], it.trail[i + 1], 6 + a * (8 + u * 2), a * 0.5);
      }
      const mag = Math.log10(it.value + 1);
      drawGlow(col, p.x, p.y, 20 + Math.min(30, mag * 2.5), 0.55 + it.pop * 0.3);
    }
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const it of G.items) {
      if (!it.alive) continue;
      const p = itemPos(it);
      const x = p.x + (it.seed - 0.5) * 8;
      const y = p.y + ((it.seed * 7) % 1 - 0.5) * 8;
      const t = tierOf(it.tier);
      const mag = Math.log10(it.value + 1);
      const r = (8 + Math.min(12, mag * 2.2)) * (1 + it.pop * 0.3);
      ctx.fillStyle = t.color;
      ctx.beginPath();
      if (it.tier === 0) {
        // 石はゴツゴツした多角形
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2 + it.seed * 6;
          const rr2 = r * (0.85 + ((it.seed * (i + 3) * 13) % 1) * 0.25);
          if (i === 0) ctx.moveTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
          else ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
        }
        ctx.closePath();
      } else {
        ctx.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = t.edge;
      ctx.stroke();
      // 触媒をまとったアイテム（次の「×」がもう1回かかる）
      if (it.cata > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(166,240,106,0.9)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.lineDashOffset = -G.time * 30;
        ctx.beginPath();
        ctx.arc(x, y, r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      // 金（とその上）はキラッと光る
      if (it.tier >= 3) {
        const tw = (Math.sin(G.time * 9 + it.seed * 20) + 1) / 2;
        if (tw > 0.75) {
          ctx.strokeStyle = `rgba(255,255,255,${(tw - 0.75) * 4})`;
          ctx.lineWidth = 1.5;
          const sx = x + r * 0.4;
          const sy = y - r * 0.5;
          ctx.beginPath();
          ctx.moveTo(sx - 5, sy);
          ctx.lineTo(sx + 5, sy);
          ctx.moveTo(sx, sy - 5);
          ctx.lineTo(sx, sy + 5);
          ctx.stroke();
        }
      }
      // 価値ラベル（単位で色が変わる）
      const fs = 11 + Math.min(6, mag * 0.9);
      ctx.font = `900 ${fs}px ${FONT}`;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(8,9,13,0.9)';
      const s = fmt(it.value);
      ctx.strokeText(s, x, y - r - 8);
      ctx.fillStyle = unitColor(it.value);
      ctx.fillText(s, x, y - r - 8);
      // ためた熱・浴びた雷の回数
      if (it.heat > 0 || it.zap > 0) {
        ctx.font = `900 9px ${FONT}`;
        ctx.lineWidth = 2.5;
        const parts = [];
        if (it.heat > 0) parts.push(['熱' + it.heat, '#ff9a5c']);
        if (it.zap > 0) parts.push(['雷' + it.zap, '#fff27a']);
        const ws = parts.map(([t]) => ctx.measureText(t).width);
        let bx = x - (ws.reduce((a, b) => a + b, 0) + (parts.length - 1) * 3) / 2;
        ctx.textAlign = 'left';
        parts.forEach(([t, col], i) => {
          ctx.strokeText(t, bx, y + r + 7);
          ctx.fillStyle = col;
          ctx.fillText(t, bx, y + r + 7);
          bx += ws[i] + 3;
        });
        ctx.textAlign = 'center';
      }
    }
  }

  function drawParticles() {
    for (const p of G.particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.conf) {
        // 紙吹雪は回転を幅の伸び縮みで表現（save/restoreを避けて軽く）
        const w = Math.abs(Math.cos(p.rot)) * p.r * 2 + 1;
        ctx.fillRect(p.x - w / 2, p.y - p.r * 0.5, w, p.r);
      } else {
        ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 青天井の札はほかの数字の上に描く
    for (const t of G.texts) if (!t.sky) drawText(t);
    for (const t of G.texts) if (t.sky) drawSkyText(t);
    ctx.globalAlpha = 1;
  }
  // 青天井の機械の倍率：ふつうの倍率の文字より少し大きく、茶色の太い縁取りに金色の文字
  function drawSkyText(t) {
    const k = t.life / t.max;
    const a = Math.max(0, 1 - k * k);
    const pop = t.life < 0.12 ? 1.4 - (t.life / 0.12) * 0.4 : 1;
    ctx.globalAlpha = a;
    ctx.font = `900 ${Math.round(t.size * pop)}px ${FONT}`;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(90,50,0,0.95)';
    ctx.strokeText(t.s, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.s, t.x, t.y);
  }
  function drawText(t) {
    {
      const k = t.life / t.max;
      const a = Math.max(0, 1 - k * k);
      const pop = t.life < 0.12 ? 1.4 - (t.life / 0.12) * 0.4 : 1;
      if (t.bold && t.size >= 17) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(t.color, t.x, t.y, t.size * 2.2, a * 0.45);
        ctx.restore();
      }
      ctx.globalAlpha = a;
      ctx.font = `${t.bold ? 900 : 700} ${Math.round(t.size * pop)}px ${FONT}`;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(8,9,13,0.85)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.s, t.x, t.y);
    }
  }

  // 画面全体のフラッシュとフィーバーの縁取り
  let vignette = null;
  function drawOverlays() {
    if (fever()) {
      if (!vignette) {
        // 低解像度で一度だけ作って引き伸ばす
        vignette = document.createElement('canvas');
        vignette.width = W / 4;
        vignette.height = H / 4;
        const c = vignette.getContext('2d');
        const g = c.createRadialGradient(W / 8, H / 8, H * 0.09, W / 8, H / 8, W * 0.175);
        g.addColorStop(0, 'rgba(255,180,60,0)');
        g.addColorStop(1, 'rgba(255,170,40,1)');
        c.fillStyle = g;
        c.fillRect(0, 0, W / 4, H / 4);
      }
      ctx.globalAlpha = 0.18 + Math.sin(G.time * 6) * 0.08;
      ctx.drawImage(vignette, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (G.flash > 0) {
      ctx.globalAlpha = G.flash * 0.55;
      ctx.fillStyle = G.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // フレームが重い状態が続いたら解像度を1段下げる
  function adaptQuality() {
    const now = performance.now();
    const dt = lastDraw ? now - lastDraw : 16;
    lastDraw = now;
    if (dt > 250) return; // タブ切り替え直後などは無視
    slowTime = dt > 28 ? slowTime + dt : Math.max(0, slowTime - dt * 0.5);
    if (slowTime > 1500 && quality < QUALITY.length - 1) {
      quality++;
      slowTime = 0;
      resize();
    }
  }

  function draw() {
    adaptQuality();
    const k = cv.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    const R = G.run;
    ctx.save();
    if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    if (G.zoom > 0) {
      const z = 1 + G.zoom * 0.035;
      ctx.translate(W / 2, H / 2);
      ctx.scale(z, z);
      ctx.translate(-W / 2, -H / 2);
    }
    drawFloor(R);
    if (R) {
      drawBelt(R.path, G.state === 'run' ? R.curSpeed * G.speedMul : 0.25);
      drawSpecial(R);
      drawHighlights(R);
      drawBeams();
      drawMachines(R);
      if (chainFor && G.state === 'build') drawChain(chainFor);
      drawRings();
      drawItems();
    } else {
      drawBelt(titlePath, 0.6);
    }
    drawParticles();
    drawTexts();
    ctx.restore();
    drawOverlays();
  }

  return { init, resize, draw, toBoard, W, H };
})();

</script>
<script>
// ===== UI（HUD・サイドパネル・オーバーレイ・入力・メインループ） =====
const UI = (() => {
  const $ = (id) => document.getElementById(id);
  const KIND_LABEL = { add: '加算', mult: '乗算', transform: '変換', special: '特殊', passive: '常時' };
  let side, overlay, card, bannerEl, canvas;
  const hudCache = {};
  let infoKey = '';

  // ---------- 共通 ----------
  function setText(id, v) {
    if (hudCache[id] === v) return;
    hudCache[id] = v;
    const el = $(id);
    if (el) el.textContent = v;
  }
  // style: true / 'bad' = 赤、'unit' = 虹色の大きな文字
  function banner(text, style) {
    bannerEl.textContent = text;
    bannerEl.className = '';
    void bannerEl.offsetWidth;
    const cls = style === true || style === 'bad' ? ' bad' : style === 'unit' ? ' unit' : '';
    bannerEl.className = 'show' + cls;
  }
  // 数字がカウントアップしていく演出
  function countUp(el, target, dur) {
    const t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / (dur * 1000));
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(target * e);
      if (k < 1) {
        Sfx.tick();
        requestAnimationFrame(step);
      } else {
        el.classList.add('done');
      }
    }
    requestAnimationFrame(step);
  }
  // mode：'wide'（広いカード）| 'title'（タイトル：後ろのデモが見えるように暗くしすぎない、小さなカード）| 'sheet'（スマホの「今日の情報」）
  function showOverlay(html, mode) {
    card.classList.toggle('wide', mode === 'wide');
    card.classList.toggle('result', mode === 'result');
    overlay.classList.toggle('capsule-mode', mode === 'capsule');
    overlay.classList.toggle('title-mode', mode === 'title');
    overlay.classList.toggle('sheet-mode', mode === 'sheet');
    card.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() {
    overlay.classList.add('hidden');
  }
  function glyphHTML(type, extra = '', attrs = '', star = 0) {
    const d = MACHINES[type];
    const cls = d.belt ? ' beltg' : '';
    const st = star ? `<span class="star">★${star > 1 ? star : ''}</span>` : '';
    return `<div class="glyph${cls} ${extra}" style="background:radial-gradient(circle at 50% 40%, ${d.color}66, #12141b 78%);border-color:${d.color}88" ${attrs}><img class="spr" src="${Sprites.url(type)}" alt="${d.glyph}" draggable="false">${st}</div>`;
  }
  const BELT_TAG = '<span class="belt-tag">ベルト型</span>';

  // ---------- HUD ----------
  function updateHUD() {
    const R = G.run;
    // 納期の日で、まだノルマに届いていない：HUDを赤く脈打たせる
    const due = !!R && !R.demo && !R.hi && (G.state === 'build' || G.state === 'run') && R.day >= R.deadline && R.phaseScore < R.quota;
    if (hudCache.due !== due) {
      hudCache.due = due;
      $('hud').classList.toggle('due', due);
    }
    if (!R || R.demo) {
      setText('hud-day', '-');
      setText('hud-dayof', '');
      setText('hud-score', '0');
      setText('hud-quota', '0');
      setText('hud-coins', '-');
      setText('hud-machines', '-');
      setText('hud-items', '-');
      setText('hud-phase', '-');
      $('hud-bar').style.width = '0%';
      $('hud-bar-over').style.width = '0%';
      updateCoach();
      return;
    }
    setText('hud-day', String(R.day));
    setText('hud-dayof', R.hi ? ` / 最終日 ${R.hi.endDay}` : R.day >= R.deadline ? ' / 今日が納期' : ` / 納期 ${R.deadline}`);
    setText('hud-qlabel', R.hi ? 'ハイスコア / 自己ベスト' : `${R.endless ? 'エンドレス ' : ''}第${R.phase}期の出荷 / ノルマ`);
    setText('hud-score', fmt(G.dispScore));
    setText('hud-quota', isFinite(R.quota) ? fmt(R.quota) : '—');
    setText('hud-coins', String(R.coins));
    setText('hud-machines', `${slotsUsed()}/${dayCap()}`);
    setText('hud-items', G.state === 'run' ? `${R.itemsToday - R.spawned}` : `${R.itemsToday}`);
    const on = R.boss ? `ボス：${R.boss.name}` : R.hi ? `ハイスコア あと${Math.max(0, R.hi.endDay - R.day + (G.state === 'result' ? 0 : 1))}日` : R.endless ? `∞ 第${R.phase}期` : `第${R.phase}期 / ${PHASES}`;
    if (hudCache['hud-phase'] !== on) $('hud-phase').classList.toggle('boss', !!R.boss);
    setText('hud-phase', on);
    const ratio = G.dispScore / R.quota;
    $('hud-bar').style.width = Math.min(100, ratio * 100) + '%';
    $('hud-bar-over').style.width = ratio > 1 ? Math.min(100, (Math.log2(ratio) / 5) * 100) + '%' : '0%';
    $('hud-bar').parentElement.classList.toggle('done', ratio >= 1);
    const fv = !!(R.fever && (G.state === 'run' || G.state === 'result'));
    if (hudCache.fever !== fv) {
      hudCache.fever = fv;
      $('hud').classList.toggle('fever', fv);
    }
    // 出荷額の単位が上がったらHUDの数字を弾ませる
    const su = unitIndex(G.dispScore);
    if (hudCache.scoreUnit !== su) {
      const el = $('hud-score');
      if (su > (hudCache.scoreUnit || 0)) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      }
      hudCache.scoreUnit = su;
      el.style.color = su >= 5 ? '#f687b3' : su > 0 ? UNIT_COLORS[su] : '';
    }
    updateCoach();
    if (G.state === 'run') {
      setText('rs-today', fmt(R.dayScore));
      setText('rs-combo', `${R.combo} (最大 ${R.dayStats.maxCombo})`);
      setText('rs-spawn', `${R.spawned} / ${R.itemsToday}`);
      setText('rs-best', fmt(R.dayStats.best));
      setText('rs-dup', String(R.dayStats.dup));
      setText('rs-split', String(R.dayStats.split));
      setText('rs-destroy', String(R.dayStats.destroyed));
      setText('rs-coins', (R.dayStats.coins >= 0 ? '+' : '') + R.dayStats.coins);
    }
  }

  // ---------- サイドパネル ----------
  function renderSide() {
    infoKey = '';
    const R = G.run;
    // タイトル画面（後ろでデモが動いている）では、右の欄とドックを隠して盤面だけにする
    const title = !R || !!R.demo || G.state === 'title';
    if (document.body.classList.contains('is-title') !== title) {
      document.body.classList.toggle('is-title', title);
      layout();
    }
    if (title) {
      side.innerHTML = '';
      dock.innerHTML = '';
      if (foot) foot.innerHTML = '';
      if (detailBar) detailBar.classList.add('hidden');
      return;
    }
    renderDock(R);
    renderFoot(R);
    if (G.state === 'build') renderBuild(R);
    else renderRun(R);
    renderInfo(true);
  }

  function bossHTML(R) {
    return R.boss
      ? `<div class="boss"><div class="t"><i class="ic ic-warn"></i> ボス日：${R.boss.name}</div><div class="d">${R.boss.desc}</div></div>`
      : '';
  }
  // ---------- チュートリアル（はじめてのランだけ。盤面の上に「次にやること」を1つずつ出す） ----------
  // いまの状態から「次にやること」を決める（順番を覚えておく必要がないので、どんな操作をしても食い違わない）
  //   key: 表示の切り替え用 / n: 何番目か / target: 光らせる右の欄の部品 / cells: 光らせる盤面のマス / ok: 「OK」で閉じる説明
  function coachStep() {
    const R = G.run;
    if (!R || !R.tut || !overlay.classList.contains('hidden')) return null;
    if (G.state === 'run') {
      return R.day === 1
        ? { key: 'run', html: '原料が <b>投入口</b> から流れてきます。機械の横を通るたびに価値が増え、<b>出荷口</b> に着くと出荷額になります。' }
        : null;
    }
    if (G.state !== 'build') return null;
    if (R.day === 1) {
      const bought = R.shop.some((s) => s.sold);
      const afford = R.shop.some((s) => !s.sold && R.coins >= shopPrice(s)) && ownedCount() < ownedCap();
      if (R.sel != null) {
        return { key: 'place', n: 2, cells: 'pinch', html: '盤面の <b>ベルトの横のマス</b> をタップして置きます。<b style="color:#ffd447">金色に光るマス</b> は2本のベルトに挟まれていて、アイテム1個に <b>2回</b> 効きます。' };
      }
      if (R.tray.length) {
        return { key: placedCount() ? 'pick2' : 'pick', n: 1, target: '.tray', html: placedCount() ? '残りの機械も置きましょう。<b>手持ち</b> の機械をタップして選びます。' : 'まず機械を置きます。右の <b>手持ち</b> にある機械をタップして選びます（盤面へドラッグしても置けます）。' };
      }
      if (!bought && afford) {
        return { key: 'buy', n: 3, target: '.cards', html: '下の <b>ショップ</b> で機械を1台買ってみましょう。カードの <b>「購入」</b> を押すと買えて、そのまま置く場所を選べます。「+」は足し算、「×」は掛け算。' };
      }
      return { key: 'start', n: 4, target: '[data-ui="start"]', html: `準備ができました。<b>稼働開始</b> を押します。<br>ノルマは <b>期ごとの合計</b> です。第1期は、納期（${PHASE_DAYS}日目）までの合計で届けば大丈夫。` };
    }
    const seen = R.tut.seen;
    if (R.day === 2 && !seen.d2) {
      return { key: 'd2', ok: 'd2', html: '今日から <b style="color:#ffd447">★強化マス</b>（置いた機械が2回発動）と <b style="color:#ff6b6b">✕故障マス</b>（置いた機械が止まる）が出ます。場所は毎日変わります。<br>盤面の機械は、クリックして選んでから別のマスをクリックすると動かせます。' };
    }
    if (R.day >= 3 && !seen.d3) {
      return { key: 'd3', ok: 'd3', html: '今日からショップに <b>いろいろな機械</b> が並びます。説明文の「何に反応するか」を読んで、組み合わせを探してみましょう。<br>枠がいっぱいなら <b>設置枠を増やす</b> か、弱い機械を売って入れ替えます。チュートリアルはここまでです。' };
    }
    return null;
  }
  let coachKey = '';
  function updateCoach() {
    const el = $('coach');
    if (!el) return;
    const st = coachStep();
    G.coachCells = st && st.cells ? st.cells : null;
    // 光らせる相手（右の欄・ドックは描き直されるので、毎回つけ直す）。PCとスマホで見えている方だけ
    for (const q of ['.tray', '.cards', '[data-ui="start"]']) {
      for (const t of document.querySelectorAll(`#side ${q}, #dock ${q}, #foot ${q}`)) t.classList.toggle('coach-target', !!st && st.target === q && t.offsetParent !== null);
    }
    const key = st ? st.key : '';
    if (key === coachKey) return;
    coachKey = key;
    // 光らせた部品が右の欄の下のほうにあれば、見えるところまで送る
    const tgt = st && st.target ? [...document.querySelectorAll(`#side ${st.target}`)].find((t) => t.offsetParent !== null) : null;
    if (tgt && tgt.scrollIntoView) tgt.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    if (!st) {
      el.classList.add('hidden');
      return;
    }
    el.innerHTML = `<div class="coach-h">チュートリアル${st.n ? `<span>${st.n} / 4</span>` : ''}</div><div class="coach-t">${st.html}</div>
      <div class="coach-b">${st.ok ? `<button class="btn small" data-coach="${st.ok}">OK</button>` : ''}<button class="coach-skip" data-coach="skip">チュートリアルを終わる</button></div>`;
    el.classList.remove('hidden');
  }
  function onCoachClick(e) {
    const b = e.target.closest('[data-coach]');
    if (!b || !G.run || !G.run.tut) return;
    Sfx.click();
    const k = b.dataset.coach;
    if (k === 'skip' || k === 'd3') finishTutorial();
    else G.run.tut.seen[k] = true;
    coachKey = '?'; // 次のフレームで出し直す
  }
  // はじめて「出勤する」を押したときの説明
  function showTutorialIntro() {
    showOverlay(`
      <h2>はじめての出勤：チュートリアル</h2>
      <p>ベルトを流れる原料の価値を、機械で <b style="color:var(--accent)">足して、掛けて</b>、ノルマ以上を出荷するゲームです。</p>
      <div class="tut-pts">
        <div><b>1</b><span>ベルトの横に機械を置く</span></div>
        <div><b>2</b><span>稼働開始。原料が流れて、機械が価値を増やす</span></div>
        <div><b>3</b><span>納期（${PHASE_DAYS}日ごと）までの合計で、ノルマを超える</span></div>
      </div>
      <p class="lead" style="font-size:13px">最初の1日は、盤面の上に「次にやること」が1つずつ出ます（1分ほど）。</p>

  // レバレッジ：期の最初の日の準備中に決める。上げるほどその期のノルマが重く、納期達成の報酬と特許が増える
  function leverageHTML(R) {
    const lv = R.lev || 0;
    const coin = Math.round((levCoinMul(lv) - 1) * 100);
    const pat = Math.round((levPatentMul(lv) - 1) * 100);

    return `<div class="lev ${lv > 0 ? 'on' : ''} ${locked ? 'locked' : ''}" title="レバレッジ：上げるほどこの期のノルマが重くなり、納期達成の報酬と特許が増える（期の最初の日に決める）">
        <button class="btn sub small" data-ui="lev-down" ${locked || lv <= 0 ? 'disabled' : ''}>◀</button>
        <div class="lev-v"><b>レバレッジ Lv ${lv}</b>
          <span>ノルマ <b>×${fmt(Math.pow(LEV_QMUL, lv))}</b> ・ 納期達成の報酬 <b>+${coin}%</b> ・ 特許 <b>+${pat}%</b></span>
          ${locked ? '<span>この期は変えられません（期の最初の日に決めます）</span>' : ''}</div>
        <button class="btn sub small" data-ui="lev-up" ${locked || lv >= LEV_MAX ? 'disabled' : ''}>▶</button>
      </div>`;
  }
  // 今の期のノルマと、納期までの残り
  function phaseDockHTML(R) {
    const left = R.deadline - R.day + 1; // 今日を入れた残り日数
    if (R.hi) {
      return `<div class="dock-est"><span>ハイスコアモード</span><b>${fmt(R.phaseScore)}</b></div>
        <div class="dock-sub"><span>自己ベスト ${R.hi.best > 0 ? fmt(R.hi.best) : '—'}</span>
          <span class="${left <= 1 ? 'last' : ''}">${left <= 1 ? '今日が最終日' : `あと${left}日`}</span></div>`;
    }
    const need = Math.max(0, R.quota - R.phaseScore);
    const loan = R.loanUsed ? `<div class="dock-sub"><span style="color:#ffb3b3">前借り ${R.loanUsed}回ぶん、ノルマ +${Math.round((Math.pow(LOAN_QMUL, R.loanUsed) - 1) * 100)}%</span></div>` : '';
    const loanNext = R.loan ? `<div class="dock-sub"><span style="color:#ffb3b3">前借り ${R.loan}回：次の期のノルマ +${Math.round((Math.pow(LOAN_QMUL, R.loan) - 1) * 100)}%</span></div>` : '';
    return `${loan}${loanNext}<div class="dock-est"><span>第${R.phase}期のノルマ</span><b>${fmt(R.quota)}</b></div>
      <div class="dock-sub"><span>${R.phaseScore > 0 ? `これまで ${fmt(R.phaseScore)} ・ あと <b>${fmt(need)}</b>` : '納期までの合計で数えます'}</span>
        <span class="${left <= 1 ? 'last' : ''}">${left <= 1 ? '今日が納期' : `納期まで あと${left}日`}</span></div>`;
  }

  // ---------- 準備画面 ----------
  // PC：右の欄＝手持ち・機械の詳細・今日の情報・稼働開始 ／ 下の段いっぱい＝ショップ
  // スマホ縦：盤面の下に ショップ（左）と手持ち（右の細い列）、いちばん下に稼働開始。機械の詳細は盤面の上に重ねる詳細バー
  // style.css の同じ条件で切り替える
  // 縦長の画面だけ。横向きのスマホは「左に盤面、右に手持ちとショップ」の配置（layout() の short）にする
  const MOBILE_MQ = '(orientation: portrait) and (max-width: 1100px)';
  const isMobile = () => window.matchMedia(MOBILE_MQ).matches;
  let dock, detailBar, foot;
  let lastShopStamp = -1; // ショップの入荷が変わったら、カードを左から順に配る
  let shopSel = null; // タップ（クリック）して説明を見ているショップの品（番号）
  // スマホ縦：ショップを閉じて手持ちを広く見せる（端末に覚えておく）
  let shopClosed = false;
  try { shopClosed = localStorage.getItem('ca_shopClosed') === '1'; } catch (e) { shopClosed = false; }
  function setShopClosed(v) {
    shopClosed = v;
    document.body.classList.toggle('shop-closed', v);
    try { localStorage.setItem('ca_shopClosed', v ? '1' : '0'); } catch (e) { /* 保存できなくても動く */ }
  }

  // 盤面・右の欄・ショップの大きさを画面から決める。盤面は 13:9 のまま、余った幅は右の欄、余った高さはショップに回す（空白を出さない）
  function layout() {
    const main = $('main');
    if (!main) return;
    const root = document.documentElement.style;
    const body = document.body;
    if (body.classList.contains('is-title') || isMobile()) {
      root.removeProperty('--board-w');
      root.removeProperty('--board-h');
      body.classList.remove('short');
      side.classList.remove('side-wide');
      Render.resize();
      return;
    }
    const r = main.getBoundingClientRect();
    const PAD = 8;
    const GAP = 8;
    const w = r.width - PAD * 2;
    const h = r.height - PAD * 2;
    // 高さがとても低い画面（横向きのスマホなど）：盤面を左いっぱいにして、右に手持ちとショップを重ねる
    const short = h < 470;
    body.classList.toggle('short', short);
    let bh;
    if (short) bh = Math.min(h, ((w - 320 - GAP) * ROWS) / COLS);
    else {
      const shopH = Math.min(276, Math.max(228, h * 0.3));
      bh = Math.min(h - shopH - GAP, ((w - Math.max(310, w * 0.22) - GAP) * ROWS) / COLS);
    }
    bh = Math.max(140, Math.floor(bh));
    const bw = Math.floor((bh * COLS) / ROWS);
    root.setProperty('--board-w', bw + 'px');
    root.setProperty('--board-h', bh + 'px');
    // ショップの段が低いときは、カードの説明文を出さない（半分だけ見える行が出ないように。説明は右の欄に出る）
    body.classList.toggle('shop-lean', !short && h - bh - GAP < 256);
    // 右の欄が広いときは、手持ち（左）と機械の詳細（右）を横に並べる
    side.classList.toggle('side-wide', !short && w - bw - GAP >= 560);
    Render.resize();
  }

  // ドット絵のコイン（値段の欄に使う）
  const PX_COIN = '<svg class="px-coin" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#6b3d00" d="M2 0h4v1h1v1h1v4h-1v1h-1v1h-4v-1h-1v-1h-1v-4h1v-1h1z"/><path fill="#ffd447" d="M2 1h4v1h1v4h-1v1h-4v-1h-1v-4h1z"/><path fill="#fff3a0" d="M2 2h1v2h-1zM3 1h2v1h-2z"/><path fill="#d08a00" d="M5 5h1v1h-1zM4 3h1v2h-1z"/></svg>';
  function pxPrice(n, old) {
    return `<span class="px-price">${PX_COIN}${old != null ? `<s>${old}</s>` : ''}<b>${n}</b></span>`;
  }

  function dayInfoHTML(R) {
    return `<div class="day-info">
        <div class="layout-name">${R.daily ? `<b class="daily-tag">日替わり ${R.daily.label}</b>` : ''}${R.endless ? '<b class="endless-tag">∞ エンドレス</b>' : ''}${R.layout.name}（ノルマ×${R.layout.qmul}） ・ 原料 ${R.itemsToday}個/日</div>
        ${bossHTML(R)}
        ${specialHTML(R)}
      </div>`;
  }
  // 稼働開始の前の注意（置ききれていない・枠を超えている）
  function warnHTML(R) {
    const free = dayCap() - slotsUsed();
    if (free < 0) return `<div class="warn bad">設置枠は今日 ${dayCap()} まで（${-free}枠オーバー）</div>`;
    if (R.tray.length && free > 0) return `<div class="warn">盤面の空き <b>${free}枠</b>（手持ちは稼働しない）</div>`;
    if (R.tray.length) return '<div class="warn">手持ちの機械は稼働しません</div>';
    return '';
  }
  function slotBtnHTML(R) {
    const c = runSlotCost();
    const cap = dayCap() < R.boardCap ? `（今日${dayCap()}）` : '';
    return `<button class="slot-btn" data-ui="slot" ${R.coins < c ? 'disabled' : ''} title="設置枠を1つ増やす（${SLOT_GROWTH}倍ずつ高くなる）">
      <span>設置枠 <b>${slotsUsed()}/${R.boardCap}</b>${cap}</span><em>＋1枠 ${pxPrice(c)}</em></button>`;
  }
  // 手持ち（買った機械・置いていない機械）。右の欄の上（スマホは右の細い列）
  function tileHTML(m, sel) {
    const d = MACHINES[m.type];
    return `<div class="tile ${sel ? 'sel' : ''}" data-tray="${m.uid}" title="${d.name}">${glyphHTML(m.type, '', '', m.star)}<span>${d.name}</span></div>`;
  }
  function handHTML(R, build) {
    const tiles = R.tray.map((m) => tileHTML(m, R.sel === m.uid)).join('');
    const room = ownedCap() - ownedCount();
    return `<div class="hand" id="hand-zone">
        <div class="side-h"><b>手持ち</b><span class="hand-n ${room <= 0 ? 'full' : ''}" title="持っている機械（盤面＋手持ち） / 持てる台数（設置枠 +${R.bench}台）">所持 ${ownedCount()}/${ownedCap()}台</span>${R.kits ? `<span class="kit-chip" title="改造キット（「+」「×」の機械を選んで使う）"><i class="ic ic-wrench"></i>×${R.kits}</span>` : ''}</div>
        <div class="tray">${tiles || `<span class="empty">${build ? 'ショップで買った機械がここに入ります' : 'なし'}</span>`}</div>
        ${build ? `<div class="hand-foot">${slotBtnHTML(R)}<span class="stash-hint">盤面の機械をここへドラッグ → 手持ちに戻す</span></div>` : ''}
      </div>`;
  }
  function speedHTML() {
    return `<div class="speed-row"><span>速度</span>${[1, 2, 4].map((s) => `<button class="btn sub ${G.speedMul === s ? 'on' : ''}" data-ui="speed" data-speed="${s}">×${s}</button>`).join('')}<button class="btn sub skip-btn" data-ui="skip" title="その日の残りを一瞬で終えて結果へ（Enter）">スキップ ▶▶</button></div>`;
  }
  // 稼働中の残りを一瞬で終える（音と演出は飛ばす。結果は同じ）
  function skipDay() {
    if (G.state !== 'run') return;
    Sfx.quiet = true;
    const saved = G.speedMul;
    G.speedMul = 4;
    let n = 0;
    while (G.state === 'run' && n < 100000) {
      update(1 / 30);
      n++;
    }
    G.speedMul = saved;
    Sfx.quiet = false;
    G.texts.length = 0;
    G.particles.length = 0;
    G.dirty = true;
  }
  function renderBuild(R) {
    side.innerHTML = `
      <div class="side-a">${handHTML(R, true)}${dayInfoHTML(R)}${levOpen() && !R.hi ? leverageHTML(R) : ''}</div>
      <div class="side-b"><div class="info detail" id="detail"></div></div>`;
  }
  // ショップの段の右端（PC）：ノルマと納期、稼働開始ボタン。稼働中は速度
  function dockStartHTML(R) {
    if (G.state !== 'build') return `<div class="dock-start run"><div class="ds-run">DAY ${R.day} 稼働中</div>${speedHTML()}<div class="tip"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> キーでも変えられます</div></div>`;
    return `<div class="dock-start">
        ${warnHTML(R)}
        ${phaseDockHTML(R)}
        <button class="btn start-btn" data-ui="start">▶ 稼働開始 <span class="kbd-hint">[Space]</span></button>
      </div>`;
  }
  function renderRun(R) {
    side.innerHTML = `
      <div class="side-a">${handHTML(R, false)}
        <div class="day-info"><div class="layout-name">${R.daily ? `<b class="daily-tag">日替わり ${R.daily.label}</b>` : ''}${R.hi ? `ハイスコアモード ・ DAY ${R.day} 稼働中（最終日 DAY ${R.hi.endDay}）` : `${R.endless ? '∞ エンドレス ' : ''}第${R.phase}期 ・ DAY ${R.day} 稼働中（納期 DAY ${R.deadline}）`}</div>${bossHTML(R)}</div>
        <div class="stats">
          <span>今日の出荷</span><span class="v" id="rs-today">0</span>
          <span>投入</span><span class="v" id="rs-spawn">0</span>
          <span>最高価値</span><span class="v" id="rs-best">0</span>
          <span>連続出荷</span><span class="v" id="rs-combo">0</span>
          <span>複製・分裂</span><span class="v"><span id="rs-dup">0</span>・<span id="rs-split">0</span></span>
          <span>消滅</span><span class="v" id="rs-destroy">0</span>
          <span>機械からのコイン</span><span class="v" id="rs-coins">+0</span>
        </div>
      </div>
      <div class="side-b"><div class="info detail" id="detail"></div></div>`;
    for (const k of Object.keys(hudCache)) if (k.startsWith('rs-')) delete hudCache[k];
  }
  // ショップの品の買える状態：'can' | 'poor'（コイン不足）| 'full'（手持ちが満杯）| 'na'（消耗品が今は使えない）| 'sold'
  function buyState(s, R) {
    if (s.sold) return 'sold';
    if (!s.item && ownedCount() >= ownedCap()) return 'full';
    if (s.item && !CONSUMABLES[s.item].ok(R)) return 'na';
    if (R.coins < shopPrice(s)) return 'poor';
    return 'can';
  }
  // 「購入」ボタン（値段はドット絵の札）。押せないときは理由を書く
  function buyBtnHTML(s, i, R, big) {
    const st = buyState(s, R);
    const price = shopPrice(s);
    const build = G.state === 'build';
    const label = st === 'sold' ? '売り切れ' : st === 'full' ? '手持ちが満杯' : st === 'poor' ? 'コイン不足' : st === 'na' ? '今は使えない' : s.item ? '使う' : '購入';
    const tag = price ? pxPrice(price, s.sale ? MACHINES[s.type].cost : null) : '<span class="px-price free"><b>無料</b></span>';
    return `<button class="buy ${st}${s.sale ? ' sale' : ''}${big ? ' big' : ''}" data-buy="${i}" ${st === 'can' && build ? '' : 'disabled'}><span class="buy-l">${label}</span>${tag}</button>`;
  }
  // ショップのカード1枚。機械と消耗品は色も形も分ける（機械：紺の板と四角い絵／消耗品：緑の券と丸い絵）
  function shopCardHTML(s, i, R, pop) {
    const lock = ''; // （取り置きの<i class="ic ic-lock"></i>はなくした）
    const st = buyState(s, R);
    const base = `${st}${s.sale ? ' sale' : ''}${pop ? ' pop' : ''}${shopSel === i ? ' picked' : ''}`;
    const sold = s.sold ? '<div class="sold-stamp">SOLD</div>' : '';
    if (s.item) {
      const c = CONSUMABLES[s.item];
      return `<div class="card item ${base}" data-shop="${i}" style="--i:${i};--ic:${c.color}">
        <div class="c-kind"><span>消耗品</span><em>買ったその場で効く</em>${lock}</div>
        <div class="c-top"><div class="glyph item-g">${c.glyph}</div><div class="c-nm"><div class="name">${c.name}</div><div class="c-tags"><span class="t-item">1回きり</span></div></div></div>
        <div class="core">${c.short}</div><div class="detail">${c.desc}</div>
        ${buyBtnHTML(s, i, R)}${sold}</div>`;
    }
    const d = MACHINES[s.type];
    const tags = [];
    if (s.star) tags.push('<span class="t-star">★改造済み</span>');
    if (!s.sold && synergyWith(s.type)) tags.push('<span class="t-syn">相性◎</span>');
    if (d.sky) tags.push('<span class="t-sky">青天井</span>');
    if (d.belt) tags.push('<span class="t-belt">ベルト型</span>');
    if (cellCount(s.type) > 1) tags.push('<span class="t-big">2マス</span>');
    if (d.upkeep) tags.push(`<span class="t-up">維持費${d.upkeep}</span>`);
    return `<div class="card mach r${d.rarity} ${base}" data-shop="${i}" style="--i:${i};--rc:${RARITY[d.rarity].color}">
      ${s.sale ? `<div class="c-kind sale"><span>特価</span><em>今日だけ半額！</em>${lock}</div><div class="sale-sticker">-50%</div>` : `<div class="c-kind"><span>機械</span><em>${RARITY[d.rarity].name}</em>${lock}</div>`}
      <div class="c-top">${glyphHTML(s.type, '', '', s.star || 0)}<div class="c-nm"><div class="name">${d.name}</div><div class="c-tags">${tags.join('')}</div></div></div>
      <div class="core">${d.short}</div><div class="detail">${d.desc}</div>
      ${buyBtnHTML(s, i, R)}${sold}</div>`;
  }
  // 画面の下の段：ショップだけ（PCは横いっぱい。スマホは盤面の下の左側）
  function renderDock(R) {
    const build = G.state === 'build';
    const pop = R.shopStamp !== lastShopStamp;
    lastShopStamp = R.shopStamp;
    if (pop) shopSel = null;
    if (shopSel != null && (!R.shop[shopSel] || R.shop[shopSel].sold)) shopSel = null;
    // 入荷したとき：カードを1枚ずつめくる音。レジェンドが来たら金色の演出、エピックなら紫の光（めくれるころに）
    if (pop && build) {
      Sfx.restock(Math.min(7, R.shop.length), 0.11);
      const at = (R.shop.findIndex((s) => s.type && MACHINES[s.type].rarity === R.shopBest) + 1) * 110 + 350;
      if (R.shopBest >= 5) {
        setTimeout(() => {
          banner('レジェンド入荷！', 'unit');
          Sfx.jackpot();
          flashScreen(0.45, '#ffd447');
        }, at);
      } else if (R.shopBest >= 4) setTimeout(() => Sfx.milestone(2), at);
    }
    const cards = R.shop.map((s, i) => shopCardHTML(s, i, R, pop && build)).join('');
    const free = R.freeRerolls > 0;
    const rdis = !build || (!free && R.coins < R.rerollCost);
    dock.className = (build ? 'building' : 'running') + (pop && build ? ' restock' : '');
    dock.innerHTML = `
      <div class="dock-h"><b>ショップ</b><button class="shop-toggle" data-ui="shoptoggle">${shopClosed ? '▲ 開く' : '▼ 閉じる'}</button>${pop && build ? '<span class="restock-tag">入荷！</span>' : ''}
        <span class="shop-hint">${build ? (isMobile() ? 'カードをタップで説明 ・「購入」で買う' : 'カードにカーソルを合わせると説明 ・「購入」で買う（盤面へドラッグしても買える）') : '稼働中は買えません'}</span>
        <span class="sell-hint">ここへ離すと売却</span>
        <button class="reroll" data-ui="reroll" title="品ぞろえを入れ替える" ${rdis ? 'disabled' : ''}><span>↻ 入れ替え</span>${free ? `<span class="px-price free"><b>無料×${R.freeRerolls}</b></span>` : pxPrice(R.rerollCost)}</button></div>
      <div class="dock-body"><div class="cards">${cards}</div>${dockStartHTML(R)}</div>`;
  }
  // スマホのいちばん下：今日の情報と稼働開始（稼働中は速度）
  function renderFoot(R) {
    if (!foot) return;
    foot.innerHTML = G.state === 'build'
      ? `<button class="btn sub info-chip" data-ui="info" title="今日の情報"><i class="ic ic-clipboard"></i> 今日${R.boss ? '<i class="dot"></i>' : ''}</button><button class="btn start-big" data-ui="start">▶ 稼働開始</button>`
      : speedHTML();
  }
  // 選んだ機械の操作ボタン（PC：右の欄の詳細の下）
  function actionsHTML(f, R) {
    const m = f.m;
    return `<div class="act-row">
        ${R.kits > 0 && canStar(m) ? `<button class="btn small" data-ui="kit">★改造（キット${R.kits}）</button>` : ''}
        ${cellCount(m.type) > 1 ? '<button class="btn sub small" data-ui="rot">⟳ 向きを変える <kbd>R</kbd></button>' : ''}
        ${f.where === 'grid' ? '<button class="btn sub small" data-ui="stash">手持ちに戻す</button>' : ''}
        <button class="btn sub small sell-btn" data-ui="sell">売却 ${pxPrice('+' + sellValue(m))}</button>
        <button class="btn sub small" data-ui="unsel" title="選択解除（右クリック・Esc）">✕</button>
      </div>
      <div class="hint">${f.where === 'tray' ? '盤面の <b>光っているマス</b> をクリックして置く（金色のマスは2回発動）' : '別のマスをクリックすると動かせます'}。ドラッグでも動かせます。</div>`;
  }
  // スマホの詳細バー（盤面の上に重ねる）：選んだ機械
  function barHTML(f, R) {
    const m = f.m;
    return `<button class="db-x" data-ui="unsel" title="選択解除">✕</button>
      <div class="db-place">${f.where === 'tray' ? '▲ 盤面の <b>光っているマス</b> をタップして置く' : '▲ 別のマスをタップすると動かせる'}</div>
      <div class="db-body">${machineInfoHTML(m)}</div>
      <div class="db-btns">
        ${R.kits > 0 && canStar(m) ? '<button class="btn small" data-ui="kit">★改造</button>' : ''}
        ${cellCount(m.type) > 1 ? '<button class="btn sub small" data-ui="rot">⟳ 回転</button>' : ''}
        ${f.where === 'grid' ? '<button class="btn sub small" data-ui="stash">手持ちへ</button>' : ''}
        <button class="btn sub small sell-btn" data-ui="sell">売却 ${pxPrice('+' + sellValue(m))}</button>
      </div>`;
  }
  // スマホの詳細バー：タップしたショップの品
  function shopBarHTML(s, i, R) {
    return `<button class="db-x" data-ui="unpick" title="閉じる">✕</button>
      <div class="db-body">${shopInfoHTML(s)}</div>
      <div class="db-btns">${buyBtnHTML(s, i, R, true)}</div>`;
  }
  // ショップの品の詳細（PC：右の欄／スマホ：詳細バー）
  function shopInfoHTML(s) {
    if (s.item) {
      const c = CONSUMABLES[s.item];
      return `<div class="hd"><div class="glyph item-g" style="--ic:${c.color}">${c.glyph}</div><div><div class="nm">${c.name}</div>
        <div class="meta"><span class="tag item">消耗品</span>買ったその場で効く（手持ちの枠は使わない）</div></div></div><div class="desc">${c.desc}</div>`;
    }
    const d = MACHINES[s.type];
    const tags = (d.belt ? BELT_TAG + ' ' : '') + `<span class="tag">${KIND_LABEL[d.kind]}</span>` + (d.sky ? '<span class="tag sky">青天井</span>' : '') + (cellCount(s.type) > 1 ? '<span class="tag warn">大型：2マス・2枠</span>' : '') + (d.upkeep ? `<span class="tag warn">維持費 ${d.upkeep}枚/日</span>` : '');
    const syn = synergyWith(s.type);
    return `<div class="hd">${glyphHTML(s.type, '', '', s.star || 0)}<div><div class="nm">${d.name} <span class="rar" style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name}</span></div>
      <div class="meta">${tags}</div></div></div><div class="desc">${d.desc}</div>
      ${s.sale ? `<div class="note sale">特価：今日だけ半額（${d.cost}枚 → <b>${shopPrice(s)}枚</b>）</div>` : ''}
      ${s.star ? '<div class="note star">★改造済み：買った時点で ★1（効果 +30%）</div>' : ''}
      ${syn ? `<div class="note syn">相性◎：持っている「${MACHINES[syn].name}」と組み合わせられる</div>` : ''}
      ${d.sky ? '<div class="note sky">青天井：組み合わせ次第で倍率に上限がない</div>' : ''}
      ${modOn(s.type) ? `<div class="mod-line"><b>追加効果「${d.mod.name}」</b>　${d.mod.desc}</div>` : ''}`;
  }
  // 置いた場所・持ちコインなどで決まる「今の効果」
  function stateNote(m) {
    const R = G.run;
    const adj = (pred) => adjMachineList(m.x, m.y).filter((o) => !offline(o) && pred(o)).length;
    const placed = m.x >= 0;
    switch (m.type) {
      case 'lottery': {
        if (!placed) return '';
        const p = Math.min(0.9, 0.15 + 0.25 * countAdjType(m.x, m.y, 'cat'));
        return `当選率 <b>${Math.round(p * 100)}%</b>`;
      }
      case 'cursed': {
        if (!placed) return '';
        return `消滅率 <b>${Math.round(cursedRisk(countAdjType(m.x, m.y, 'cat'), modOn('cursed')) * 100)}%</b>`;
      }
      case 'vault': {
        const lm = liveMult(m);
        return `持ちコイン ${R.coins}枚 → <b>×${lm ? fmtMult(Math.round(lm * 100) / 100) : 1}</b>`;
      }
      case 'twin':
        return placed ? (countAdjType(m.x, m.y, 'twin') + (modOn('twin') ? adj((o) => o.type !== 'twin' && MACHINES[o.type].hot) : 0) ? '隣に相方あり → <b>×2.5</b>' : '隣に相方なし → ×1.5') : '';
      case 'mason':
        return placed ? `隣のふるい ${countAdjType(m.x, m.y, 'sieve')}台 → 石なら <b>×${fmtMult(2 + 2 * countAdjType(m.x, m.y, 'sieve'))}</b>` : '';
      case 'bellows':
        return placed ? `隣の「炉」 <b>${adj((o) => MACHINES[o.type].hot)}台</b> の熱が+2` : '';
      case 'piggy':
        return R && !R.demo ? `持ちコイン ${R.coins}枚 → 日の終わりに <b>+${Math.floor(Math.max(0, R.coins) / 10)}枚</b>（1台ぶん）` : '';
      case 'cat':
        return placed ? `隣の宝くじ機 ${countAdjType(m.x, m.y, 'lottery')}台・呪いの炉 ${countAdjType(m.x, m.y, 'cursed')}台` : '';
      case 'battery':
        return placed ? `隣の「N回ごと」の機械 <b>${adj((o) => MACHINES[o.type].charge)}台</b>` : '';
      case 'cooler':
        return placed ? `隣の「×」系の機械 <b>${adj((o) => MACHINES[o.type].kind === 'mult' || o.type === 'transmuter')}台</b>${!modOn('cooler') && adj((o) => MACHINES[o.type].hot) ? '　<b style="color:#ff8f8f">隣の炉は熱を出さない</b>' : ''}` : '';
      case 'amp':
        return placed ? `隣の「+」「×」の機械 <b>${adj((o) => canStar(o))}台</b>：「+」は4倍、「×」は2.5乗` : '';
      case 'crown': {
        if (!R || R.demo) return '';
        const c = countPlaced('crown');
        const n = crownKinds() + (placed || c ? 0 : 1);
        const mul = (c + (placed ? 0 : 1)) * Math.pow(modOn('crown') ? 2.8 : CROWN_STEP, n);
        return `${placed ? '' : '置くと：'}盤面の機械 <b>${n}種類</b>（大型は2種類分）→ 出荷のとき <b>×${fmt(mul)}</b>`;
      }
      case 'clock':
        return placed ? `隣の機械 <b>${adj(() => true)}台</b> の発動回数が2倍` : '';
      case 'exchange': {
        const per = m.x >= 0 ? beltHits(m.x, m.y) : 0;
        return `持ちコイン ${R.coins}枚 → <b>×${fmtMult(Math.round((1 + R.coins / 20) * 10) / 10)}</b>${per ? `（アイテム1個につき${per}枚払う。原料${R.itemsToday}個なら1日で最大${per * R.itemsToday}枚）` : ''}`;
      }
      case 'prism': {
        if (!placed) return '';
        const n = prismKinds(m);
        return `隣の機械 ${n}種類 → 隣の「+」「×」の効果が <b>×${fmtMult(Math.round(prismStep(m) * 100) / 100)}</b>`;
      }
      case 'alchemist': {
        const p = countPlaced('alchemist') || 1;
        const a = p + (modOn('alchemist') ? 1 : 0);
        return `錬金術師 ${p}台${a > p ? '（大錬成で+1台ぶん）' : ''} → ランクが上がるたび <b>×${fmtMult(rankMul() * (1 + ALCH_STEP * a))}</b>（錬金釜の ×${rankMul()} 込み。錬金釜 ${countPlaced('transmuter')}台${rankCap() > 3 ? '・賢者の石でランクの上限なし' : ''}）`;
      }
      case 'transmuter': {
        const p = countPlaced('alchemist');
        const a = p ? p + (modOn('alchemist') ? 1 : 0) : 0;
        const cap = rankCap() > 3 ? '（賢者の石：金のあとも上がり続ける）' : '';
        return a ? `錬金術師 ${p}台：ランクが上がるたび <b>×${fmtMult(rankMul() * (1 + ALCH_STEP * a))}</b>${cap}` : `ランクが上がるたび <b>×${rankMul()}</b>${cap}`;
      }
      case 'resonator':
        return countPlaced('splitter') + countPlaced('duplicator') || modOn('resonator') ? '' : '分裂ゲート・複製機がないので、今は +2 だけ';
      case 'artisan': {
        if (!placed) return '';
        const reps = beltHits(m.x, m.y);
        let f = 1;
        for (let k = 1; k <= reps; k++) f *= mulEff(m, 1 + 0.5 * k);
        return `1個に <b>${reps}回</b> 当たる → 合計 <b>×${fmtMult(Math.round(f * 10) / 10)}</b>（反響レール・強化マスでさらに増える）`;
      }
    }
    return '';
  }

  function machineInfoHTML(m) {
    const d = MACHINES[m.type];
    let extra = '';
    if (m.x >= 0) {
      const hits = beltHits(m.x, m.y);
      const amps = countAdjType(m.x, m.y, 'amp');
      const coolers = countAdjType(m.x, m.y, 'cooler');
      const parts = [];
      if (d.belt) {
        const k = pathIndex(m.x, m.y);
        parts.push(`ベルト ${k}/${G.run.path.length - 1}マス目`);
        if (m.type === 'echo') {
          const P = G.run.path;
          const set = new Set();
          for (let j = Math.max(0, k - 1); j <= Math.min(P.length - 1, k + 1); j++) {
            for (const o of adjMachineList(P[j][0], P[j][1])) if (!isBeltType(o.type) && MACHINES[o.type].apply) set.add(o);
          }
          const n = set.size;
          parts.push(`横の機械 <b>${n}台</b> が追加で発動`);
        } else parts.push('アイテム1個につき <b>1回</b> 発動');
      } else if (m.type === 'piggy' || m.type === 'alchemist') parts.push('どこに置いても効果あり');
      else if (d.kind === 'passive') parts.push('隣接する機械に常時効果');
      else parts.push(`アイテム1個につき <b>${hits}回</b> 発動`);
      if (amps && canStar(m)) parts.push(`<b style="color:#f7a8ff">増幅 効果×${1 + amps}</b>`);
      if (coolers && d.kind === 'mult') parts.push(`冷却 倍率+${COOLER_ADD * coolers}`);
      const sp = machineSpecial(m);
      if (sp === 'boost') parts.push('<b style="color:#ffd447">★強化マス：発動+1</b>');
      if (sp === 'broken') parts.push('<b style="color:#ff6b6b">✕故障マス：今日は動かない</b>');
      if (d.charge) parts.push(`今は${chargeOf(m)}回ごと`);
      if (upkeepShort(m)) parts.push('<b style="color:#ff6b6b">維持費が足りない：このままだと今日は止まる</b>');
      extra = `<div class="meta">${parts.join(' ・ ')}</div>`;
    } else {
      extra = `<div class="meta">手持ち（未配置）${d.belt ? '：ベルトの上に置けます' : ''}</div>`;
    }
    const note = stateNote(m);
    if (note) extra += `<div class="meta" style="color:#ffd9a0">いま：${note}</div>`;
    if (m.star) extra += `<div class="meta" style="color:#ffd447">★改造 ×${m.star}：効果 +${Math.round(STAR_STEP * 100 * m.star)}%</div>`;
    const tl = tuneLv(m.type);
    if (tl && isTunable(m.type)) extra += `<div class="meta" style="color:#7fd6ff">研究「習熟」Lv${tl}：効果 +${Math.round(TUNE_STEP * 100 * tl)}%</div>`;
    // 研究した「追加効果」
    if (modOn(m.type)) extra += `<div class="mod-line"><b>追加効果「${d.mod.name}」</b>　${d.mod.desc}</div>`;
    const tags = (d.sky ? '<span class="tag sky">青天井</span>' : '') + (cellCount(m.type) > 1 ? '<span class="tag warn">大型：2マス・2枠</span>' : d.size > 1 && slotWeight(m) > 1 ? '<span class="tag warn">大型：2枠</span>' : '') + (upkeepOf(m) ? `<span class="tag warn">維持費 ${upkeepOf(m)}枚/日</span>` : '');
    const badge = m.x >= 0 ? `<span class="live-badge">${badgeOf(m)}</span>` : '';
    return `<div class="hd">${glyphHTML(m.type, '', '', m.star)}<div><div class="nm">${d.name}${badge}
      <span class="rar" style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name}</span></div>
      <div class="meta">${d.belt ? BELT_TAG + ' ' : ''}<span class="tag">${KIND_LABEL[d.kind]}</span>${tags}売値 ${sellValue(m)}枚</div></div></div>
      <div class="desc">${d.desc}</div>${extra}`;
  }

  // 機械の詳細：PCは右の欄に大きく出す（盤面・手持ち・ショップにカーソルを合わせる／選ぶと変わる）
  // スマホは、機械やショップのカードをタップしたときだけ、盤面の上に詳細バーを重ねる
  let hoverTray = null; // カーソルを合わせている手持ちの機械
  let hoverShop = null; // カーソルを合わせているショップの品（番号）
  function renderInfo(force) {
    const R = G.run;
    const el = $('detail');
    const active = !!R && !R.demo && (G.state === 'build' || G.state === 'run') && !(G.drag && G.drag.moved);
    const h = active ? G.hover : null;
    const selF = active && G.state === 'build' && R.sel != null ? findMachine(R.sel) : null;
    const hovM = h && inBounds(h.cx, h.cy) ? machineAt(h.cx, h.cy) : null;
    let trayF = active && hoverTray != null ? findMachine(hoverTray) : null;
    if (trayF && trayF.where !== 'tray') trayF = null;
    const okShop = (i) => i != null && R && R.shop[i] && !R.shop[i].sold;
    const shopI = active && okShop(hoverShop) ? hoverShop : active && okShop(shopSel) ? shopSel : null;
    const shopS = shopI != null ? R.shop[shopI] : null;
    const sp = !hovM && h && G.state === 'build' && inBounds(h.cx, h.cy) ? specialAt(h.cx, h.cy) : null;
    const key = [
      G.state, selF ? `${selF.m.uid}:${selF.m.x},${selF.m.y}*${selF.m.star}r${selF.m.rot}` : '', hovM ? hovM.uid + '*' + hovM.star : '',
      trayF ? trayF.m.uid : '', shopS ? shopI + ':' + (shopS.type || shopS.item) : '', shopSel, sp || '', R ? R.coins + ':' + R.kits + ':' + slotsUsed() + ':' + ownedCount() : '', el ? 1 : 0,
    ].join('|');
    if (!force && key === infoKey) return;
    infoKey = key;
    // 選択中 > 盤面でカーソルを合わせた機械 > 手持ち > ショップの品 > 特設マス
    let html = '';
    if (selF) html = machineInfoHTML(selF.m) + actionsHTML(selF, R);
    else if (hovM) html = machineInfoHTML(hovM);
    else if (trayF) html = machineInfoHTML(trayF.m) + '<div class="hint">クリックで選んで、盤面の光っているマスに置く</div>';
    else if (shopS) html = shopInfoHTML(shopS) + (G.state === 'build' ? `<div class="act-row">${buyBtnHTML(shopS, shopI, R, true)}</div>` : '');
    else if (sp) {
      html = sp === 'boost'
        ? '<div class="hint"><b style="color:#ffd447">★強化マス</b>：今日ここに置いた機械は発動回数が1増えます。</div>'
        : '<div class="hint"><b style="color:#ff6b6b">✕故障マス</b>：今日ここに置いた機械は動きません。</div>';
    }
    if (el) {
      el.innerHTML = html || `<div class="hint empty-hint"><b>機械の詳細</b>${G.state === 'build'
        ? '盤面・手持ち・ショップの機械にカーソルを合わせるか、クリックすると、ここにくわしい効果が出ます。<br>盤面の機械を選ぶと、<b>発動する順番</b>（①②③）も盤面に出ます。'
        : '機械にカーソルを合わせると、くわしい効果が出ます。'}</div>`;
      el.classList.toggle('pinned', !!selF || (!!shopS && shopI === shopSel));
    }
    if (detailBar) {
      const pick = !selF && active && G.state === 'build' && okShop(shopSel) ? R.shop[shopSel] : null;
      if (selF) detailBar.innerHTML = barHTML(selF, R);
      else if (pick) detailBar.innerHTML = shopBarHTML(pick, shopSel, R);
      detailBar.classList.toggle('hidden', !selF && !pick);
      detailBar.classList.toggle('shop', !selF && !!pick);
    }
  }

  // ---------- オーバーレイ ----------
  function showTitle() {
    G.state = 'title';
    startDemo(); // 後ろで見本の工場を動かす
    G.dirty = true;
    const b = G.meta.best;
    const dl = dailyInfo();
    const drec = G.meta.daily && G.meta.daily[dl.key];
    showOverlay(`
      <div class="title-card">
        <h1>コンベア錬金</h1>
        <p class="lead">ベルトの脇に機械を並べ、流れる原料を <b style="color:var(--accent)">足して→掛けて</b> 膨らませろ。${PHASE_DAYS}日ごとの納期を越えて、第${PHASES}期の完走をめざす工場ローグライク。</p>

  // スマホの「今日の情報」（PCでは右の欄に出ている内容：ボス・特設マス・レバレッジ・ノルマ）

      所持できるのは「設置枠 +${BENCH}台」。置ききれない機械は、右の <b>手持ち</b> で控えさせておけます。</p>
      <p><b>ショップ</b>（画面の下）：カードにカーソルを合わせる（スマホはタップ）と説明が出ます。<b>「購入」</b> を押すと買えて、そのまま置く場所を選べます。盤面へドラッグして買うこともできます（PC）。<br>
      機械には <b>レア度</b>（コモン・アンコモン・レア・エピック・レジェンド）があり、上のレア度ほど出にくく、強い。日が変わると、裏向きのカードがめくれて入荷します。<br>
      <b>納期達成ガチャ</b>：納期を達成すると1回まわせて、ランダムな機械が1台もらえる。レアが出やすく、研究でまだ開いていない機械も出る。<br>
      <b>入れ替え（リロール）</b> はその日のうちに 3 → 5 → 8 → 12 枚…と高くなり、次の日に戻ります。<br>
      1日の最初の入荷では、どれか1枚が <b>特価（半額）</b> か <b>★改造済み</b> になります。
      2日目からは <b>消耗品</b>（緑の券。その場で効く1回きりの品）もまざります。機械をショップの欄へドラッグすると売却できます。</p>
      <p><b>青天井</b>：急冷槽・落雷塔・熟練工・金庫・換金機・太陽炉は、組み合わせ次第で倍率に上限がありません。発動すると、倍率が少し大きな金色の文字で出ます。</p>
      <p><b>日替わりチャレンジ</b>：その日だけの工場で、全員が同じ条件（ベルトの形・品ぞろえ・特設マス・ボス・日報ボーナス）。全員に <b>研究ポイント ${DAILY_RP}</b> が配られ、その日だけの研究を組んでから挑みます（ふだんの研究・特許は使わない）。その日はじめて遊ぶと特許がもらえ、日ごとのベストが記録に残ります。</p>
      <p><b>3. 稼働</b>：原料が流れ、機械が 変換 → 加算 → 乗算 → 特殊 の順に効果を出します。1日が終わると、基本の報酬と利息（5枚ごとに+1）がもらえます。</p>
      <p><b>4. 納期とノルマ</b>：ノルマは <b>期ごとの合計</b> です。納期は期が始まってから${PHASE_DAYS}日目（第1期は${PHASE_DAYS}日目）。その期の出荷額の合計がノルマに届いた日に <b>納期達成</b> となり、次の日から次の期が始まります。次の期の納期は、そこからまた${PHASE_DAYS}日目です。<br>
      早く達成すれば前倒しボーナスがもらえます。納期の日までに届かなければ解雇です。ノルマは大きく、期ごとの上がり幅も大きいので、盤面を育て続けましょう。<br>
      納期達成の報酬：コイン（期が進むほど多い）＋ 超過ボーナス（ノルマの2倍ごとに+1）＋ 前倒しボーナス（残り1日につき+${EARLY_COIN}）＋ 豪華な日報ボーナス。</p>
      <p><b>5. 毎日変わるもの</b>：2日目からは盤面に<b>特設マス</b>が出ます（★強化マス＝置いた機械が2回発動、✕故障マス＝置いた機械が止まる）。日が終わるたびに<b>日報ボーナス</b>を3つから1つ選べます（改造キット・機械・ノルマ減など）。${BOSS_EVERY}日ごとに<b>ボス日</b>（特殊ルール）。</p>
      <p><b>組み合わせ</b>：1台では地味でも、組むと化ける機械がたくさんあります。説明文の「何に反応するか」に注目すると、機械どうしのつながりが見えてきます。自分だけの必勝パターンを見つけよう。</p>
      <p><b>素材ランク</b>：錬金釜（ベルト型）を1台通るごとに 石→銅→銀→金 と上がり、上がるたびに価値 ×${RANK_MUL}（金まで上げると ×8）。もらった倍率は、溶解炉でランクを下げても残ります。<b>賢者の石</b>（レジェンド）があると、金のあとも 白金→虹→… と上がり続けます。</p>
      <p><b>完走とハイスコアモード</b>：ゴールは第${PHASES}期の納期。後の期ほどノルマが急に重くなり、研究なしではまず届きません。届かなかったランでも特許はたまるので、研究を進めて少しずつ遠くの期をめざします（後の期ほど、納期達成の特許も多い）。<br>
      完走したら、<b>エンドレス</b>（第${PHASES + 1}期から、ノルマがどんどん重くなる期をどこまで続けられるか）か、<b>ハイスコアモード</b>（${HISCORE_DAYS}日間、ノルマなしで出荷した合計を競う）に挑めます。</p>
      <p><b>レバレッジ</b>（第3期まで届くと使える）：期の最初の日に、「稼働開始」ボタンの上の ◀ ▶ で Lv を決められます。1つ上げるごとに <b>その期のノルマ×${LEV_QMUL}</b>、そのかわり <b>納期達成のコイン+50%・特許+50%</b>。</p>
      <p><b>強い機械には代償</b>：大型（設置枠を2つ使う）、維持費（毎日コインを払う）、コインを払う、アイテムが消える…など。強い組み合わせほど、そろえるのが難しくなっています。</p>
      <p><b>研究所</b>：特許で、機械ごとの <b>習熟</b> を1段ずつ進められます。習熟を最後まで進めると、その機械の <b>追加効果</b>（新しい働き）を研究できます。新しい機械の設計図もここで。</p>
      <div class="menu-btns"><button class="btn sub" data-act="${fromPause ? 'back-pause' : 'title'}">戻る</button></div>
    `);
  }
  // ---------- 研究所 ----------
  // 分類タブ → 段（左から 1段目・2段目・3段目）→ 機械ごとのカード。
  // カードの中に、その機械の道（設計図 → 習熟1〜5 → 追加効果）と、次の1段を研究する大きなボタンがある
  let resTab = 'work';
  // 機械1台ぶんの道：○が習熟の1段、★が追加効果。研究済みは光り、次の1段は点滅する
  function trackHTML(t) {
    const bp = MACHINES[t].locked ? 1 : 0;
    const l = rlv('m_' + t);
    const nodes = [];
    if (bp) nodes.push({ label: '図', on: l >= 1, cls: 'bp', tip: '設計図' });
    for (let k = 1; k <= MASTERY_MAX; k++) nodes.push({ label: k, on: l >= bp + k, cls: '', tip: `習熟 Lv${k}` });
    nodes.push({ label: '★', on: modOn(t), cls: 'mod', tip: `追加効果「${MACHINES[t].mod.name}」` });
    // 次に研究できる1段（段がまだ開いていない機械では光らせない）
    const next = tierOpen(researchTabOf(t), RESEARCH_TIER[t]) || (devOn() && !G.flat) ? nodes.findIndex((n) => !n.on) : -1;
    return `<div class="rtrack">${nodes.map((n, i) => `<i class="${n.cls} ${n.on ? 'on' : ''} ${i === next ? 'next' : ''}" title="${n.tip}">${n.label}</i>`).join('<s></s>')}</div>`;
  }
  // ボタン1つぶん（主ノード＝設計図/習熟、追加効果、経営・設備のノード）
  function researchBtn(r) {
    const l = rlv(r.id);
    const inf = !isFinite(r.max);
    const maxed = l >= r.max;
    const open = researchOpen(r);
    const cost = maxed ? 0 : r.cost(l);
    const dev = devOn() && !G.flat; // 日替わりの研究はテストモードでも配られたポイントで
    let title;
    let desc;
    if (r.kind === 'main') {
      const d = MACHINES[r.machine];
      const blueprint = d.locked && l === 0;
      const tl = tuneLv(r.machine);
      const priceNow = `値段 -${TUNE_DISCOUNT * tl}枚`;
      title = blueprint ? '設計図' : maxed ? `習熟 Lv${MASTERY_MAX}（最大）` : `習熟 Lv${tl + 1}`;
      desc = blueprint
        ? 'ショップに並ぶようになる'
        : isTunable(r.machine)
          ? `${maxed ? '' : `効果 <b>+${Math.round(TUNE_STEP * 100)}%</b>・ショップでの値段 <b>-${TUNE_DISCOUNT}枚</b>　`}（今：効果 +${Math.round(TUNE_STEP * 100 * tl)}%・${priceNow}）`
          : `${maxed ? '' : `ショップでの値段 <b>-${TUNE_DISCOUNT}枚</b>　`}（今：${priceNow}）。最後まで進めると追加効果`;
    } else if (r.kind === 'mod') {
      title = `追加効果「${MACHINES[r.machine].mod.name}」`;
      desc = r.desc;
    } else {
      title = r.name;
      desc = r.desc + (inf && l ? `（今 +${r.id === 'inf_prod' ? l * 10 + '%' : l + '枚'}）` : '');
    }
    const lv = r.max === 1 || r.kind === 'main' ? '' : `<span class="rb-lv">Lv ${l}${inf ? '' : ' / ' + r.max}</span>`;
    let state;
    let right;
    if (maxed) {
      state = 'maxed';
      right = '<span class="rb-cost done">✔ 済</span>';
    } else if (!open && !dev) {
      state = 'locked';
      const req = r.req && RESEARCH.find((x) => x.id === r.req);
      const short = req && rlv(req.id) < (r.reqLv || 1); // 前提がまだ足りない
      right = `<span class="rb-cost lock"><i class="ic ic-lock"></i> ${!tierOpen(r.tab, r.tier) ? '段が未解放' : short ? (req.kind === 'main' ? `習熟 Lv${MASTERY_MAX} で解放` : '先に左') : '段が未解放'}</span>`;
    } else {
      state = dev || resPoints() >= cost ? 'can' : 'poor';
      right = `<span class="rb-cost">${dev ? '切替' : G.flat ? cost + 'pt' : '特許 ' + cost}</span>`;
    }
    // ×5：まだ上げられる段が2つ以上あって、2段ぶん以上の特許があるとき、まとめて上げるボタン
    const multi = !dev && state === 'can' && r.max - l >= 2 && resPoints() >= cost + r.cost(l + 1)
      ? `<span class="rb-x5" data-research5="${r.id}" title="特許が足りるぶんだけ、まとめて5段まで上げる">×5</span>` : '';
    return `<div class="rbtn-wrap"><button class="rbtn ${r.kind} ${state} ${l > 0 ? 'has' : ''} ${dev ? 'dev' : ''}" data-research="${r.id}" ${state === 'can' || dev ? '' : 'disabled'}>
      <span class="rb-body"><span class="rb-t">${title}${lv}</span><span class="rb-d">${desc}</span></span>${right}</button>${multi}</div>`;
  }
  // 機械1台ぶんのカード
  function machineCard(t) {
    const d = MACHINES[t];
    const main = RESEARCH.find((r) => r.id === 'm_' + t);
    const mod = RESEARCH.find((r) => r.id === 'x_' + t);
    const locked = d.locked && !isUnlocked(t);
    return `<div class="rcard ${locked ? 'unowned' : ''}">
      <div class="rc-head">${glyphHTML(t)}<div class="rc-txt"><div class="rc-nm">${d.name}
        <span class="rar" style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name}</span>${d.belt ? BELT_TAG : ''}${locked ? '<span class="rc-lock">未解放</span>' : ''}</div>
        <div class="rc-desc">${d.desc}</div></div></div>
      ${trackHTML(t)}
      ${researchBtn(main)}${researchBtn(mod)}</div>`;
  }
  function showResearch() {
    let done = 0;
    let total = 0;
    for (const r of RESEARCH) {
      if (!isFinite(r.max)) continue;
      done += Math.min(rlv(r.id), r.max);
      total += r.max;
    }
    const tabs = RESEARCH_TABS.map((t) => {
      const mine = RESEARCH.filter((r) => r.tab === t.id && isFinite(r.max));
      const got = mine.reduce((s, r) => s + Math.min(rlv(r.id), r.max), 0);
      const can = (!devOn() || G.flat) && RESEARCH.some((r) => r.tab === t.id && rlv(r.id) < r.max && researchOpen(r) && resPoints() >= r.cost(rlv(r.id)));
      return `<button class="rtab ${resTab === t.id ? 'on' : ''}" data-act="res-tab" data-tab="${t.id}">${t.name}
        <span>${got} / ${mine.reduce((s, r) => s + r.max, 0)}</span>${can ? '<i class="dot"></i>' : ''}</button>`;
    }).join('');
    let body;
    if (resTab === 'gen') {
      // 経営・設備・物流：左から順に進める3本の列
      body = TREE_GENERAL.map((lane) => {
        const cells = RESEARCH.filter((r) => r.lane === lane.id).map((r) => `<div class="gcell">${researchBtn(r)}</div>`).join('<div class="garrow">▶</div>');
        return `<div class="glane"><div class="glane-n" style="color:${lane.color};border-color:${lane.color}">${lane.name}</div><div class="glane-row">${cells}</div></div>`;
      }).join('');
      body = `<p class="rhint">左から順に研究します（1つ前を研究すると次が開く）。いちばん右は上限のない研究です。</p>${body}`;
    } else {
      const prog = tabProgress(resTab);
      const cols = [1, 2, 3].map((tier) => {
        const open = tierOpen(resTab, tier) || (devOn() && !G.flat);
        const need = TIER_NEED[tier];
        const types = Object.keys(RESEARCH_TIER).filter((t) => RESEARCH_TIER[t] === tier && researchTabOf(t) === resTab);
        const head = open
          ? `<span class="tier-ok">${tier === 1 ? '最初から研究できる' : '開放済み'}</span>`
          : `<span class="tier-ng"><i class="ic ic-lock"></i> この分類であと <b>${need - prog}</b> 段階研究すると開く</span>
             <div class="tier-bar"><i style="width:${Math.min(100, (prog / need) * 100)}%"></i></div>`;
        return `<div class="rcol ${open ? '' : 'closed'}"><div class="rcol-h"><b>${tier}段目</b>${head}</div>${types.map(machineCard).join('')}</div>`;
      });
      body = `<p class="rhint">機械ごとに1本の道があります。<b>習熟</b> を1段ずつ進め（ショップでの値段が1枚ずつ安くなり、「+」「×」の機械は効果も +${Math.round(TUNE_STEP * 100)}%ずつ。3段まで）、
        最後まで進めると <b style="color:#f7a8ff">★追加効果</b>（その機械に新しい働きが付く）を研究できます。
        ${G.flat ? '日替わりの研究は、どの段からでも選べます。' : `この分類で研究を進めるほど、右の段が開きます（今 <b>${prog}</b> 段階）。`}</p>
        <div class="rgrid">${cols.join('<div class="rgrid-arrow">▶</div>')}</div>`;
    }
    // 日替わりチャレンジの研究：配られたポイントで、その日だけの研究を組んでから挑む
    if (G.flat) {
      const left = resPoints();
      showOverlay(`
        <div class="rhead daily-rhead"><h2><i class="ic ic-calendar"></i> 日替わりの研究 <small>${dailyInfo().label}</small></h2>
          <div class="patents">研究ポイント 残り <b>${left}</b> / ${DAILY_RP}</div>
          <button class="btn sub small" data-act="daily-reset" ${left >= DAILY_RP ? 'disabled' : ''}>振り直す</button>
          <button class="btn sub small" data-act="title">戻る</button>
          <button class="btn small daily-go" data-act="daily-go">▶ この研究で挑む</button></div>
        <p class="lead daily-lead">全員に同じ <b>${DAILY_RP}ポイント</b> が配られます。今日だけの研究です（ふだんの研究と特許は使いません）。設計図は全部そろっていて、どの段からでも選べます。決めた研究は、今日なら何回挑んでも使えます。</p>
        <div class="rtabs">${tabs}</div>
        ${body}`, 'wide');
      return;
    }
    const refund = G.meta.researchRefund;
    if (refund != null) {
      delete G.meta.researchRefund;
      saveMeta();
    }
    // テストプレイ用：研究を自由にオンオフする砂場（完成版では DEV_TOOLS = false で消える）
    const dev = !DEV_TOOLS ? '' : `<div class="devbar ${devOn() ? 'on' : ''}">
        <button class="btn small ${devOn() ? '' : 'sub'}" data-act="dev-toggle"><i class="ic ic-wrench"></i> テストモード：${devOn() ? 'ON' : 'OFF'}</button>
        ${devOn()
          ? `<button class="btn small sub" data-act="dev-all">全部オン</button><button class="btn small sub" data-act="dev-none">全部オフ</button>
             <button class="btn small sub" data-act="dev-copy">本来の研究をコピー</button>
             <span>ボタンを押すたびに Lv が1つ上がり、最大の次は0に戻ります。特許は使いません。OFFにすると本来の研究に戻ります</span>`
          : '<span>研究を自由にオンオフしてテストプレイできます（本来の研究はそのまま残ります）</span>'}
      </div>`;
    showOverlay(`
      <div class="rhead"><h2>研究所</h2>
        <div class="patents">特許 ${G.meta.patents} <span style="font-size:12px;color:var(--muted);font-weight:500">・ 進み具合 ${done} / ${total}</span></div>
        <button class="btn sub small" data-act="title">戻る</button>
        <button class="btn small go-run" data-act="new">▶ 出勤する</button></div>
      ${refund != null ? `<p class="lead" style="color:var(--coin);font-weight:700">研究所を作り直しました。これまでの研究はリセットして、使った特許 ${refund} を全部返しています。</p>` : ''}
      ${dev}
      <div class="rtabs">${tabs}</div>
      ${body}
    `, 'wide');
  }

  // ---------- 実績 ----------
  function medalHTML(a, got) {
    const t = ACH_TIERS[a.tier];
    return `<div class="medal ${got ? '' : 'off'}" style="--mc:${t.color}">${got ? '<i class="ic ic-trophy"></i>' : a.secret ? '？' : '<i class="ic ic-lock"></i>'}</div>`;
  }
  function showTrophies() {
    const got = achCount();
    const earned = ACHIEVEMENTS.filter((a) => hasAch(a.id)).reduce((s, a) => s + ACH_REWARD[a.tier], 0);
    const sections = ACH_CATS.map((c) => {
      const list = ACHIEVEMENTS.filter((a) => a.cat === c.id);
      const n = list.filter((a) => hasAch(a.id)).length;
      const cards = list.map((a) => {
        const ok = hasAch(a.id);
        const hide = a.secret && !ok;
        const date = ok ? new Date(G.meta.ach[a.id]).toLocaleDateString('ja-JP') : '';
        return `<div class="ach ${ok ? 'got' : ''} tier${a.tier}">${medalHTML(a, ok)}<div class="ach-body">
          <div class="n">${hide ? '？？？' : a.name} <span class="ach-tier" style="color:${ACH_TIERS[a.tier].color}">${ACH_TIERS[a.tier].name}</span></div>
          <div class="d">${hide ? 'ヒント：' + a.hint : a.desc}</div></div>
          <div class="ach-r">${ok ? `<span class="ach-date">${date}</span>` : `特許 +${ACH_REWARD[a.tier]}`}</div></div>`;
      }).join('');
      return `<h3 class="rs-cat">${c.name} <span style="color:var(--muted);font-size:12px">${n} / ${list.length}</span></h3>${cards}`;
    }).join('');
    showOverlay(`
      <h2><i class="ic ic-trophy"></i> 実績</h2>
      <div class="patents">${got} / ${ACHIEVEMENTS.length} 解除 ・ もらった特許 ${earned}</div>
      <p class="lead" style="font-size:12px">解除するとその場で特許がもらえます（銅+1・銀+2・金+3）。「？？？」はひみつの実績。ヒントの組み合わせを探してみよう。</p>
      <div class="research">${sections}</div>
      <div class="menu-btns"><button class="btn sub" data-act="title">戻る</button></div>
    `);
  }
  // 実績解除の通知（右上に積み重なって、数秒で消える）
  function achievement(a) {
    let box = $('ach-toasts');
    if (!box) {
      box = document.createElement('div');
      box.id = 'ach-toasts';
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = 'ach-toast';
    el.style.setProperty('--mc', ACH_TIERS[a.tier].color);
    el.innerHTML = `<div class="medal"><i class="ic ic-trophy"></i></div><div><div class="t">実績解除：${a.name}</div><div class="d">${a.desc}<br><b>特許 +${ACH_REWARD[a.tier]}</b></div></div>`;
    box.appendChild(el);
    Sfx.trophy();
    setTimeout(() => el.classList.add('out'), 4200);
    setTimeout(() => el.remove(), 4800);
  }

  // 1日の終わりの画面（日報）。スクロールしないで見られるように、PCは左右2列（左：今日の結果／右：日報ボーナス）、スマホは1列で詰めて出す
  // 納期を達成した日は、納期達成の報酬と次の期の予告も出す
  function showResult(firstWin, quiet) {
    const R = G.run;
    const rw = R.lastReward;
    const c = rw.clear;
    const recs = rw.records || [];
    const nb = (k) => (recs.includes(k) ? ' <span class="rec-badge">自己ベスト</span>' : '');
    // コイン：合計を大きく、内訳は小さな札で
    const parts = [[`今日の報酬${R.boss ? '（ボス日）' : ''}`, rw.base], ['利息', rw.interest]];
    if (rw.piggy) parts.push(['貯金箱', rw.piggy]);
    if (rw.cashback) parts.push(['キャッシュバック', rw.cashback]);
    if (c) {
      parts.push([`納期達成（第${c.phase}期）`, c.bonus, 'gold']);
      if (c.over) parts.push([`超過 ${ratioTxt(c.ratio)}`, c.over, 'gold']);
      if (c.early) parts.push([`前倒し（${c.daysLeft}日前）`, c.early, 'gold']);
      if (c.levBonus) parts.push([`レバレッジ Lv${rw.lev}`, c.levBonus, 'gold']);
    }
    const coinTotal = rw.coinTotal != null ? rw.coinTotal : parts.reduce((s, p) => s + p[1], 0);
    const coinBox = `<div class="coin-box anim" style="--d:.45s">
        <div class="cb-top"><span class="cb-l">${c ? '納期達成までにもらったコイン' : '今日もらったコイン'}</span><b class="cb-v">+<span id="coin-up">0</span><small>枚</small></b><span class="cb-have">持ちコイン <b>${R.coins}</b>枚</span></div>
        <div class="cb-parts">${parts.map(([n, v, k]) => `<span class="${k || ''}">${n} <b>+${v}</b></span>`).join('')}</div>
        ${rw.runCoins ? `<div class="cb-run">このほか、稼働中に機械から <b>+${rw.runCoins}枚</b></div>` : ''}
        ${c && c.slot ? `<div class="cb-slot"><i class="ic ic-gift"></i> 前倒し達成ボーナス：<b>設置枠 +1</b>（${R.boardCap}枠に）</div>` : ''}
      </div>`;
    // そのほかの数字（札を1行に並べる）
    const pts = rw.dayPts + (c ? c.pts : 0);
    const chips = [`最高価値 <b>${fmt(R.dayStats.best)}</b>${nb('item')}`, `特許 <b>+${fmtMult(Math.round(pts * 100) / 100)}</b>${c && rw.lev ? `（レバレッジ +${Math.round((levPatentMul(rw.lev) - 1) * 100)}%）` : ''}`];
    if (recs.includes('dayScore')) chips.unshift(`1日の出荷額 <b>${fmt(R.dayScore)}</b>${nb('dayScore')}`);
    if (c && recs.includes('ratio')) chips.push(`超過倍率 <b>${ratioTxt(c.ratio)}</b>${nb('ratio')}`);
    if (c && recs.includes('lev')) chips.push(`レバレッジ <b>Lv${rw.lev}</b>${nb('lev')}`);
    if (R.dayStats.maxCombo >= 5) chips.push(`最大 <b>${R.dayStats.maxCombo}</b>連続出荷`);
    const info = `<div class="res-chips anim" style="--d:.75s">${chips.map((t) => `<span>${t}</span>`).join('')}</div>`;
    // 今日の出荷額と、今の期の進み具合
    const prog = Math.min(1, R.phaseScore / R.quota);
    const note = c
      ? `納期達成！${c.daysLeft > 0 ? `　納期の${c.daysLeft}日前なので、前倒しボーナス（コイン＋<b>設置枠 +1</b>）` : '　納期の日の達成なので、設置枠は増えません（コインのみ）'}`
      : `あと <b>${fmt(rw.need)}</b>　／　納期まで あと${rw.daysLeft}日${rw.daysLeft === 1 ? '（明日が納期）' : ''}`;
    const big = `<div class="result-big good"><span class="rb-l">今日の出荷</span><span id="count-up">0</span></div>
      <div class="phase-prog ${c ? 'done' : ''}">
        <div class="pp-row"><span>${R.endless ? 'エンドレス ' : ''}第${R.phase}期の合計</span><span><b>${fmt(R.phaseScore)}</b> / ${fmt(R.quota)}</span></div>
        <div class="pp-bar"><div style="width:${(prog * 100).toFixed(1)}%"></div></div>
        <div class="pp-note">${note}</div>
      </div>`;
    const tutNote = R.tut && R.day === 1
      ? `<div class="tut-note"><b>これが1日の流れです。</b>ノルマは期ごとの合計で、納期（${PHASE_DAYS}日目）までに届けば次の期へ進みます。届かなかった日も、コインと日報ボーナスはもらえます。右の日報ボーナスを1つ選んで、次の日へ。</div>`
      : '';
    let head;
    let left = `${tutNote}${big}${coinBox}${info}`;
    let right;
    if (firstWin && R.daily) {
      // 日替わりチャレンジは第6期の達成でおしまい（エンドレス・ハイスコアモードはない）
      head = '<h2 style="color:var(--coin)"><i class="ic ic-trophy"></i> 日替わりチャレンジ 完走！</h2>';
      right = `<div class="hi-invite"><div class="t">全員と同じ条件で、第${PHASES}期まで完走しました</div><div class="d">結果の画面から、𝕏 へのポストや戦績カードの保存ができます。</div></div>
        <div class="menu-btns"><button class="btn" data-act="retire">結果を見る</button></div>`;
    } else if (firstWin) {
      // 完走：このあとの遊び方を選ぶ（エンドレス／ハイスコアモード／退職）
      const best = G.meta.best.hiscore || 0;
      const nq = runQuota(PHASES + 1);
      head = `<h2 style="color:var(--coin)"><i class="ic ic-trophy"></i> 第${PHASES}期の納期達成！ 完走です</h2>`;
      right = `<div class="mode-pick"><div class="mp-h">このあとの遊び方を選べます</div>
          <button class="mode-btn endless" data-act="endless"><b>∞ エンドレスに挑む</b><span>第${PHASES + 1}期（ノルマ <b>${fmt(nq)}</b>）から、どこまで期を続けられるか。期ごとにノルマの伸びが大きくなります。届かなかったらそこで終わり（解雇にはなりません）。後の期ほど、納期達成の特許も多い。</span></button>
          <button class="mode-btn hi" data-act="hiscore"><b><i class="ic ic-flag"></i> ハイスコアモード（${HISCORE_DAYS}日間）</b><span>ノルマなしの ${HISCORE_DAYS}日間で、出荷した合計がハイスコアになります。${best ? `自己ベストは <b>${fmt(best)}</b>。` : ''}最後に、${fmt(Math.pow(10, HISCORE_PATENT_FROM))}を超えた桁の数だけ特許。</span></button>
          <button class="btn sub" data-act="retire">ここで退職する（特許 +${patentsFor(R)}）</button></div>`;
    } else if (R.hi) {
      // ハイスコアモードの1日の終わり
      const best = R.hi.best;
      const over = best > 0 && R.phaseScore > best;
      left = `<div class="result-big good"><span class="rb-l">今日の出荷</span><span id="count-up">0</span></div>
        <div class="phase-prog ${over ? 'done' : ''}">
          <div class="pp-row"><span>ハイスコア（合計）</span><span><b>${fmt(R.phaseScore)}</b>${best > 0 ? ` / 自己ベスト ${fmt(best)}` : ''}</span></div>
          ${best > 0 ? `<div class="pp-bar"><div style="width:${(Math.min(1, R.phaseScore / best) * 100).toFixed(1)}%"></div></div>` : ''}
          <div class="pp-note">${R.hi.done ? (R.hi.newBest ? '<i class="ic ic-star"></i> ハイスコア 自己ベスト更新！' : 'ハイスコアモード終了') : over ? '自己ベストを超えています！' : `あと${rw.daysLeft}日`}</div>
        </div>${coinBox}${info}`;
      if (R.hi.done) {
        head = '<h2 style="color:var(--coin)"><i class="ic ic-flag"></i> ハイスコアモード終了</h2>';
        right = `<div class="hi-invite"><div class="t">ハイスコアの特許（${fmt(Math.pow(10, HISCORE_PATENT_FROM))}を超えた桁の数）</div><div class="d" style="font-size:22px;font-weight:900;color:var(--blue)">+${R.hi.bonus}</div></div>
          <div class="menu-btns"><button class="btn" data-act="hi-finish">結果を見る</button></div>`;
      } else {
        head = `<h2>ハイスコアモード DAY ${R.day}</h2>`;
        right = `${nextDayHTML(R)}${rewardsHTML(R)}`;
      }
    } else {
      head = `<h2 ${c ? 'style="color:var(--coin)"' : ''}>${c ? `<i class="ic ic-star"></i> ${R.endless ? 'エンドレス ' : ''}第${c.phase}期 納期達成！` : `DAY ${R.day} 終了`}</h2>`;
      // 納期を達成したら、まず納期達成ガチャ（回してから日報ボーナスを選ぶ）
      right = R.gachaPending ? `${nextDayHTML(R)}${gachaHTML()}` : `${nextDayHTML(R)}${gachaGotHTML(R)}${rewardsHTML(R)}`;
    }
    showOverlay(`${head}<div class="res-grid"><div class="res-l">${left}</div><div class="res-r">${right}${tipHTML('pc-only')}</div></div>`, 'result');
    R.resultFirstWin = firstWin;
    // quiet：ガチャのあとに出し直すとき（数字のカウントアップと音はもう一度やらない）
    if (quiet) {
      $('count-up').textContent = fmt(R.dayScore);
      const cu0 = $('coin-up');
      if (cu0) cu0.textContent = fmt(coinTotal);
      for (const el of card.querySelectorAll('.anim')) {
        el.style.animation = 'none';
        el.style.opacity = '1';
      }
      return;
    }
    countUp($('count-up'), R.dayScore, 0.7);
    const cu = $('coin-up');
    if (cu) setTimeout(() => countUp(cu, coinTotal, 0.5), 450);
    for (let i = 0; i < Math.min(5, parts.length); i++) setTimeout(() => Sfx.coin(), 500 + i * 120);
  }
  // 納期達成ガチャ（まだ回していない）
  function gachaHTML() {
    const w = gachaWeights();
    const tot = Object.values(w).reduce((a, b) => a + b, 0);
    const odds = [5, 4, 3].map((k) => `<span style="color:${RARITY[k].color}">${RARITY[k].name} ${Math.round((w[k] / tot) * 100)}%</span>`).join('　');
    return `<div class="gacha-box">
        <div class="gb-h">${ICON('gift')} 納期達成ガチャ</div>
        <div class="gb-d">ランダムな機械が1台もらえます。レアが出やすく、<b>研究でまだ開いていない機械</b>も出ます。<br>${odds}</div>
        <button class="btn gacha-btn" data-act="gacha">${ICON('capsule')} ガチャを回す（無料）</button>
        <div class="gb-n">回すと、日報ボーナスを選べます</div>
      </div>`;
  }
  // 今日のガチャで出た機械（小さく）
  function gachaGotHTML(R) {
    const g = R.lastCapsule;
    if (!g || !R.lastReward || !R.lastReward.clear) return '';
    return `<div class="gacha-got" style="--rc:${RARITY[g.rar].color}">${glyphHTML(g.type)}<div><b>${MACHINES[g.type].name}</b><span>${RARITY[g.rar].name}${g.locked ? '・未開放' : ''}</span></div><em>ガチャで獲得</em></div>`;
  }
  // 日報ボーナス：1つ選ぶと次の日へ
  function rewardsHTML(R) {
    if (!R.rewards || !R.rewards.length) return `<div class="menu-btns"><button class="btn" data-act="next">次の日へ</button></div>`;
    const cards = R.rewards.map((rw, i) => {
      const t = rewardText(rw);
      const g = rw.id === 'machine' ? glyphHTML(rw.type) : `<div class="glyph reward-ico">${REWARD_ICON[rw.id] || '？'}</div>`;
      return `<button class="reward anim" data-reward="${i}" style="--d:${0.9 + i * 0.12}s">${g}<div class="rw-body"><div class="name">${t.t}</div><div class="desc">${rw.id === 'machine' ? `<b>${MACHINES[rw.type].short}</b>　${MACHINES[rw.type].desc}` : t.d}</div></div><span class="rw-go">選ぶ ▶</span></button>`;
    }).join('');
    const big = R.rewards[0] && R.rewards[0].big;
    return `<h3 class="reward-h">${big ? '<i class="ic ic-gift"></i> 納期達成の日報ボーナス（豪華）' : '<i class="ic ic-clipboard"></i> 日報ボーナス'}<span>1つ選ぶと次の日へ</span></h3><div class="rewards">${cards}</div>`;
  }
  const REWARD_ICON = { coins: '¥', kit: '<i class="ic ic-wrench"></i>', patent: '特', quota: '↓', shop: '店', reroll: '↻' };

  // 明日の予告（ボス日）と、納期を達成した日は次の期のノルマ
  function nextDayHTML(R) {
    const d = R.day + 1;
    const c = R.lastReward && R.lastReward.clear;
    const boss = (d % BOSS_EVERY === 0)
      ? '<div class="next-boss"><i class="ic ic-warn"></i> <b>明日はボス日</b>（特殊ルールは明日の準備画面で発表）</div>'
      : '';
    if (!c) return boss;
    const p = R.phase + 1;
    const nq = niceRound(runQuota(p) * Math.pow(LOAN_QMUL, R.loan || 0));
    return `<div class="next-phase">次は <b>${R.endless ? 'エンドレス ' : ''}第${p}期</b>：ノルマ <b>${fmt(nq)}</b>（今の ${fmtMult(Math.round((nq / R.quota) * 10) / 10)}倍${R.loan ? `・前借り ${R.loan}回ぶん +${Math.round((Math.pow(LOAN_QMUL, R.loan) - 1) * 100)}%` : ''}）<br>
      納期は DAY ${deadlineFrom(R.day + 1)}。明日から <b>${PHASE_DAYS}日</b> あります</div>${boss}`;
  }
  // 研究所へのボタン。研究できるものがあれば、光って目立つ大きなボタンになる
  function researchBtnHTML(label, big) {
    const n = researchAvail();
    const gap = nextResearchGap();
    if (n > 0) {
      return `<button class="btn research-go ${big ? 'big' : ''}" data-act="research">
          <span class="rg-ico"><i class="ic ic-flask"></i></span><span class="rg-body"><b>${label}へ</b><span>いま研究できるもの <b>${n}件</b> ・ 特許 ${G.meta.patents}</span></span>
          <span class="rg-badge">研究できる！</span></button>`;
    }
    return `<button class="btn sub" data-act="research"><i class="ic ic-flask"></i> ${label} <span class="patents" style="font-size:14px">特許 ${G.meta.patents}</span>${gap ? `<span class="rg-gap">次の研究まで あと${gap}</span>` : ''}</button>`;
  }
  // 次に研究できるようになるまで、あと何特許か（いちばん安い研究で）
  function nextResearchGap() {
    let min = Infinity;
    for (const r of RESEARCH) {
      const l = rlv(r.id);
      if (l < r.max && researchOpen(r)) min = Math.min(min, r.cost(l));
    }
    return isFinite(min) && min > G.meta.patents ? min - G.meta.patents : 0;
  }
  let lastReason = '';
  // ランの終わりの画面。PCは左右2列（左：結果と特許／右：シェアと次の行動）にして、スクロールしないで見られるようにする
  function showGameOver(gained, reason) {
    const R = G.run;
    lastReason = reason;
    const failed = reason === 'fail';
    const hiDone = reason === 'hiscore';
    const endless = reason === 'endless';
    const title = R.daily
      ? (R.victory ? '<i class="ic ic-trophy"></i> 日替わりチャレンジ 完走！' : failed ? '日替わりチャレンジ：納期に間に合わず…' : '日替わりチャレンジ 終了')
      : failed ? '納期に間に合わず…解雇されました' : endless ? '∞ エンドレス終了' : hiDone ? '<i class="ic ic-flag"></i> ハイスコアモード終了' : reason === 'retire' ? '円満退職！' : 'このランを終了しました';
    const canResearch = researchAvail() > 0;
    const short = failed || endless ? Math.max(0, R.quota - R.phaseScore) : 0;
    const dd = R.daily;
    const drec = dd && G.meta.daily[dd.key];
    const dailyBox = dd
      ? `<div class="daily-box">
          <div class="t"><i class="ic ic-calendar"></i> 日替わりチャレンジ ${dd.label}${dd.newBest ? ' <span class="rec-badge">今日のベスト更新</span>' : ''}</div>
          <div class="d">今日のベスト：第${drec.phases}期・総出荷 ${fmt(drec.total)}（${drec.plays}回目）${dd.gotBonus ? ` ・ 今日はじめてのプレイ：特許 <b>+${dd.gotBonus}</b>` : ' ・ 日替わりの特許は受け取り済み'}</div>
        </div>`
      : '';
    let bigBox = '';
    if (failed) {
      bigBox = `<div class="result-big bad"><span class="rb-l">第${R.phase}期の合計</span>${fmt(R.phaseScore)} <span class="rb-q">/ ${fmt(R.quota)}</span></div>
        <p class="lead miss-line">ノルマまで あと <b>${fmt(short)}</b> 足りなかった…！</p>`;
    } else if (endless) {
      bigBox = `<div class="result-big good"><span class="rb-l">エンドレス</span>第${R.stats.phasesCleared}期まで達成</div>
        <p class="lead miss-line">第${R.phase}期のノルマまで あと <b>${fmt(short)}</b>（${fmt(R.phaseScore)} / ${fmt(R.quota)}）</p>`;
    } else if (hiDone) {
      bigBox = `<div class="result-big good"><span class="rb-l">ハイスコア</span>${fmt(R.hi.total || 0)}${R.hi.newBest ? ' <span class="rec-badge">自己ベスト更新</span>' : ''}</div>`;
    }
    // 共有カードの画像を端末のシェア機能で送れるか（スマホなど）
    let canShareImg = false;
    try { canShareImg = !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob([''])], 'a.png', { type: 'image/png' })] })); } catch (err) { canShareImg = false; }
    const ph = R.stats.phasesCleared;
    const left = `${bigBox}${dailyBox}
      <div class="patent-gain">
