<style>
:root {
  --bg: #0e1015;
  --panel: #171a22;
  --panel-2: #1e222c;
  --line: #2a2f3c;
  --text: #e8ecf3;
  --muted: #8b93a5;
  --accent: #ffb347;
  --accent-2: #ff7a59;
  --coin: #ffd447;
  --good: #6fe3a5;
  --bad: #ff6b6b;
  --blue: #7fd6ff;
  --font: "M PLUS 1p", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-dot: "DotGothic16", var(--font);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
button { font-family: inherit; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- HUD ---------- */
#hud {
  display: flex; align-items: center; gap: 22px;
  padding: 8px 16px; background: linear-gradient(#1a1d26, #14161d);
  border-bottom: 1px solid var(--line); min-height: 64px; flex-wrap: wrap;
}
.hud-block { display: flex; flex-direction: column; line-height: 1.1; }
.hud-block .label { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.hud-block .big { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
.hud-block .sub { font-size: 14px; color: var(--muted); font-weight: 700; }
.hud-block .coin { color: var(--coin); }
.hud-block .order-name { font-size: 16px; color: #7ff0b4; line-height: 1.5; }
.hud-block .order-name.boss { color: #ff8fa3; }
.hud-block.quota { flex: 1; min-width: 260px; max-width: 520px; }
.quota-row { display: flex; flex-direction: column; }
.bar { position: relative; height: 8px; background: #0b0d12; border-radius: 4px; margin-top: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ff9f43, #ffd447); transition: width .08s linear; }
.bar .fill.over { background: linear-gradient(90deg, #6fe3a5, #7fd6ff, #f687b3); opacity: .95; }
.bar.done { box-shadow: 0 0 10px #ffd44788; }
.hud-tools { margin-left: auto; display: flex; gap: 6px; }
.hud-tools button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 15px; min-width: 44px;
}
.hud-tools button:hover { border-color: var(--accent); }

/* ---------- Main ---------- */
#main { flex: 1; display: flex; min-height: 0; }
#board-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; padding: 10px; }
#board { display: block; border-radius: 10px; box-shadow: 0 10px 40px #0008; cursor: crosshair; touch-action: none; }

#banner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6);
  font-size: 64px; font-weight: 900; color: var(--coin); pointer-events: none; opacity: 0; white-space: nowrap;
  text-shadow: 0 0 20px #ff9f43, 0 4px 0 #7a3b00, 0 0 60px #ffd44788; letter-spacing: .05em;
}
#banner.show { animation: banner 1.6s cubic-bezier(.2,1.6,.4,1) forwards; }
#banner.bad { color: var(--bad); text-shadow: 0 0 20px #ff6b6b, 0 4px 0 #5a0000; }
#banner.unit {
  font-size: 84px; color: transparent; text-shadow: none;
  background: linear-gradient(90deg, #ffd447, #ff7a59, #f687b3, #7fd6ff, #6fe3a5, #ffd447);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 4px 0 #3a1a00) drop-shadow(0 0 24px #ffd44799);
}
#banner.unit.show { animation: banner 1.9s cubic-bezier(.2,1.6,.4,1) forwards, rainbow 0.8s linear infinite; }
@keyframes rainbow { from { background-position: 0% 0; } to { background-position: 200% 0; } }

/* フィーバー中のHUD */
#hud.fever { background: linear-gradient(90deg, #2a1e08, #1a1d26 40%, #2a1e08); animation: feverhud 1.2s ease-in-out infinite alternate; }
@keyframes feverhud { from { box-shadow: inset 0 -2px 0 #ffb34766; } to { box-shadow: inset 0 -2px 0 #ffd447, 0 0 24px #ffb34755; } }
#hud-score.bump { display: inline-block; animation: bump .45s cubic-bezier(.2,1.8,.4,1); }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
}

/* ---------- Side panel ---------- */
#side {
  width: clamp(280px, 30vw, 330px); flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;
}
.section h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); letter-spacing: .1em; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.boss { background: linear-gradient(135deg, #3a1420, #241018); border: 1px solid #6b2433; border-radius: 10px; padding: 10px 12px; }
.boss .t { color: #ff8fa3; font-weight: 900; font-size: 15px; }
.boss .d { color: #f3c6cf; font-size: 13px; margin-top: 2px; }
.layout-name { font-size: 12px; color: var(--muted); }
.section > .boss, .section > .order { margin-top: 8px; }
.order { background: linear-gradient(135deg, #10301f, #13241c); border: 1px solid #2f7a52; border-radius: 10px; padding: 10px 12px; }
.order .t { color: #7ff0b4; font-weight: 900; font-size: 15px; }
.order .d { color: #d4f5e2; font-size: 13px; margin-top: 2px; }
.order .d b { color: #ffd447; }
.order .q { color: #7fb898; font-size: 11px; margin-top: 4px; }
.hint-tag { font-size: 10px; font-weight: 900; color: #10301f; background: #6fe3a5; border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.belt-tag { font-size: 10px; font-weight: 900; color: #2a1a00; background: #ffb347; border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.info .belt-tag { margin-left: 0; }
/* ベルト型の機械：ベルトの縁を思わせる上下の帯 */
.glyph.beltg { border: 2px dashed #ffb347cc; box-shadow: inset 0 5px 0 #0005, inset 0 -5px 0 #0005; }

.cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
.card {
  display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
  cursor: pointer; transition: transform .08s, border-color .1s; text-align: left; color: var(--text);
  width: 100%;
}
.card:hover { transform: translateY(-1px); border-color: var(--accent); }
.card.sold { opacity: .3; pointer-events: none; }
.card.cant { opacity: .55; }
.card.sel { border-color: var(--coin); box-shadow: 0 0 0 1px var(--coin) inset; }
.glyph {
  width: 46px; height: 46px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 24px; color: #fff; text-shadow: 0 2px 0 #0006; border: 2px solid #ffffff30;
}
.card .name { font-weight: 900; font-size: 14px; }
.card .rar { font-size: 10px; font-weight: 700; margin-left: 4px; }
.card .desc { font-size: 12px; color: #b9c1d1; margin-top: 2px; line-height: 1.4; }
.card .desc b { color: var(--accent); }
.card .price { font-weight: 900; color: var(--coin); font-size: 16px; white-space: nowrap; }

.tray { display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; background: #12141a; border: 1px dashed var(--line); border-radius: 10px; padding: 6px; }
.tray .glyph { width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
.tray .glyph.sel { outline: 3px solid var(--coin); outline-offset: 1px; }
.tray .empty { color: var(--muted); font-size: 12px; align-self: center; padding-left: 4px; }

.info { background: #12141a; border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 84px; font-size: 13px; line-height: 1.5; }
.info .hd { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.info .hd .glyph { width: 38px; height: 38px; font-size: 20px; }
.info .nm { font-weight: 900; font-size: 15px; }
.info b { color: var(--accent); }
.info .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.info .tag { display: inline-block; background: #2a2f3c; border-radius: 5px; padding: 0 6px; margin-right: 4px; font-size: 11px; color: #cfd6e4; }
.info .hint { color: var(--muted); }
/* 機械の詳細ポップアップ（右の欄の上に重ねる） */
.info-pop {
  position: fixed; z-index: 8; min-height: 0; overflow-y: auto;
  background: #161922f7; border: 1px solid #ffb34766; border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 12px 32px #000a, 0 0 0 1px #0008; animation: popIn .12s ease-out;
}
.info-pop.pinned { border-color: var(--coin); }
.info-pop.hidden { display: none; }
.info-pop .row { display: flex; flex-wrap: wrap; gap: 6px; }
.pop-close {
  float: right; margin: -4px -6px 0 6px; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
  background: #232734; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
}
.pop-close:hover { color: #fff; border-color: var(--accent); }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.btn {
  display: block; width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
  font-weight: 900; font-size: 16px; color: #1a1205; background: linear-gradient(#ffd447, #ff9f43);
  box-shadow: 0 4px 0 #a35a00; transition: transform .05s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a35a00; }
.btn.sub { background: var(--panel-2); color: var(--text); box-shadow: 0 3px 0 #0a0b0f; border: 1px solid var(--line); font-size: 14px; padding: 9px; }
.btn.small { width: auto; display: inline-block; padding: 6px 12px; font-size: 13px; }
.btn.danger { background: linear-gradient(#ff8a8a, #e05050); box-shadow: 0 3px 0 #7a1f1f; color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.start-dock { position: sticky; bottom: -14px; margin: auto -14px -14px; padding: 10px 14px 14px; background: linear-gradient(transparent, var(--panel) 14%); display: flex; flex-direction: column; gap: 6px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.stats .v { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.tip { font-size: 12px; color: var(--muted); line-height: 1.6; }
.tip kbd { background: #2a2f3c; border-radius: 4px; padding: 0 5px; color: var(--text); font-family: inherit; }

/* ---------- Overlay ---------- */
#overlay { position: fixed; inset: 0; background: #05060acc; display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(3px); padding: 16px; }
#overlay.hidden { display: none; }
#overlay-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px;
  width: min(560px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 80px #000a;
  animation: pop .25s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#overlay-card.wide { width: min(1180px, 100%); }

/* 研究所（スキルツリー） */
.tree-wrap { overflow: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: radial-gradient(circle at 50% 100%, #222838, #11131a 70%); max-height: 60vh; }
.tree { position: relative; margin: 10px auto; }
.tree-lines { position: absolute; left: 0; top: 0; pointer-events: none; }
.tree-lines .tl { stroke: #2f3546; stroke-width: 3; fill: none; }
.tree-lines .tl.on { stroke: #5a6a8a; }
.tree-lines .tl.got { stroke: #ffd447; filter: drop-shadow(0 0 3px #ffd44788); }
.tree .root {
  position: absolute; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #1a1408;
  background: radial-gradient(circle at 35% 30%, #fff6, transparent 50%), var(--coin); box-shadow: 0 0 16px #ffd44766;
}
.tree .lane {
  position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px;
  height: 30px; padding: 0 8px 0 4px; border-radius: 15px; border: 2px solid; background: #151821;
  font-size: 12px; font-weight: 900; white-space: nowrap;
}
.tree .lane img.spr { width: 22px; height: 22px; image-rendering: pixelated; }
.tree .lane span { font-size: 13px; }
.tn {
  position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 12px; padding: 0;
  border: 2px solid #3a4152; background: #1a1e28; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .1s, box-shadow .15s;
}
.tn:hover { transform: translate(-50%, -50%) scale(1.08); }
.tn img.spr { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; }
.tn.mod { border-radius: 50%; border-style: dashed; }
.tn.mod.maxed { border-style: solid; border-color: #f7a8ff; background: #2a1a33; box-shadow: 0 0 10px #f7a8ff66; }
.tn.mod.maxed .tlv { color: #f7a8ff; border-color: #f7a8ff; }
.tn.fam { border-radius: 50%; }
.tn .nb.mod { background: #3a2a52; color: #f7a8ff; border-color: #f7a8ff; }
/* テストモード（研究を自由にオンオフ） */
.devbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border: 1px dashed #5a6a8a; border-radius: 10px; font-size: 12px; color: var(--muted); }
.devbar.on { border-color: #ff8f8f; background: #2a1719; color: #ffc9c9; }
/* 機械の追加効果・代償の表示 */
.mod-line { margin-top: 6px; padding: 5px 8px; border-radius: 8px; background: #2a1a33; border: 1px solid #f7a8ff55; font-size: 12px; color: #e9d3f2; }
.mod-line b { color: #f7a8ff; }
.info .tag.warn { background: #4a2326; color: #ffb3b3; }
/* レバレッジ */
.lev { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 10px; background: #12141a; }
.lev.on { border-color: #f687b3; background: #2a1420; }
.lev-v { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.4; }
.lev-v > b { font-size: 14px; color: #f687b3; }
.dock-est { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 0 4px; color: var(--muted); }
.dock-est b { font-weight: 900; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
.lev-v span { font-size: 11px; color: var(--muted); text-align: center; }
.lev-v span b { color: var(--text); }
.tn .gi { font-size: 20px; font-weight: 900; }
.tn .nb { position: absolute; left: -6px; top: -6px; font-size: 10px; font-weight: 900; background: #232838; color: #cfd6e4; border: 1px solid #4a5163; border-radius: 6px; padding: 0 3px; }
.tn .nb.fam { background: #3a2a52; color: #f7a8ff; border-color: #f7a8ff; }
.tn .tlv { position: absolute; right: -6px; bottom: -7px; font-size: 10px; font-weight: 900; background: #0e1016; color: var(--muted); border: 1px solid #3a4152; border-radius: 7px; padding: 0 4px; }
.tn.locked { opacity: .38; filter: grayscale(1); }
.tn.open { border-color: #5a6a8a; }
.tn.part { border-color: var(--blue); }
.tn.can { border-color: var(--good); box-shadow: 0 0 12px #6fe3a566; animation: canPulse 1.6s ease-in-out infinite; }
.tn.maxed { border-color: var(--coin); background: #2a2410; box-shadow: 0 0 10px #ffd44755; }
.tn.maxed .tlv, .tn.part .tlv { color: var(--coin); border-color: var(--coin); }
.tn.sel { outline: 3px solid #fff; outline-offset: 2px; }
@keyframes canPulse { 50% { box-shadow: 0 0 20px #6fe3a5aa; } }
.research-detail { margin-top: 10px; min-height: 0; }
.research-detail .rd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; }
.research-detail .lv { font-size: 12px; color: var(--accent); font-weight: 700; }
.research-detail .d { color: #c3cad8; font-size: 13px; margin-top: 4px; }
#overlay-card h1 { margin: 0 0 4px; font-family: var(--font-dot); font-size: 44px; color: var(--coin); text-shadow: 0 4px 0 #7a3b00; letter-spacing: .04em; }
#overlay-card h2 { margin: 0 0 12px; font-size: 26px; font-weight: 900; }
#overlay-card p { color: #c3cad8; line-height: 1.7; margin: 8px 0; font-size: 14px; }
#overlay-card .lead { color: var(--muted); }
.result-line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.result-line .v { font-weight: 900; color: var(--coin); }
.result-big { font-size: 40px; font-weight: 900; text-align: center; margin: 8px 0; font-variant-numeric: tabular-nums; }
.result-big.good { color: var(--good); }
.result-big #count-up.done { display: inline-block; animation: bump .4s cubic-bezier(.2,1.8,.4,1); text-shadow: 0 0 18px #6fe3a588; }
.result-line.anim { opacity: 0; animation: fadeUp .3s ease-out forwards; animation-delay: var(--d); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.result-big.bad { color: var(--bad); }
.menu-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.research { display: grid; gap: 8px; margin-top: 10px; }
.rs { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.rs .rs-body { flex: 1; min-width: 0; }
.rs .glyph { width: 34px; height: 34px; font-size: 17px; flex: none; }
.rs.maxed { opacity: .6; }
.rs .n { font-weight: 900; }
.rs .d { font-size: 12px; color: var(--muted); }
.rs .lv { font-size: 12px; color: var(--accent); font-weight: 700; }
.rs-cat { margin: 12px 0 0; font-size: 14px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.patents { font-size: 18px; font-weight: 900; color: var(--blue); }

/* 実績 */
.medal {
  width: 38px; height: 38px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 900; color: #1a1408;
  background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--mc);
  box-shadow: 0 0 0 2px #0006 inset, 0 0 12px color-mix(in srgb, var(--mc) 55%, transparent);
}
.medal.off { background: var(--panel); box-shadow: 0 0 0 2px var(--line) inset; color: var(--muted); font-size: 16px; }
.ach { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.ach:not(.got) { opacity: .62; }
.ach.got { border-color: color-mix(in srgb, var(--coin) 35%, var(--line)); }
.ach .ach-body { flex: 1; min-width: 0; }
.ach .n { font-weight: 900; }
.ach .d { font-size: 12px; color: var(--muted); }
.ach-tier { font-size: 11px; font-weight: 900; margin-left: 4px; }
.ach-r { font-size: 12px; color: var(--blue); font-weight: 700; white-space: nowrap; }
.ach-date { color: var(--muted); font-weight: 500; }
#ach-toasts { position: fixed; top: 76px; right: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(340px, calc(100vw - 32px)); }
.ach-toast {
  display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px;
  background: #15171f; border: 2px solid var(--mc); box-shadow: 0 8px 24px #0008, 0 0 18px color-mix(in srgb, var(--mc) 40%, transparent);
  animation: achIn .45s cubic-bezier(.2, 1.4, .4, 1);
}
.ach-toast .t { font-weight: 900; color: var(--mc); }
.ach-toast .d { font-size: 12px; color: #c3cad8; }
.ach-toast .d b { color: var(--blue); }
.ach-toast.out { animation: achOut .5s ease forwards; }
@keyframes achIn { from { opacity: 0; transform: translateX(60px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes achOut { to { opacity: 0; transform: translateX(40px); } }

/* 挑戦レベルの選択 */
.chal { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
.chal-v { display: flex; flex-direction: column; align-items: center; min-width: 200px; }
.chal-v b { font-size: 18px; color: #f687b3; }
.chal-v span { font-size: 12px; color: var(--muted); }

/* 日報ボーナス */
.reward-h { margin: 16px 0 8px; font-size: 15px; color: var(--coin); }
.rewards { display: grid; gap: 8px; }
.reward {
  display: flex; gap: 10px; align-items: center; text-align: left; cursor: pointer;
  background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px; color: var(--text); font: inherit;
  transition: transform .1s, border-color .1s;
}
.reward:hover { border-color: var(--coin); transform: translateY(-1px); }
.reward .name { font-weight: 900; font-size: 15px; }
.reward .desc { font-size: 12px; color: #b9c1d1; margin-top: 2px; line-height: 1.4; }
.reward .desc b { color: var(--accent); }
.reward .glyph { flex: none; }
.reward-ico { background: linear-gradient(#3a4152, #232836); }

/* 相性・特設マス・改造 */
.syn-tag { font-size: 10px; font-weight: 900; color: #3a0d33; background: #f7a8ff; border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.special-line { font-size: 12px; color: #c3cad8; margin-top: 8px; line-height: 1.6; }
.sp-boost { color: #ffd447; font-weight: 900; }
.sp-broken { color: #ff6b6b; font-weight: 900; }
.kit-line { font-size: 12px; color: #ffd447; margin-top: 6px; }
.glyph { position: relative; }
.glyph img.spr { width: 88%; height: 88%; image-rendering: pixelated; pointer-events: none; user-select: none; }
.glyph .star { position: absolute; top: -6px; right: -6px; font-size: 11px; line-height: 1; color: #ffd447; background: #1a1d26; border: 1px solid #ffd447; border-radius: 8px; padding: 1px 3px; text-shadow: none; }


/* 研究所（カード式。分類タブ → 左から1段目・2段目・3段目） */
.rhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.rhead h2 { margin: 0; }
.rhead .patents { flex: 1; }
.rtabs { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
.rtab {
  position: relative; flex: 1; min-width: 150px; padding: 12px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2);
  color: var(--text); font: inherit; font-weight: 900; font-size: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rtab span { font-size: 11px; font-weight: 500; color: var(--muted); }
.rtab:hover { border-color: var(--accent); }
.rtab.on { border-color: var(--accent); background: #33291a; color: var(--accent); }
.rtab .dot { position: absolute; top: 8px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.rhint { font-size: 12px !important; color: var(--muted) !important; margin: 8px 0 10px !important; }
.rgrid { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 6px; align-items: start; }
.rgrid-arrow { align-self: start; margin-top: 14px; color: #5a6a8a; font-size: 18px; }
.rcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rcol-h { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 10px; background: #12141a; border: 1px solid var(--line); font-size: 12px; }
.rcol-h b { font-size: 15px; color: var(--accent); }
.tier-ok { color: var(--good); }
.tier-ng { color: #ffb3b3; }
.tier-bar { height: 6px; border-radius: 3px; background: #2a2f3c; overflow: hidden; }
.tier-bar i { display: block; height: 100%; background: var(--accent); }
.rcol.closed .rcard { opacity: .72; }
.rcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.rcard.unowned { border-style: dashed; }
.rc-head { display: flex; gap: 10px; align-items: flex-start; }
.rc-head .glyph { width: 44px; height: 44px; flex: none; }
.rc-txt { min-width: 0; }
.rc-nm { font-weight: 900; font-size: 15px; }
.rc-nm .rar { font-size: 10px; margin-left: 4px; }
.rc-lock { margin-left: 6px; font-size: 10px; color: #ffb3b3; border: 1px solid #ffb3b366; border-radius: 5px; padding: 0 4px; }
.rc-desc { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
.rc-desc b { color: #cfd6e4; }
.rbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 8px 10px; border-radius: 10px; text-align: left;
  border: 2px solid #3a4152; background: #171a22; color: var(--text); font: inherit; cursor: pointer; transition: transform .08s, box-shadow .12s;
}
.rbtn .rb-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rbtn .rb-t { font-weight: 900; font-size: 14px; }
.rbtn .rb-lv { margin-left: 8px; font-size: 11px; color: var(--accent); }
.rbtn .rb-d { font-size: 12px; color: #c3cad8; line-height: 1.4; }
.rbtn .rb-d b { color: var(--accent); }
.rbtn .rb-cost { flex: none; font-weight: 900; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #2a3550; color: var(--blue); white-space: nowrap; }
.rbtn.can { border-color: var(--good); box-shadow: 0 0 10px #6fe3a544; }
.rbtn.can .rb-cost { background: var(--good); color: #0c1f14; }
.rbtn.can:hover { transform: translateY(-1px); box-shadow: 0 0 16px #6fe3a588; }
.rbtn.can:active { transform: translateY(1px); }
.rbtn.poor { cursor: default; }
.rbtn.poor .rb-cost { background: #3a2a2a; color: #ffb3b3; }
.rbtn.locked { cursor: default; background: #14161c; border-color: #2a2f3c; }
.rbtn.locked .rb-t, .rbtn.locked .rb-d { color: #8a93a6; }
.rbtn.locked .rb-cost { background: none; color: var(--muted); font-size: 11px; }
.rbtn.maxed { cursor: default; border-color: var(--coin); background: #2a2410; }
.rbtn.maxed .rb-cost { background: none; color: var(--coin); }
.rbtn.mod { border-style: dashed; }
.rbtn.mod .rb-t { color: #f7a8ff; }
.rbtn.mod.can { border-style: solid; }
.rbtn.mod.maxed { border-style: solid; border-color: #f7a8ff; background: #2a1a33; }
.rbtn.mod.maxed .rb-cost { color: #f7a8ff; }
.rbtn.has:not(.maxed) { border-color: var(--blue); }
/* 経営・設備・物流：左から順に進む列 */
.glane { display: flex; align-items: stretch; gap: 10px; margin-bottom: 12px; }
.glane-n { flex: none; width: 64px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; border: 2px solid; border-radius: 12px; background: #12141a; }
.glane-row { flex: 1; display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.gcell { flex: 1; min-width: 170px; display: flex; }
.gcell .rbtn { height: 100%; }
.garrow { align-self: center; color: #5a6a8a; font-size: 14px; }
@media (max-width: 900px) {
  .rgrid { grid-template-columns: 1fr; }
  .rgrid-arrow { display: none; }
}.rbtn.dev { cursor: pointer; }

/* ショップ欄の折りたたみ */
.fold { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em; cursor: pointer; padding: 4px 6px 4px 0; display: flex; align-items: center; gap: 4px; }
.fold:hover { color: var(--text); }
.fold span { letter-spacing: 0; font-weight: 500; }
.section.shop.closed h3 { margin-bottom: 0; }

/* 日の終わりのヒント */
.tipbox { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #1a2030; border: 1px solid #2f3a55; display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.6; text-align: left; }
.tipbox > b { flex: none; color: var(--blue); font-size: 12px; }
.tipbox kbd { font-size: 11px; }
/* 記録 */
.rec-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--coin); color: #2a2000; font-size: 11px; font-weight: 900; vertical-align: 1px; }
.rec-line { color: var(--coin) !important; font-weight: 900; }
.rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rec-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.rec-n { font-size: 12px; color: var(--muted); }
.rec-v { font-size: 22px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; margin: 2px 0; }
.rec-s { font-size: 11px; color: var(--muted); min-height: 1em; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hist-row { display: grid; grid-template-columns: 120px 150px repeat(3, 92px) 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; }
.hist-row.win { border-color: #b8952a; background: #2a2410; }
.hist-when { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; }
.hist-when span { font-size: 11px; }
.hist-res { font-weight: 900; }
.hist-row.win .hist-res { color: var(--coin); }
.hist-num { display: flex; flex-direction: column; font-weight: 700; font-variant-numeric: tabular-nums; }
.hist-num span { font-size: 10px; color: var(--muted); font-weight: 500; }
.hist-board { display: flex; flex-wrap: wrap; gap: 2px; }
.glyph.mini { width: 24px; height: 24px; font-size: 11px; border-radius: 5px; }
@media (max-width: 900px) {
  .rec-grid { grid-template-columns: repeat(2, 1fr); }
  .hist-row { grid-template-columns: 1fr 1fr 1fr; }
  .hist-board { grid-column: 1 / -1; }
}

/* 工場ランク（タイトル画面） */
.rank-pick { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px 10px; border: 1px solid #b8952a; border-radius: 12px; background: #2a2410; }
.rank-pick.solo { border-color: var(--line); background: #12141a; }
.rank-pick .btn { width: 48px; flex: none; font-size: 18px; padding: 12px 0; }
.rank-pick .lev-v > b { font-size: 17px; color: var(--coin); }
.rank-pick .lev-v span { font-size: 12px; }
.promo { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: linear-gradient(135deg, #3a3010, #241d0a); border: 1px solid #b8952a; text-align: left; }
.promo .t { color: var(--coin); font-weight: 900; font-size: 16px; }
.promo .d { color: #f0e2b0; font-size: 13px; margin-top: 2px; }
.promo .d b { color: var(--blue); }
/* はじめての出勤の手引き */
.guide { background: #1f2a1f; border: 1px solid #3d6b3d; border-radius: 10px; padding: 10px 12px; color: #cfe8cf; font-size: 13px; line-height: 1.6; }
.guide .g-h { font-weight: 900; color: #9be29b; margin-bottom: 4px; }
.g-step { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
.g-step .g-ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #5c8f5c; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #9be29b; }
.g-step.done { color: #7f9a7f; }
.g-step.done .g-ck { background: #3d6b3d; color: #fff; }
.g-note { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #3d6b3d; font-size: 12px; }

/* 納期：準備画面の残り表示と、結果画面の進み具合 */
.dock-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); padding: 0 4px; }
.dock-sub b { color: var(--text); }
.dock-sub .last { color: #ff8fa3; font-weight: 900; }
.lev.locked { opacity: .75; }
.result-big .rb-l { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .1em; }
.phase-prog { margin: 8px 0 12px; padding: 10px 12px; border-radius: 12px; background: #12141a; border: 1px solid var(--line); text-align: left; }
.phase-prog.done { border-color: #b8952a; background: linear-gradient(135deg, #3a3010, #241d0a); }
.pp-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.pp-row b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
.pp-bar { height: 10px; border-radius: 5px; background: #0b0d12; border: 1px solid var(--line); margin: 6px 0; overflow: hidden; }
.pp-bar > div { height: 100%; background: linear-gradient(90deg, #ff7a59, #ffd447); }
.phase-prog.done .pp-bar > div { background: linear-gradient(90deg, #ffd447, #6fe3a5); }
.pp-note { font-size: 13px; color: #cfd6e4; }
.pp-note b { color: var(--coin); }
.phase-prog.done .pp-note { color: var(--coin); font-weight: 900; }
.next-phase { font-size: 13px; margin-top: 10px; padding: 8px 12px; border-radius: 10px; border: 1px dashed #b8952a; text-align: left; }
.next-phase b { color: var(--text); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
/* チュートリアル */
#board-wrap { position: relative; }
#coach { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); z-index: 5; padding: 10px 14px; border-radius: 12px;
  background: #162016f2; border: 2px solid #6fe3a5; box-shadow: 0 8px 28px #000a; color: #e4f5e4; font-size: 14px; line-height: 1.6; }
#coach.hidden { display: none; }
.coach-h { font-size: 12px; font-weight: 900; color: #6fe3a5; letter-spacing: .1em; display: flex; gap: 8px; align-items: baseline; }
.coach-h span { color: #9fb89f; font-weight: 500; letter-spacing: 0; }
.coach-t b { color: #fff; }
.coach-b { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 6px; }
.coach-b .btn { width: auto; padding: 6px 22px; }
.coach-skip { background: none; border: 0; color: #9fb89f; font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 4px; }
.coach-skip:hover { color: #fff; }
.coach-target { outline: 3px solid #6fe3a5; outline-offset: 3px; border-radius: 10px; animation: coachPulse 1.1s ease-in-out infinite; }
@keyframes coachPulse { 0%, 100% { outline-color: #6fe3a5; box-shadow: 0 0 0 0 #6fe3a500; } 50% { outline-color: #c9ffe0; box-shadow: 0 0 18px 2px #6fe3a577; } }
.tut-pts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; text-align: left; }
.tut-pts > div { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.tut-pts b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #6fe3a5; color: #10301f; display: inline-flex; align-items: center; justify-content: center; }
.tut-note { margin: 4px 0 10px; padding: 10px 12px; border-radius: 10px; background: #1f2a1f; border: 1px solid #3d6b3d; color: #cfe8cf; font-size: 13px; line-height: 1.6; text-align: left; }
.tut-note b { color: #9be29b; }

/* 研究所：機械ごとの道（設計図 → 習熟1〜5 → ★追加効果） */
.rtrack { display: flex; align-items: center; padding: 2px 2px 0; }
.rtrack i { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3a4152; background: #14161c; color: #6b7385; font-style: normal; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.rtrack s { flex: 1; height: 3px; min-width: 4px; background: #2a2f3c; }
.rtrack i.on { border-color: var(--coin); background: #2a2410; color: var(--coin); }
.rtrack i.on + s { background: var(--coin); }
.rtrack i.bp { border-radius: 7px; }
.rtrack i.mod { width: 30px; height: 30px; font-size: 15px; border-style: dashed; }
.rtrack i.mod.on { border-style: solid; border-color: #f7a8ff; background: #2a1a33; color: #f7a8ff; box-shadow: 0 0 10px #f7a8ff88; }
.rtrack i.next { border-color: var(--good); color: var(--good); animation: canPulse 1.6s ease-in-out infinite; }

/* 大型の機械（2マス） */
.big-tag { font-size: 10px; font-weight: 900; color: #2a1a00; background: #f7a8ff; border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
/* ドラッグ＆ドロップ：指（カーソル）についてくる機械の絵 */
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -70%); display: flex; flex-direction: column; align-items: center; gap: 2px; filter: drop-shadow(0 6px 12px #000a); }
.drag-ghost .glyph { width: 56px; height: 56px; }
.drag-ghost span { display: none; font-size: 11px; font-weight: 900; color: #fff; background: #3a2a52; border: 1px solid #f7a8ff; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.drag-ghost.stash span { display: block; }
.drag-ghost.on-board { opacity: 0; }
/* タッチ：手持ちの機械は指でそのままドラッグできるように（スクロールにしない）。ショップの品は縦にはスクロール、横に動かすとドラッグ */
.tray .glyph { touch-action: none; cursor: grab; }
.cards .card { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.tray, .cards { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
@media (pointer: coarse) {
  .tray .glyph { width: 52px; height: 52px; }
  .btn.small { min-height: 40px; }
  .hud-tools button { min-width: 48px; min-height: 44px; }
  .info-pop .row .btn { min-height: 44px; }
}

/* 研究所へのボタン：研究できるものがあるときは、光って目立つ */
.btn.research-go { display: flex; align-items: center; gap: 12px; text-align: left; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #3b6dff, #7a4dff); color: #fff; box-shadow: 0 4px 0 #23317a, 0 0 22px #6f7bff88; animation: researchGlow 1.6s ease-in-out infinite; }
.btn.research-go::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, #ffffff55 50%, transparent 70%); transform: translateX(-100%); animation: researchShine 2.4s ease-in-out infinite; }
.btn.research-go .rg-ico { font-size: 26px; flex: none; }
.btn.research-go .rg-body { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
.btn.research-go .rg-body > b { font-size: 17px; }

/* ゲームオーバー画面：もらった特許を大きく */

/* =====================================================================
   画面の作り（2026-11 作り直し）
   PC    ：上に HUD ／ 左上に盤面・右に「手持ち・機械の詳細・稼働開始」 ／ 下の段いっぱいにショップ
   スマホ：HUD ／ 盤面（横幅いっぱい） ／ ショップ（左）と手持ち（右の細い列） ／ 稼働開始
   盤面・右の欄・ショップの大きさは ui.js の layout() が画面から計算して --board-w / --board-h に入れる（空白を出さない）
   ===================================================================== */
#app { height: 100vh; height: 100dvh; }
#main {
  flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px;
  grid-template-columns: var(--board-w, 1fr) minmax(0, 1fr);
  grid-template-rows: var(--board-h, 1fr) minmax(0, 1fr);
}
#board-wrap { grid-column: 1; grid-row: 1; padding: 0; min-width: 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
#side { grid-column: 2; grid-row: 1; width: auto; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
#dock { grid-column: 1 / 3; grid-row: 2; min-width: 0; min-height: 0; }
#foot { display: none; }
body.is-title #main { display: flex; padding: 0; }
body.is-title #board-wrap { flex: 1; }
body.is-title #side, body.is-title #dock, body.is-title #foot, body.is-title #hud { display: none; }
body.is-title #board { cursor: default; }
/* 高さのとても低い画面（横向きのスマホなど）：盤面は左いっぱい、右に手持ち（上）とショップ（下） */
body.short #main { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; padding: 6px; }
body.short #board-wrap { grid-row: 1 / 3; }
body.short #dock { grid-column: 2; grid-row: 2; padding: 4px 8px 6px; }

body.short .card .c-top .glyph { width: 36px; height: 36px; }
body.short .card .name { font-size: 13px; }
body.short .buy { padding: 4px 8px; }
body.short .buy .buy-l { font-size: 12px; letter-spacing: 0; }
body.short .buy .px-price { font-size: 14px; }
body.short #side { padding: 6px; }
body.short #side .tray { min-height: 0; }
body.short .start-btn { font-size: 16px; }

/* ---------- 右の欄：手持ち・機械の詳細・今日の情報・稼働開始 ---------- */
#side .side-a { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: none; }
#side .side-b { flex: 1; min-height: 0; display: flex; flex-direction: column; }

#side.side-wide .side-a { grid-column: 1; grid-row: 1; max-height: none; }

.hand { display: flex; flex-direction: column; gap: 6px; background: #12141a; border: 1px solid var(--line); border-radius: 10px; padding: 8px; transition: border-color .12s, box-shadow .12s; }

#side .tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; min-height: 76px; max-height: 176px; overflow-y: auto; padding: 0; border: none; background: none; align-content: start; flex-wrap: nowrap; }
#side .tray .empty { grid-column: 1 / -1; align-self: center; color: var(--muted); font-size: 12px; padding: 0 4px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px 4px; border-radius: 10px; background: #1b1f2a; border: 1px solid var(--line); cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; min-width: 0; }
.tile:hover { border-color: var(--accent); }
#side .tile .glyph { width: 48px; height: 48px; cursor: inherit; }
.tile span { font-size: 10.5px; font-weight: 700; color: #c3cad8; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 設置枠を増やすボタン */

/* 今日の情報・稼働開始 */
.day-info { font-size: 12px; }

.endless-tag { color: #e0b8ff; margin-right: 6px; }

.start-btn { font-size: 18px; padding: 12px; }
.kbd-hint { font-size: 12px; opacity: .7; }
.speed-row { display: flex; gap: 6px; align-items: center; }
.speed-row > span { font-size: 12px; color: var(--muted); }

#side .stats { background: #12141a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

/* ---------- 下の段：ショップ ---------- */
#dock { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 8px; width: auto; height: auto; margin: 0; transition: background .12s, border-color .12s, box-shadow .12s; }
#dock .dock-h { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); min-height: 30px; white-space: nowrap; min-width: 0; }

.shop-hint { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sell-hint { display: none; }
#dock.sell-hot { border-color: var(--bad); background: #3a1a1e; box-shadow: inset 0 0 0 2px #ff6b6b88, 0 0 22px #ff6b6b55; }
#dock.sell-hot .sell-hint { display: inline; color: #ff8f8f; font-weight: 900; font-size: 14px; }
#dock.sell-hot .shop-hint { display: none; }
.reroll {
  --px: 3px; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: none; cursor: pointer;
  background: #2c3448; color: var(--text); font-family: var(--font-dot); font-size: 14px; flex: none;
  box-shadow: inset -3px -3px 0 #1a1f2c, inset 3px 3px 0 #48526c;
  clip-path: polygon(0 var(--px), var(--px) var(--px), var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px), 100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)));
}
.reroll .px-price { color: var(--coin); }
.reroll:hover:not(:disabled) { filter: brightness(1.2); }

@keyframes restockTag { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.3); opacity: 1; } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#dock.running .cards { opacity: .45; pointer-events: none; filter: grayscale(.4); }
/* ショップの段：左にカード、右端に稼働開始 */
#dock .dock-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.dock-start .warn { font-size: 11.5px; padding: 3px 8px; }
.dock-start { flex: none; width: 230px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 6px 0 6px 10px; border-left: 1px dashed var(--line); min-height: 0; overflow: hidden; }

#dock .cards { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 6px 2px 6px; scrollbar-width: thin; scrollbar-color: #3a4152 transparent; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#dock .cards::-webkit-scrollbar { height: 6px; }

/* カード（機械：紺の板／消耗品：緑の券） */
#dock .card {
  position: relative; flex: 1 1 0; min-width: 178px; max-width: 262px; height: 100%; width: auto; display: flex; flex-direction: column; gap: 4px;
  padding: 0 9px 8px; border-radius: 12px; border: 2px solid #3a4558; color: var(--text); text-align: left; overflow: hidden; cursor: pointer;
  background: linear-gradient(#222839, #181c27); grid-template-columns: none; touch-action: pan-x pan-y; transition: transform .1s, border-color .1s, box-shadow .15s;
}
#dock .card:hover { transform: translateY(-3px); border-color: var(--accent); }
/* 高さが足りないときは、説明 → ひとこと の順に削る。購入ボタンはいつも見える */
#dock .card { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); align-content: stretch; }
#dock .card > .detail { min-height: 0; height: 100%; align-self: stretch; display: block; overflow: hidden; -webkit-line-clamp: unset; }

.card .c-kind { margin: 0 -9px 2px; padding: 2px 4px 2px 9px; min-height: 22px; display: flex; gap: 6px; align-items: center; font-size: 10.5px; font-weight: 900; letter-spacing: .1em; background: #2c3448; color: #b9c6e4; }

.card .lock { position: static; margin-left: auto; width: 24px; height: 20px; border-radius: 6px; border: 1px solid #ffffff22; background: #0005; font-size: 11px; cursor: pointer; padding: 0; opacity: .7; line-height: 1; }
.card .lock:hover, .card .lock.on { opacity: 1; border-color: #7fd6ff; }

/* レア度ごとの板の色と演出：コモン＝灰／アンコモン＝緑／レア＝青（ゆっくり光る）／エピック＝紫（光が流れる）／レジェンド＝金と虹（きらめく） */
.card.mach.r1 { border-color: #4a5468; }
.card.mach.r1 .c-kind { background: #343b4c; }

#dock .card.mach.r4 { border-color: transparent; background: linear-gradient(#2a1f46, #1b1630) padding-box, linear-gradient(135deg, #8a4dff, #e0a0ff, #6a3ad8, #c58cff) border-box; box-shadow: 0 0 16px #a46cff55; }
.card.mach.r4 .c-kind { background: #47306e; color: #f0dcff; }
#dock .card.mach.r4::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 35%, #e8c8ff30 50%, transparent 65%); background-size: 260% 100%; animation: cardShine 2.6s linear infinite; }
@keyframes cardShine { from { background-position: 130% 0; } to { background-position: -130% 0; } }
#dock .card.mach.r5 { border-color: transparent; background: linear-gradient(#3a2c0e, #22190a) padding-box, linear-gradient(90deg, #ffd447, #ff7a59, #f687b3, #7fd6ff, #6fe3a5, #ffd447) border-box; background-size: 100% 100%, 300% 100%; animation: legendBorder 3s linear infinite, legendGlow 1.6s ease-in-out infinite; }
.card.mach.r5 .c-kind { background: linear-gradient(90deg, #8a5a00, #c98a00, #8a5a00); color: #fff6d0; }

#dock .card.mach.r5::before { content: ''; position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(circle at 18% 30%, #fff8 0 1.5px, transparent 2.5px), radial-gradient(circle at 78% 22%, #fff8 0 1.5px, transparent 2.5px),
  radial-gradient(circle at 64% 70%, #fff6 0 1.5px, transparent 2.5px), radial-gradient(circle at 30% 82%, #fff6 0 1.5px, transparent 2.5px);
  animation: sparkle 1.8s ease-in-out infinite; }
@keyframes legendBorder { from { background-position: 0 0, 0% 0; } to { background-position: 0 0, 300% 0; } }
@keyframes legendGlow { 0%, 100% { box-shadow: 0 0 12px #ffd44766; } 50% { box-shadow: 0 0 26px #ffd447bb, 0 0 6px #fff6; } }
@keyframes sparkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
#dock .card.item { border: 2px dashed #3fbf9a; background: repeating-linear-gradient(135deg, #16392f 0 10px, #12302a 10px 20px); }
.card.item .c-kind { background: #1f5a48; color: #c9ffe9; }

.glyph.item-g { border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--ic, #3fbf9a), #0d1a16 82%); border: 2px solid var(--ic, #3fbf9a); font-family: var(--font-dot); font-size: 22px; font-weight: 400; }
.card .c-top { display: flex; gap: 8px; align-items: center; min-height: 0; }
.card .c-top .glyph { width: 50px; height: 50px; flex: none; }
.c-nm { min-width: 0; display: flex; flex-direction: column; gap: 3px; }

}

/* 入荷：カードが上から1枚ずつ配られ、光が走る */
/* 入荷：裏向きのカードが1枚ずつ配られて、くるっとめくれる（ガチャの開封のように） */
#dock .card.pop { animation: cardFlip .62s cubic-bezier(.3, 1.3, .5, 1) both; animation-delay: calc(var(--i) * 110ms); }
#dock .card.sale.pop { animation: cardFlip .62s cubic-bezier(.3, 1.3, .5, 1) both, salePulse 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * 110ms), 1.2s; }
#dock .card.mach.r3.pop { animation: cardFlip .62s cubic-bezier(.3, 1.3, .5, 1) both, rareGlow 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 110ms), 1.2s; }
#dock .card.mach.r5.pop { animation: cardFlip .62s cubic-bezier(.3, 1.3, .5, 1) both, legendBorder 3s linear infinite, legendGlow 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * 110ms), 1.2s, 1.2s; }
@keyframes cardFlip {
  0% { opacity: 0; transform: translateY(-46px) rotateY(180deg) scale(.7); filter: brightness(0); }
  45% { opacity: 1; transform: translateY(0) rotateY(90deg) scale(.96); filter: brightness(.25); }
  100% { opacity: 1; transform: none; filter: none; }
}
/* めくれた瞬間、エピックは紫・レジェンドは金色の光がはじける */

@keyframes revealFlash { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: .95; } 100% { opacity: 0; transform: scale(1.4); } }
#dock .card.pop::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 30%, #ffffff70 50%, transparent 70%); background-size: 260% 100%; background-position: 130% 0; animation: dealShine .6s ease-out both; animation-delay: calc(var(--i) * 110ms + .3s); }
@keyframes dealShine { from { background-position: 130% 0; opacity: 1; } to { background-position: -130% 0; opacity: 0; } }

<script>
// ===== ゲームデータ（機械・レイアウト・ボス・納期・研究・実績） =====

const COLS = 13;
const ROWS = 9;
const TILE = 64;
// 納期：ノルマは「期」ごとにまとめて課される。納期は期が始まってから PHASE_DAYS 日目（第1期は4日目）。
// その期の出荷額の合計がノルマに届いた日に次の期へ進み、次の期の納期はそこからまた PHASE_DAYS 日目。納期の日までに届かなければ解雇
// PHASES 期まで達成すると完走（研究を重ねてやっと届く、遠くて高いゴール）。そのあとはハイスコアモード
const PHASE_DAYS = 4; // 2026-11-14：5日 → 4日（1ランのテンポを上げる）
const BOSS_EVERY = 5; // ボス日は5日ごと（納期が4日ごとなので、4日ごとだと第1期の納期とかならず重なる）
const PHASES = 6; // 完走までの期の数
// ハイスコアモード：完走のあと HISCORE_DAYS 日、ノルマなしで出荷した合計を競う。最後に、1B（10^HISCORE_PATENT_FROM）を超えた桁ぶんの特許（数字を小さくしたので 1兆 → 1B）
const HISCORE_DAYS = 5;
const HISCORE_PATENT_FROM = 9;
// エンドレス：完走のあと、第7期・第8期…と期を続ける（納期に届かなかったらおしまい）。
// 第7期のノルマは第6期の 10^ENDLESS_POW 倍、そこから1期ごとに桁の伸びが +1 ずつ増える（10^6 → 10^7 → 10^8 …）ので、どこかで必ず止まる
const ENDLESS_POW = 6;

// hot: true    「炉」の機械。発動するたびにアイテムに熱+1
// charge: n    「N回ごと」の機械。grow: true なら、発動するたびに必要回数が+1（その日のうち）
// size: 2      大型。設置枠を2つ使う（強い機械の代償）
// cells: 2     盤面のマスも2つ使う（横か縦に2マス）。接するベルトのマスと、隣の機械が増える（そのぶん場所を取る）
// upkeep: n    維持費。稼働する日の最初にコインをn枚払う（払えなければその日は止まる）
// family       主に組むビルド（storm=雷雲 / luck=大当たり / gold=黄金 / heat=熱 / bank=金庫 / rep=反復 / stone=原石 / base=基本）
// mod          研究で解放する「追加効果」。c.mod() が true のときだけ効く。別のビルドでも使えるようにする効果が中心
//
// 強さの考え方：1台で完結する機械（溶鉱炉など）は弱め。相方・並べ方・代償が要る機械ほど強い
// 急冷槽の倍率：×(1 + 熱²÷2)。熱4で×9、熱8で×33、熱12で×73、熱20で×201（2026-11-14：数字を小さくするため3乗→2乗）
// 前は「熱1につき×1.5の重ねがけ」（指数）で、雷や還流で熱が何百もたまると 10^50 を超えた。3乗なら熱がいくら増えても桁は数個しか増えない
const QUENCH_DIV = 2;
function quenchMul(h) {
  return 1 + (h * h) / QUENCH_DIV;
}
// ボット・探索用の見込み：運の機械（宝くじ機・呪いの炉）は期待値ではなく、手堅く見積もった値で数える
// 期待値は「めったに出ない大当たり」に引っぱられるので、ノルマを安定して超えられるかの目安にならない
function cautiousMean(p, f) {
  const r = p * Math.sqrt(f) + (1 - p);
  return r * r;
}
const THUNDER_K = 3; // 落雷：n回目の雷は ×(1 + K/n)。何回でも効くが1発ずつ伸びが緩くなる（合計は回数の3乗くらい）
// 呪いの炉の消滅率：25%。隣の招き猫1匹につき -15%、追加効果「魔除け」で -10%（最低5%）
function cursedRisk(cats, mod) {
  return Math.max(0.05, 0.2 - 0.15 * cats - (mod ? 0.1 : 0));
}

// 数字の単位：1,000 ごとに K（千）→ M（百万）→ B（十億）→ T（兆）。その先は 1.23e15 のような書き方
// （2026-11-14：前は 万・億・兆・京… の漢字の単位だったが、読みにくいのでやめた）
const UNITS = ['', 'K', 'M', 'B', 'T'];
// 単位ごとの色（K=水色 → M=緑 → B=金 → T=橙 → その先=桃・紫）
const UNIT_COLORS = ['#ffffff', '#7fd6ff', '#6fe3a5', '#ffd447', '#ff8a5c', '#f687b3', '#c58cff', '#ff6b9a'];
function unitIndex(v) {
  return v >= 1e3 ? Math.floor(Math.log10(v) / 3) : 0;
}
// 単位の名前（K・M・B・T、その先は「e15」など）
function unitName(k) {
  return k < UNITS.length ? UNITS[k] : 'e' + k * 3;
}

// ===== ユーティリティ =====
function fmt(n) {
  if (!isFinite(n)) return '∞';
  // 分裂ゲートなどで生まれる小数（0.5 など）は1桁まで出す
  if (n < 10 && n % 1 !== 0) return String(Math.floor(n * 10) / 10);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('ja-JP');
  const k = Math.floor(Math.log10(n) / 3);
  if (k >= UNITS.length) return n.toExponential(2).replace('e+', 'e').replace(/\.?0+e/, 'e');
  const m = n / Math.pow(10, 3 * k);
  const s = m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2);
  return s.replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1') + UNITS[k];
}

function fmtMult(f) {
  if (f >= 10000) return fmt(f);
  if (Number.isInteger(f)) return String(f);
  return (f < 10 ? f.toFixed(2) : f.toFixed(1)).replace(/0+$/, '').replace(/\.$/, '');
}

function niceRound(n) {
  if (n < 100) return Math.round(n);
  const p = Math.pow(10, Math.floor(Math.log10(n)) - 1);
  return Math.round(n / p) * p;
}

// ===== 納期のノルマ =====
// 期ごとのノルマ表（レバレッジ0のとき）。その期の出荷額の「合計」で数える。
// 実際のノルマ = この表 × レイアウト倍率 × 3^レバレッジ
// 第1〜3期は、はじめての人が置き方を覚えれば届く。第4期は研究なしで置き方がうまい人が届く高さ。第5期からは研究が要る。
// 第6期（完走）は、研究を重ねて、組み合わせも見つけてやっと届くゴール
// 2026-11-14：設置枠が「前倒し達成で +1」「1.8倍ずつ」で増えやすくなり、研究なしのボットでも第5期を越えたので、第4〜6期を上げた（1億→3億、1兆→100兆、1000京→10垓）
// 同日（あとで）：所持の上限を「設置枠 +2」→「+4」にしたら、研究なしのボットの第5期が 3割 → 6割に上がったので、第5期を 100兆 → 300兆 に
// 2026-11-14（大型アップデート）：納期4日・レア度・納期達成ガチャ・数字の圧縮のあとで測り直した。
//   研究なしのうまいボット：第4期は全員（中央 ×1000）、第5期の中央はノルマの1/13 → 第4期 3億→1B、第5期 300T→50T（3〜4割が届く高さ）
//   研究半分：第6期を6回中5回完走（中央でノルマの20倍）→ 第6期 1e21→1e22
// 同日（公開前の最終調整）：錬金の作り直しのあと、初心者の第2期 50%・第3期 17%、うまい人の第5期 12% と厳しくなったので、第2期 30K→20K、第3期 1M→500K、第5期 50T→15T
// 確認：初心者 第2期 58%・第3期 33%、うまい人 第5期 50%（15T のとき）→ 第5期を 20T に
const PHASE_TABLE = [3000, 20000, 500000, 1e9, 2e13, 1e22];
function quotaFor(phase) {
  const n = PHASE_TABLE.length;
  if (phase <= n) return niceRound(PHASE_TABLE[phase - 1]);
  // エンドレス（第7期から）：10^6、10^7、10^8 … 倍と、伸びがだんだん大きくなる
  let pow = 0;
  for (let p = n + 1; p <= phase; p++) pow += ENDLESS_POW + (p - n - 1);
  return niceRound(PHASE_TABLE[n - 1] * Math.pow(10, pow));
}
// 納期を達成したときのコイン：基本 6 + 2×期、超過ボーナス（ノルマの2倍ごとに+1、最大5）、前倒しボーナス（納期まで残った1日につき EARLY_COIN）
const PHASE_COIN_BASE = 6;
const PHASE_COIN_STEP = 2;
const EARLY_COIN = 2;
// 特許：1日終えるごとに DAY_PATENT、納期を達成するごとに PHASE_PATENT × 期（第1期 3、第2期 6 … 第6期 18。後の期ほど多い。レバレッジは納期ぶんにだけ）
const DAY_PATENT = 0.5;
const PHASE_PATENT = 3;
// rnd：乱数の出どころ（省くと Math.random）。日替わりチャレンジでは日付から作った乱数を渡す
function pick(arr, rnd = Math.random) {
  return arr[Math.floor(rnd() * arr.length)];
}

function shuffle(arr, rnd = Math.random) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== 種から作る乱数（日替わりチャレンジ用） =====
// mulberry32：32ビットの整数ひとつから、いつも同じ並びの乱数を作る
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 文字列 → 32ビットの整数（FNV-1a）
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
// 日替わりチャレンジの日付（その端末の今日）。seed は YYYYMMDD の整数
function dailyInfo(d = new Date()) {
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const dd = d.getDate();
  const p = (n) => String(n).padStart(2, '0');
  const seed = y * 10000 + m * 100 + dd;
  // その日に1回だけもらえる特許（日によって 3〜6）
  return { seed, key: String(seed), label: `${y}/${p(m)}/${p(dd)}`, bonus: 3 + (hashStr('bonus' + seed) % 4) };
}

      '..DYYYYD..',
      '.DYWWYYOD.',
      '.DYWYYYOD.',
      '.DYYYYYOD.',
      '.DYYYYYOD.',
      '.DYYYYOOD.',
      '..DOOOOD..',
      '...DDDD...',
      '..........',
    ],
  },
  capsule: {
    pal: { R: '#ff5a8a', W: '#e8ecf3', D: '#8a2a4a', S: '#ffffff', K: '#8b93a5' },
    px: [
      '...RRRR...',
      '..RSRRRR..',
      '.RSRRRRRR.',
      '.RRRRRRRR.',
      '.DDDDDDDD.',
      '.WWWWWWWW.',
      '.WWWWWWWW.',
      '..WWWWWW..',
      '...KKKK...',
      '..........',
    ],
  },
  bolt: {
    pal: { Y: '#fff27a', D: '#c9a800' },
    px: [
      '.....YY...',
      '....YY....',
      '...YY.....',
      '..YYYYYY..',
      '.....YY...',
      '....YY....',
      '...YD.....',
      '..YD......',
      '.YD.......',
      '..........',
    ],
  },
};
// SVG の data URI にする（1ドット = 1×1 の四角）
function iconURI(name) {
  const d = ICON_DEFS[name];
  let rects = '';
  d.px.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const c = d.pal[row[x]];
      if (c) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
    }
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" shape-rendering="crispEdges">${rects}</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
// アイコンの CSS を1回だけ作って <head> に入れる
(function injectIcons() {
  const css = ['.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.18em;background:center/contain no-repeat;image-rendering:pixelated;flex:none}'];
  for (const name of Object.keys(ICON_DEFS)) css.push(`.ic-${name}{background-image:url("${iconURI(name)}")}`);
  const el = document.createElement('style');
  el.textContent = css.join('\n');
  document.head.appendChild(el);
})();
// HTML に入れるアイコン（例：ICON('trophy')）
function ICON(name) {
  return `<i class="ic ic-${name}" aria-hidden="true"></i>`;
}

<script>
// ===== 効果音（WebAudioで合成。音源ファイル不要） =====
const Sfx = (() => {
  let ctx = null;
  let master = null;
  let muted = false;
  let quiet = false; // タイトルのデモ中は鳴らさない
  const last = {};
  const SCALE = [0, 2, 4, 7, 9]; // ペンタトニック。連続で上がっていくと気持ちいい

  function ensure() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.22;
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp);
        comp.connect(ctx.destination);
      } catch (e) {
        ctx = null;
      }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function throttle(key, ms) {
    const now = performance.now();
    if (last[key] && now - last[key] < ms) return false;
    last[key] = now;
    return true;
  }

  function tone(freq, dur = 0.08, type = 'triangle', vol = 0.4, when = 0, slide = 0) {
    if (muted || quiet || !ensure()) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function noise(dur = 0.05, vol = 0.3, freq = 2500, when = 0) {
    if (muted || quiet || !ensure()) return;
    const t = ctx.currentTime + when;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
  }

  // 周波数が動くノイズ（ヒュッという音）
  function sweep(dur, vol, f0, f1, when = 0) {
    if (muted || quiet || !ensure()) return;
    const t = ctx.currentTime + when;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 3;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
  }

  function note(step, base = 330) {
    const s = Math.max(0, Math.min(22, step));
    const oct = Math.floor(s / 5);
    return base * Math.pow(2, oct + SCALE[s % 5] / 12);
  }

  return {
    unlock: ensure,
    toggle() {
      muted = !muted;
      return muted;
    },
    get muted() {
      return muted;
    },
    set quiet(v) {
      quiet = !!v;
    },
    // ショップの入荷：カードが1枚ずつ並ぶのに合わせて、軽い音が上がっていく（n 枚）
    restock(n = 4, gap = 0.075) {
      for (let i = 0; i < n; i++) tone(520 * Math.pow(2, (i * 2) / 12), 0.06, i % 2 ? 'triangle' : 'square', 0.05, i * gap);
    },
    // 消耗品を使う
    item() {
      tone(520, 0.08, 'triangle', 0.2, 0, 1.5);
      tone(1040, 0.12, 'sine', 0.14, 0.06);
    },
    // 売却：コインが戻る
    sell() {
      tone(990, 0.06, 'square', 0.08);
      tone(740, 0.1, 'square', 0.08, 0.05);
    },
    add(step) {
      if (!throttle('add', 28)) return;
      tone(note(step, 300), 0.07, 'triangle', 0.22);
    },
    mult(step) {
      if (!throttle('mult', 26)) return;
      tone(note(step + 2, 300), 0.12, 'square', 0.09);
      tone(note(step + 4, 300), 0.1, 'triangle', 0.16, 0.025);
    },
    rank(tier) {
      if (!throttle('rank', 40)) return;
      tone(500 + tier * 160, 0.12, 'sine', 0.25, 0, 1.6);
    },
    jackpot() {
      [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.18, 'square', 0.1, i * 0.05));
    },
    ship(mag, combo = 1) {
      if (!throttle('ship', 45)) return;
      // 連続出荷が続くほど音程が上がる（最大1オクターブ）
      const f = (400 + Math.min(14, mag) * 70) * Math.pow(2, Math.min(24, combo - 1) / 24);
      tone(f, 0.09, 'sine', 0.3);
      tone(f * 1.5, 0.14, 'sine', 0.22, 0.05);
      noise(0.04, 0.15, 6000);
    },
    quota() {
      [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.22, i % 2 ? 'triangle' : 'square', 0.12, i * 0.07));
    },
    hammer() {
      noise(0.05, 0.5, 3200);
      tone(900, 0.05, 'square', 0.08, 0, 0.6);
    },
    dup() {
      if (!throttle('dup', 50)) return;
      tone(700, 0.08, 'sine', 0.2, 0, 1.5);
      tone(1050, 0.08, 'sine', 0.15, 0.05, 1.5);
    },
    destroy() {
      if (!throttle('destroy', 60)) return;
      noise(0.18, 0.5, 400);
      tone(160, 0.2, 'sawtooth', 0.12, 0, 0.4);
    },
    coin() {
      if (!throttle('coin', 60)) return;
      tone(1320, 0.06, 'square', 0.08);
      tone(1760, 0.1, 'square', 0.08, 0.05);
    },
    click() {
      tone(660, 0.04, 'triangle', 0.18);
    },
    buy() {
      tone(880, 0.06, 'square', 0.1);
      tone(1320, 0.08, 'square', 0.1, 0.05);
    },
    place() {
      noise(0.04, 0.4, 900);
      tone(220, 0.06, 'triangle', 0.25);
    },
    fail() {
      [0, -3, -7, -12].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.3, 'sawtooth', 0.1, i * 0.18));
    },
    error() {
      tone(180, 0.12, 'square', 0.1);
    },
    // 単位（万・億…）に到達
    unit(u) {
      if (!throttle('unit', 120)) return;
      const b = 660 * Math.pow(2, Math.min(u, 6) / 6);
      tone(b, 0.1, 'sine', 0.2);
      tone(b * 1.5, 0.16, 'sine', 0.16, 0.06);
    },
    // このランで初めての単位を突破
    unitBig(u) {
      const root = 262 * Math.pow(2, Math.min(u, 8) / 8);
      [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(root * Math.pow(2, s / 12), 0.35, i % 2 ? 'triangle' : 'square', 0.1, i * 0.045));
      tone(root / 2, 0.6, 'sawtooth', 0.12, 0, 1.02);
      sweep(0.5, 0.35, 400, 6000);
    },
    milestone(lv) {
      if (!throttle('milestone', 150)) return;
      const b = 523 * Math.pow(2, lv / 6);
      [0, 4, 7, 12].forEach((s, i) => tone(b * Math.pow(2, s / 12), 0.14, 'square', 0.09, i * 0.05));
    },
    // 実績解除：ファンファーレ
    trophy() {
      if (!throttle('trophy', 300)) return;
      [0, 7, 12, 16, 19, 24].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.22, i < 3 ? 'square' : 'triangle', 0.09, i * 0.07));
    },
    // 分裂ゲート：ポコッと2つに割れる音
    split() {
      if (!throttle('split', 50)) return;
      tone(520, 0.07, 'triangle', 0.2, 0, 1.8);
      tone(780, 0.07, 'triangle', 0.16, 0.045, 1.8);
    },
    // 触媒槽：泡が弾けるような小さな音
    cata() {
      if (!throttle('cata', 60)) return;
      tone(880, 0.09, 'sine', 0.12, 0, 1.4);
      tone(1320, 0.1, 'sine', 0.08, 0.03, 1.3);
    },
    zap() {
      if (!throttle('zap', 70)) return;
      noise(0.12, 0.45, 5000);
      tone(1800, 0.15, 'sawtooth', 0.08, 0, 0.15);
    },
    // 大落雷：バリバリ＋ゴロゴロ
    thunder() {
      noise(0.25, 0.7, 4500);
      noise(0.5, 0.5, 180, 0.05);
      tone(90, 0.6, 'sawtooth', 0.15, 0.03, 0.5);
      [0, 7, 12].forEach((s, i) => tone(660 * Math.pow(2, s / 12), 0.12, 'square', 0.07, 0.02 + i * 0.04));
    },
    whoosh() {
      if (!throttle('whoosh', 80)) return;
      sweep(0.35, 0.5, 3000, 300);
      tone(500, 0.25, 'sine', 0.12, 0.05, 2);
    },
    absorb() {
      if (!throttle('absorb', 60)) return;
      tone(700, 0.18, 'sine', 0.2, 0, 0.3);
    },
    release() {
      if (!throttle('release', 60)) return;
      tone(200, 0.25, 'sine', 0.25, 0, 4);
      noise(0.1, 0.35, 1500, 0.05);
    },
    tick() {
      if (!throttle('tick', 35)) return;
      tone(1500 + Math.random() * 400, 0.025, 'square', 0.05);
    },
  };
})();

<script>
// ===== 機械のドット絵 =====
// 16×16 のドット絵を、四角・円・線の組み合わせで描いて自動で黒フチを付ける。
// 横置きの機械は下に台座（機械の色）付き、ベルト型はベルトの上のプレートに乗るので台座なし。
// 盤面では 3倍（48px）、ベルト型は 2倍（32px）、ショップなどのアイコンはCSSで拡大する（ぼかさない）。
const Sprites = (() => {
  const N = 16;
  const OUTLINE = '#14161d';
  // パレット（機械ごとの色は MACHINES[type].color と shade() で作る）
  const C = {
    d: '#3a3f4f', g: '#6b7385', l: '#aab3c5', w: '#f4f6fb', k: '#14161d',
    r: '#e0483a', R: '#8a2a22', o: '#ff8a3d', y: '#ffd447', Y: '#b07800', e: '#fff1b8',
    h: '#ff5a2a', b: '#4f8fe0', c: '#7fd6ff', n: '#2a5fa8', G: '#3fb56b', L: '#a6f06a',
    p: '#9a63e6', P: '#f7a8ff', m: '#c86b98', s: '#9aa3ad', S: '#5d646d', B: '#8a5a2e', T: '#d9b27c',
    t: '#0f9d8a', v: '#5a1f2a',
  };

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    const r = f((n >> 16) & 255), g = f((n >> 8) & 255), b = f(n & 255);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  // ---- 16×16 の描画キャンバス（色の文字列を入れる配列） ----
  function makePen() {
    const px = new Array(N * N).fill(null);
    const col = (c) => C[c] || c;
    const P = {
      px,
      dot(x, y, c) {
        x = Math.round(x);
        y = Math.round(y);
        if (x >= 0 && y >= 0 && x < N && y < N) px[y * N + x] = col(c);
      },
      rect(x, y, w, h, c) {
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) P.dot(x + i, y + j, c);
      },
      // 中心 (cx, cy) 半径 r の円（cx, cy は .5 刻みで偶数幅の円も描ける）
      disc(cx, cy, r, c) {
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const dx = x + 0.5 - cx;
          const dy = y + 0.5 - cy;
          if (dx * dx + dy * dy <= r * r) P.dot(x, y, c);
        }
      },
      ring(cx, cy, r0, r1, c, skip) {
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const dx = x + 0.5 - cx;
          const dy = y + 0.5 - cy;
          const d = dx * dx + dy * dy;
          if (d <= r1 * r1 && d >= r0 * r0 && !(skip && skip(dx, dy))) P.dot(x, y, c);
        }
      },
      line(x0, y0, x1, y1, c) {
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
        for (let i = 0; i <= n; i++) P.dot(x0 + ((x1 - x0) * i) / n, y0 + ((y1 - y0) * i) / n, c);
      },
      // 行ごとに左右の幅を決めて塗る（台形・三角形・つぼの形）
      rows(y0, y1, cx, halfOf, c) {
        for (let y = y0; y <= y1; y++) {
          const h = halfOf(y);
          if (h < 0) continue;
          for (let x = Math.round(cx - h); x <= Math.round(cx + h - 1); x++) P.dot(x, y, c);
        }
      },
    };
    return P;
  }

  // 横置きの機械の台座
  function base(P, color) {
    P.rect(1, 13, 14, 2, shade(color, -0.4));
    P.rect(1, 12, 14, 1, color);
    P.rect(2, 12, 3, 1, shade(color, 0.35));
  }

  // ---- 機械ごとの絵 ----
  const ART = {
    grinder(P) {
      P.rect(7, 8, 2, 4, 'd');
      P.disc(8, 6.5, 5.5, 'l');
      P.disc(8, 6.5, 4.2, 'g');
      for (const [x, y] of [[8, 1], [3, 6], [13, 6], [4, 3], [12, 3], [4, 10], [12, 10]]) P.dot(x, y, 'l');
      P.disc(8, 6.5, 1.6, C.b);
      P.dot(14, 1, 'y');
      P.dot(13, 2, 'e');
      P.dot(15, 3, 'y');
    },
    furnace(P) {
      P.rect(10, 1, 3, 4, 'd');
      P.dot(11, 0, 'l');
      P.rect(2, 4, 12, 8, 'r');
      P.rect(2, 6, 12, 1, 'R');
      P.rect(2, 9, 12, 1, 'R');
      for (const x of [5, 9, 13]) P.dot(x, 5, 'R');
      for (const x of [3, 7, 11]) P.dot(x, 7, 'R');
      P.rect(5, 7, 6, 5, 'k');
      P.rect(6, 8, 4, 4, 'h');
      P.rect(7, 9, 2, 3, 'y');
    },
    cooler(P) {
      P.rows(2, 11, 8, (y) => 3 + Math.round(Math.abs(y - 6.5) * 0.55), 'c');
      P.rows(2, 11, 10, (y) => 1 + Math.round(Math.abs(y - 6.5) * 0.28), C.n);
      P.rect(3, 2, 10, 1, 'w');
      P.dot(6, 0, 'w');
      P.dot(9, 1, 'w');
      P.dot(11, 0, 'w');
    },
    splitter(P) {
      P.disc(4, 8, 3.2, 'c');
      P.dot(3, 7, 'w');
      P.line(8, 8, 11, 5, 'w');
      P.line(8, 8, 11, 11, 'w');
      P.disc(13, 4, 2.2, 'c');
      P.disc(13, 12, 2.2, 'c');
    },
    thunder(P) {
      P.rect(6, 4, 4, 8, 'd');
      P.rect(7, 4, 1, 8, 'g');
      P.rect(5, 7, 6, 1, 'g');
      P.disc(8, 2.5, 2, 'y');
      P.dot(7, 2, 'e');
      P.line(13, 0, 11, 3, 'y');
      P.line(11, 3, 14, 3, 'y');
      P.line(14, 3, 12, 7, 'y');
      P.line(3, 1, 2, 3, 'e');
      P.line(2, 3, 4, 3, 'e');
      P.line(4, 3, 3, 5, 'e');
    },
    resonator(P) {
      P.rect(5, 2, 2, 7, 'l');
      P.rect(9, 2, 2, 7, 'l');
      P.rect(5, 8, 6, 2, 'l');
      P.rect(7, 10, 2, 2, 'g');
      P.dot(5, 2, 'w');
      for (const [x, y] of [[3, 3], [2, 5], [3, 7], [12, 3], [13, 5], [12, 7]]) P.dot(x, y, C.t);
      for (const [x, y] of [[1, 4], [1, 6], [14, 4], [14, 6]]) P.dot(x, y, 'c');
    },
    duplicator(P) {
      P.rect(2, 7, 12, 5, 'G');
      P.rect(2, 6, 12, 1, 'd');
      P.rect(3, 9, 10, 1, shade(C.G, -0.4));
      P.rect(4, 1, 5, 6, 'w');
      P.rect(7, 2, 5, 5, 'e');
      P.rect(8, 3, 3, 1, 'g');
      P.rect(8, 5, 3, 1, 'g');
      P.dot(12, 8, 'L');
    },
    battery(P) {
      P.rect(6, 1, 4, 2, 'l');
      P.rect(4, 3, 8, 9, 'G');
      P.rect(4, 3, 8, 3, 'L');
      P.rect(7, 7, 2, 4, 'w');
      P.rect(6, 8, 4, 2, 'w');
      P.dot(4, 4, 'w');
    },
    lottery(P) {
      P.rect(2, 2, 11, 10, 'y');
      P.rect(2, 2, 11, 1, 'e');
      P.rect(3, 4, 9, 4, 'w');
      for (const x of [4, 7, 10]) {
        P.rect(x - 0.5, 5, 2, 1, 'r');
        P.dot(x + 0.5, 6, 'r');
      }
      P.rect(4, 9, 7, 2, 'Y');
      P.rect(13, 4, 1, 5, 'l');
      P.disc(13.5, 3, 1.3, 'r');
    },
    cat(P) {
      P.disc(8, 6.5, 4.8, 'w');
      P.rect(3, 1, 2, 3, 'w');
      P.rect(11, 1, 2, 3, 'w');
      P.dot(4, 2, 'P');
      P.dot(11, 2, 'P');
      P.rect(5, 6, 2, 1, 'k');
      P.rect(10, 6, 2, 1, 'k');
      P.dot(8, 8, 'm');
      P.rect(4, 10, 8, 1, 'r');
      P.dot(8, 11, 'y');
      P.rect(13, 3, 2, 4, 'w');
      P.dot(13, 3, 'P');
      P.dot(2, 7, 'P');
      P.dot(13, 7, 'P');
    },
    catalyst(P) {
      P.rect(6, 1, 4, 4, 'l');
      P.rect(5, 1, 6, 1, 'w');
      P.rows(5, 13, 8, (y) => 2 + (y - 5) * 0.65, 'l');
      P.rows(9, 13, 8, (y) => 2 + (y - 5) * 0.65 - 0.6, 'L');
      P.dot(6, 10, 'w');
      P.dot(9, 7, 'L');
      P.dot(10, 4, 'L');
      P.dot(8, 11, 'w');
    },
    cursed(P) {

    alchemist(P) {
      P.rows(0, 9, 8, (y) => 0.5 + y * 0.55, 'p');
      P.rows(0, 9, 9.5, (y) => y * 0.25, shade(C.p, -0.3));
      P.rect(3, 8, 10, 1, 'y');

      P.line(1, 12, 4, 15, 'P');

    },
    // 金床とハンマー
    artisan(P) {

      P.rect(1, 7, 2, 1, 'g');

    // スピーカー
    amp(P) {

      P.disc(5.5, 7.5, 3.3, 'l');

    pump(P) {

      P.line(9, 1, 13, 1, C.t);
      P.line(13, 1, 13, 5, C.t);
      P.line(10, 2, 12, 4, C.t);
      P.disc(8, 8, 1.6, 'c');
    },
    sieve(P) {
      P.rect(1, 2, 14, 3, 'B');
      P.rect(1, 2, 14, 1, 'T');
      P.rect(2, 5, 12, 4, 'l');
      for (let y = 5; y < 9; y++) for (let x = 2 + (y % 2); x < 14; x += 2) P.dot(x, y, 'g');
      P.rect(1, 5, 1, 4, 'B');

      P.dot(5, 10, 's');

    mason(P) {
      P.rect(1, 6, 10, 6, 's');

    // 溶解炉：どろどろに溶けた金属が入ったるつぼ
    melter(P) {
      P.rows(3, 11, 8, (y) => 5.5 - (y - 3) * 0.3, '#b84a6a');

      P.dot(6, 0, 'o');

    },
    prism(P) {
      P.line(0, 9, 5, 7, 'w');
      P.rows(1, 11, 7, (y) => (y - 1) * 0.55 + 0.5, '#cfefff');
      P.rows(4, 11, 8.5, (y) => (y - 4) * 0.3, '#9fd8f5');
      P.dot(7, 3, 'w');
      ['r', 'o', 'y', 'G', 'b', 'p'].forEach((c, i) => P.line(11, 6 + i * 0.6, 15, 4 + i * 1.3, c));
    },
    // ----- レジェンド -----
    // 賢者の石：赤い宝石と金の光
    philosopher(P) {
      P.rows(2, 13, 8, (y) => (y <= 6 ? (y - 2) * 1.1 + 1 : (13 - y) * 0.75 + 1), '#e04a6a');

      P.dot(7, 5, 'w');
      P.rows(9, 12, 9, (y) => (12 - y) * 0.5 + 0.5, '#8a2a3a');
      for (const [x, y] of [[1, 2], [14, 3], [2, 12], [13, 11], [15, 7], [0, 7]]) P.dot(x, y, 'y');
    },
    // 太陽炉：燃える太陽と炉の口
    solar(P) {
      for (let a = 0; a < 8; a++) {
        const t = (a / 8) * Math.PI * 2;
        P.line(8 + Math.cos(t) * 4.5, 6 + Math.sin(t) * 4.5, 8 + Math.cos(t) * 7, 6 + Math.sin(t) * 6, a % 2 ? 'o' : 'y');
      }
      P.disc(8, 6, 4.2, 'o');
      P.disc(8, 6, 3, 'y');
      P.disc(7.4, 5.2, 1.2, 'e');
      P.rect(5, 10, 6, 2, 'k');
      P.rect(6, 10, 4, 2, 'h');
    },
    // 王冠：金の冠と宝石
    crown(P) {
      P.rect(2, 7, 12, 4, 'y');
      P.rect(2, 10, 12, 1, 'Y');
      for (const x of [2, 7, 12]) P.rows(2, 6, x + 1, (y) => (y - 2) * 0.45 + 0.5, 'y');
      P.disc(3, 2, 1, 'r');
      P.disc(8, 1.5, 1, 'c');
      P.disc(13, 2, 1, 'G');
      P.dot(5, 8, 'r');
      P.dot(8, 8, 'c');
      P.dot(11, 8, 'G');
      P.rect(3, 7, 10, 1, 'e');
    },
    // 時計塔：塔と大きな文字盤
    clock(P) {
      P.rect(4, 3, 8, 9, 'S');
      P.rect(5, 3, 1, 9, 's');
      P.rows(0, 2, 8, (y) => y * 1.5 + 1, 'B');
      P.disc(8, 6.5, 3.2, 'w');
      P.ring(8, 6.5, 2.9, 3.4, 'Y');
      P.line(8, 6.5, 8, 4, 'k');
      P.line(8, 6.5, 10, 6.5, 'k');
      P.dot(8, 6, 'r');
    },
  };

  // 黒フチ：透明なマスの上下左右に色があればフチにする
  function outline(px) {
    const out = px.slice();
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (px[y * N + x]) continue;
      const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const nx = x + dx;
        const ny = y + dy;
        return nx >= 0 && ny >= 0 && nx < N && ny < N && px[ny * N + nx];
      });
      if (near) out[y * N + x] = OUTLINE;
    }
    return out;
  }

  const cache = {};
  function build(type) {
    const d = MACHINES[type];
    const P = makePen();
    if (!d.belt) base(P, d.color);
    (ART[type] || ((Q) => Q.disc(8, 6.5, 5, d.color)))(P);
    const px = outline(P.px);
    const cv = document.createElement('canvas');
    cv.width = N;
    cv.height = N;
    const g = cv.getContext('2d');
    for (let i = 0; i < px.length; i++) {
      if (!px[i]) continue;
      g.fillStyle = px[i];
      g.fillRect(i % N, Math.floor(i / N), 1, 1);
    }
    return { cv, url: cv.toDataURL() };
  }
  function get(type) {
    return (cache[type] ||= build(type));
  }
  return {
    canvas: (type) => get(type).cv,
    url: (type) => get(type).url,
  };
})();

<script>
// ===== ゲームロジック =====
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const SPAWN_INTERVAL = 0.5;

const META_KEY = 'conveyor-alchemy-meta-v1';

const G = {
